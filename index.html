<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;
const STORE_KEY="amz-conv-v6";
const DEFAULT={suppliers:[],marketplaces:[],blacklist:[],
  qtyMode:"catalog",dupMode:"price",minStock:0,maxQty:0,floorMarginPct:0,
  zeroKeepDays:90,maxDeltaPct:20,minProducts:100};
const EU_MP=[
{code:"IT",name:"Amazon.it",cur:"EUR"},{code:"DE",name:"Amazon.de",cur:"EUR"},
{code:"FR",name:"Amazon.fr",cur:"EUR"},{code:"ES",name:"Amazon.es",cur:"EUR"},
{code:"NL",name:"Amazon.nl",cur:"EUR"},{code:"BE",name:"Amazon.com.be",cur:"EUR"},
{code:"PL",name:"Amazon.pl",cur:"PLN"},{code:"SE",name:"Amazon.se",cur:"SEK"},
{code:"UK",name:"Amazon.co.uk",cur:"GBP"}
];

const DEFAULT_TIERS=[
  {upTo:50,markupPct:18,flatFee:7},
  {upTo:100,markupPct:13,flatFee:10},
  {upTo:160,markupPct:12,flatFee:18},
  {upTo:null,markupPct:10,flatFee:30}
];

function sortTiers(tiers){
  return [...tiers].sort((a,b)=>{
    if(a.upTo===null||a.upTo===undefined)return 1;
    if(b.upTo===null||b.upTo===undefined)return -1;
    return a.upTo-b.upTo;
  });
}
// Ordinamento difensivo: il find() assume scaglioni crescenti. Riordinandoli
// dall'interfaccia, senza sort si applicherebbe il markup dello scaglione sbagliato.
function applyTiers(rp,tiers){
  if(!tiers||tiers.length===0)return rp;
  const tier=sortTiers(tiers).find(t=>t.upTo===null||t.upTo===undefined||rp<=t.upTo);
  if(!tier)return rp;
  return rp*(1+(tier.markupPct||0)/100)+(tier.flatFee||0);
}
function tierKeyFor(rp,tiers){
  if(!tiers||tiers.length===0)return "\u2014";
  const sorted=sortTiers(tiers);
  const idx=sorted.findIndex(t=>t.upTo===null||t.upTo===undefined||rp<=t.upTo);
  const t=sorted[idx];
  if(!t)return "\u2014";
  return (t.upTo===null||t.upTo===undefined)?">"+((sorted[idx-1]||{}).upTo||0)+"\u20ac":"\u2264"+t.upTo+"\u20ac";
}
// Il vecchio controllo era ean.length<8: passavano stringhe non numeriche e
// codici di lunghezza arbitraria, che Amazon rifiuta (errori 5501 / 8541).
function normalizeEAN(raw){
  const v=String(raw==null?"":raw).trim().replace(/\s+/g,"");
  if(!/^\d+$/.test(v))return null;
  if([8,12,13,14].indexOf(v.length)<0)return null;
  let sum=0;
  for(let i=v.length-2,w=3;i>=0;i--,w=(w===3?1:3))sum+=Number(v[i])*w;
  if(((10-(sum%10))%10)!==Number(v[v.length-1]))return null;
  return v;
}

function migrate(raw){
  if(!raw)return DEFAULT;
  const suppliers=(raw.suppliers||[]).map(s=>{
    if(s.tiers)return s;
    return{...s,tiers:[{upTo:null,markupPct:s.markupPct??10,flatFee:s.flatFee??10}]};
  });
  return{...DEFAULT,...raw,suppliers};
}

function loadLocal(){try{return migrate(JSON.parse(localStorage.getItem(STORE_KEY))||null)}catch{return DEFAULT}}
function persistLocal(c){localStorage.setItem(STORE_KEY,JSON.stringify(c))}
async function loadRemote(){try{const r=await fetch("/api/config");if(!r.ok)return null;return await r.json();}catch{return null;}}
async function persistRemote(c){try{await fetch("/api/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(c)});}catch(e){console.warn("Config remote save failed:",e);}}
// Parser che gestisce i campi quotati: con il vecchio split(delimiter) bastava
// un campo tipo "Pirelli; P Zero" per far slittare tutte le colonne successive
// e pubblicare un prezzo letto dalla colonna sbagliata, senza alcun errore.
function parseCSV(text,delimiter){
  if(!text)return{h:[],r:[]};
  const src=text.charCodeAt(0)===0xfeff?text.slice(1):text;
  const d=delimiter||";";
  const recs=[];let field="",rec=[],q=false;
  for(let i=0;i<src.length;i++){
    const ch=src[i];
    if(q){
      if(ch==='"'){if(src[i+1]==='"'){field+='"';i++;}else q=false;}
      else field+=ch;
      continue;
    }
    if(ch==='"'&&field===""){q=true;continue;}
    if(ch===d){rec.push(field);field="";continue;}
    if(ch==="\r")continue;
    if(ch==="\n"){rec.push(field);recs.push(rec);rec=[];field="";continue;}
    field+=ch;
  }
  if(field!==""||rec.length){rec.push(field);recs.push(rec);}
  const ne=recs.filter(r=>r.some(c=>c.trim()!==""));
  if(ne.length<2)return{h:[],r:[]};
  const h=ne[0].map(x=>x.trim());
  const r=ne.slice(1).map(cols=>{const o={};h.forEach((k,i)=>{o[k]=(cols[i]==null?"":cols[i]).trim()});return o});
  return{h,r};
}
function fCol(hs,n){return n?(hs.find(h=>h.toLowerCase()===String(n).toLowerCase())||null):null}

// ─── Formato template Amazon (lato browser) ──────────────────────────────────
// Stesse regole del server (netlify/functions/_lib/template.mjs): le colonne si
// risolvono per pattern sulla riga degli attributi, mai per posizione fissa.
const FIELD_PATTERNS={
  sku:/^contribution_sku#1\.value$/,
  action:/^::record_action$/,
  extIdType:/^externally_assigned_product_identifier#1\.type$/,
  extId:/^externally_assigned_product_identifier#1\.value$/,
  asin:/^merchant_suggested_asin#1\.value$/,
  condition:/^condition_type#1\.value$/,
  channel:/^fulfillment_availability#1\.fulfillment_channel_code$/,
  quantity:/^fulfillment_availability#1\.quantity$/,
  leadtime:/^fulfillment_availability#1\.lead_time_to_ship_max_days$/,
  price:/our_price#1\.schedule#1\.value_with_tax$/,
  minPrice:/minimum_seller_allowed_price#1\.schedule#1\.value_with_tax$/,
  maxPrice:/maximum_seller_allowed_price#1\.schedule#1\.value_with_tax$/
};
const REQUIRED_FIELDS=["sku","action","extIdType","extId","condition","channel","quantity","price"];
const FIELD_LABELS={sku:"SKU",action:"Azione",extIdType:"Tipo ID",extId:"EAN",asin:"ASIN",condition:"Condizione",channel:"Canale",quantity:"Quantità",leadtime:"Tempo gestione",price:"Prezzo",minPrice:"Prezzo min",maxPrice:"Prezzo max"};
const VOCAB={
  it_IT:{create:"Crea o modifica",ean:"EAN",conditionNew:"Nuovo",channelMerchant:"Gestito dal venditore (default)"},
  en_GB:{create:"Create or update",ean:"EAN",conditionNew:"New",channelMerchant:"Merchant Fulfilled (default)"},
  de_DE:{create:"Erstellen oder aktualisieren",ean:"EAN",conditionNew:"Neu",channelMerchant:"Vom Verkäufer versandt (Standard)"},
  fr_FR:{create:"Créer ou mettre à jour",ean:"EAN",conditionNew:"Neuf",channelMerchant:"Expédié par le vendeur (par défaut)"},
  es_ES:{create:"Crear o actualizar",ean:"EAN",conditionNew:"Nuevo",channelMerchant:"Gestionado por el vendedor (predeterminado)"}
};
function vocabFor(t){return VOCAB[t&&t.contentLanguageTag]||VOCAB.it_IT}

function resolveColumns(t){
  const attrs=((t.headerRows||[])[(t.attributeRow||5)-1]||[]).map(v=>String(v==null?"":v).trim());
  const cols={};
  Object.keys(FIELD_PATTERNS).forEach(f=>{const i=attrs.findIndex(a=>FIELD_PATTERNS[f].test(a));if(i>=0)cols[f]=i;});
  return{cols,missing:REQUIRED_FIELDS.filter(f=>cols[f]===undefined),attrs};
}
// Solo per il .txt: un file di testo non ha tipi di cella, quindi il prezzo va
// scritto con il separatore decimale del marketplace.
// Nell'.xlsx il prezzo deve restare un NUMERO: come testo Amazon lo rifiuta con
// l'errore 13006 "Formato cella errato. Imposta il formato in Excel su Numero".
function fmtPrice(v,mp){const s=Number(v).toFixed(2);return mp==="UK"?s:s.replace(".",",")}
function round2(n){return Math.round(Number(n)*100)/100}
function priceColumns(t){const r=resolveColumns(t);return ["price","minPrice","maxPrice"].map(f=>r.cols[f]).filter(i=>i!==undefined)}

// Espande i record compatti in righe larghe nCols. qty 0 = riga di disattivazione.
function expandRecords(records,t,opts){
  opts=opts||{};
  const r=resolveColumns(t);
  if(r.missing.length)throw new Error("Template incompleto: mancano "+r.missing.map(m=>FIELD_LABELS[m]||m).join(", "));
  const cols=r.cols,voc=vocabFor(t),mp=opts.marketplace||"IT",lead=opts.leadtime,n=t.nCols;
  return records.map(rec=>{
    const row=new Array(n).fill("");
    const put=(f,v)=>{if(cols[f]!==undefined)row[cols[f]]=v};
    put("sku",rec.sku);put("action",voc.create);
    // Con un ASIN verificato scriviamo quello e NON l'EAN: le istruzioni del
    // template dicono "l'ASIN OPPURE l'ID esterno", e l'ASIN inchioda l'offerta
    // al prodotto giusto invece di lasciare l'abbinamento ad Amazon.
    if(rec.asin&&cols.asin!==undefined){put("asin",rec.asin);}
    else{put("extIdType",voc.ean);put("extId",rec.ean);}
    put("condition",voc.conditionNew);put("channel",voc.channelMerchant);
    put("quantity",Number(rec.qty)||0);
    if(lead!==null&&lead!==undefined&&lead!=="")put("leadtime",Number(lead));
    put("price",round2(rec.price));
    if(rec.minPrice!=null)put("minPrice",round2(rec.minPrice));
    if(rec.maxPrice!=null)put("maxPrice",round2(rec.maxPrice));
    return row;
  });
}

// .txt tab-delimited: equivale al "Salva come → Testo (delimitato da tabulazioni)" di Excel.
function buildTxt(t,dataRows,opts){
  opts=opts||{};
  const n=t.nCols, mp=opts.marketplace||"IT";
  const dec=new Set(opts.decimalCols||priceColumns(t));
  const pad=r=>{const a=(r||[]).slice(0,n);while(a.length<n)a.push("");return a};
  const esc=v=>String(v==null?"":v).replace(/\t/g," ").replace(/\r?\n/g," ");
  const fmt=(v,i)=>(dec.has(i)&&typeof v==="number")?fmtPrice(v,mp):esc(v);
  const lines=[];
  (t.headerRows||[]).forEach(hr=>lines.push(pad(hr).map(esc).join("\t")));
  dataRows.forEach(dr=>lines.push(pad(dr).map(fmt).join("\t")));
  return lines.join("\r\n")+"\r\n";
}

// .xlsx costruito a celle sparse: con 140 colonne e migliaia di righe scrivere
// anche le celle vuote significherebbe oltre un milione di celle inutili.
function buildXlsx(t,dataRows){
  if(typeof XLSX==="undefined")throw new Error("Libreria Excel non caricata, ricarica la pagina");
  const ws={},n=t.nCols;
  const dec=new Set(priceColumns(t));
  const set=(r,c,v)=>{
    if(v===""||v===null||v===undefined)return;
    const addr=XLSX.utils.encode_cell({r:r,c:c});
    if(typeof v==="number"){
      // I prezzi restano numerici con due decimali: Amazon rifiuta il testo (errore 13006)
      ws[addr]=dec.has(c)?{t:"n",v:v,z:"0.00"}:{t:"n",v:v};
    }else ws[addr]={t:"s",v:String(v)};
  };
  const hdr=t.headerRows||[];
  hdr.forEach((row,ri)=>{for(let c=0;c<n;c++)set(ri,c,row[c])});
  dataRows.forEach((row,ri)=>{for(let c=0;c<n;c++)set(hdr.length+ri,c,row[c])});
  ws["!ref"]=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(hdr.length+dataRows.length-1,0),c:n-1}});
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,(t.sheetName||"Modello").slice(0,31));
  return XLSX.write(wb,{bookType:"xlsx",type:"array"});
}

function dlBlob(data,filename,mime){
  const b=new Blob([data],{type:mime});
  const u=URL.createObjectURL(b);
  const a=document.createElement("a");
  a.href=u;a.download=filename;document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(u);
}

// Legge le prime 6 righe del foglio "Modello" dal template scaricato da Seller Central.
async function parseTemplateFile(file){
  if(typeof XLSX==="undefined")throw new Error("Libreria Excel non caricata, ricarica la pagina");
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:"array",sheetRows:6});
  const sheetName=wb.SheetNames.indexOf("Modello")>=0?"Modello":(wb.SheetNames.find(x=>/model|modello|template|vorlage|plantilla|modèle/i.test(x))||wb.SheetNames[0]);
  const ws=wb.Sheets[sheetName];
  if(!ws)throw new Error("Foglio dati non trovato nel file");
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:"",blankrows:true});
  while(aoa.length<6)aoa.push([]);
  const a1=String((aoa[0]||[])[0]||"");
  if(a1.indexOf("settings=")!==0)throw new Error('La cella A1 non inizia con "settings=": non sembra un template Amazon');
  const num=(k,d)=>{const m=a1.match(new RegExp(k+"=(\\d+)"));return m?parseInt(m[1],10):d};
  const str=re=>{const m=a1.match(re);return m?m[1]:null};
  const labelRow=num("labelRow",4),attributeRow=num("attributeRow",5),dataRow=num("dataRow",7);
  // nCols = ultima colonna con etichetta o nome campo valorizzato
  let nCols=0;
  [labelRow-1,attributeRow-1].forEach(ri=>{
    const row=aoa[ri]||[];
    for(let c=row.length-1;c>=0;c--){if(String(row[c]||"").trim()!==""){nCols=Math.max(nCols,c+1);break}}
  });
  if(!nCols)throw new Error("Non ho trovato la riga dei nomi campo nel foglio "+sheetName);
  const pad=r=>{const a=(r||[]).slice(0,nCols).map(v=>v==null?"":String(v));while(a.length<nCols)a.push("");return a};
  const t={
    source:file.name,sheetName:sheetName,nCols:nCols,
    labelRow:labelRow,attributeRow:attributeRow,dataRow:dataRow,
    marketplaceId:str(/primaryMarketplaceId=amzn1\.mp\.o\.([A-Z0-9]+)/),
    contentLanguageTag:str(/contentLanguageTag=([a-zA-Z_]+)/),
    headerRows:[pad(aoa[0]),pad(aoa[1]),pad(aoa[2]),pad(aoa[3]),pad(aoa[4]),pad(aoa[5])]
  };
  const rc=resolveColumns(t);
  if(rc.missing.length)throw new Error("Colonne obbligatorie non trovate: "+rc.missing.map(m=>FIELD_LABELS[m]||m).join(", "));
  return t;
}

// Scarica dal server il template completo (righe di intestazione incluse).
let _templateCache=null;
async function getFullTemplate(force){
  if(_templateCache&&!force)return _templateCache;
  const r=await fetch("/api/template?full=1");
  if(!r.ok)throw new Error("Template non disponibile (HTTP "+r.status+")");
  const d=await r.json();
  if(!d.template)throw new Error("Template non configurato");
  _templateCache=d.template;
  return _templateCache;
}


const S={
  card:{background:"var(--bg-card)",border:"1px solid var(--border)",borderRadius:12,padding:20,marginBottom:14},
  label:{display:"block",fontSize:11,color:"var(--text-label)",marginBottom:4,fontWeight:700,textTransform:"uppercase",letterSpacing:1},
  input:{width:"100%",padding:"8px 12px",background:"var(--bg-input)",border:"1px solid var(--border-input)",borderRadius:8,color:"var(--text)",fontSize:14,boxSizing:"border-box"},
  badge:bg=>({background:bg||"var(--badge-neutral)",color:"var(--text)",padding:"2px 10px",borderRadius:20,fontSize:11,fontWeight:600})
};

function Card({children,style,accent}){return<div style={{...S.card,...(accent?{border:`1px solid ${accent}`}:{}),...style}}>{children}</div>}
function Inp({label,...p}){return<div style={{marginBottom:10}}>{label&&<label style={S.label}>{label}</label>}<input {...p} style={{...S.input,...p.style}}/></div>}
function Sel({label,options,...p}){return<div style={{marginBottom:10}}>{label&&<label style={S.label}>{label}</label>}<select {...p} style={S.input}>{options.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}</select></div>}
function Btn({children,onClick,v="pri",style,disabled}){
  const bg={pri:"#6366f1",ok:"#10b981",danger:"#ef4444",ghost:"transparent"}[v];
  const bd=v==="ghost"?"1px solid var(--ghost-border)":"none";
  const cl=v==="ghost"?"var(--ghost-text)":"#fff";
  return<button onClick={onClick} disabled={disabled} style={{padding:"8px 16px",borderRadius:8,border:bd,background:bg,color:cl,fontWeight:600,fontSize:13,cursor:disabled?"not-allowed":"pointer",opacity:disabled?.4:1,transition:"all .15s",...style}}>{children}</button>
}

// ─── Mini bar chart ──────────────────────────────────────────────────────────
function MiniBar({data,color,height=60}){
  if(!data||data.length===0)return null;
  const max=Math.max(...data.map(d=>d.v),1);
  return(
    <div style={{display:"flex",alignItems:"flex-end",gap:3,height,padding:"4px 0"}}>
      {data.map((d,i)=>(
        <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
          <div title={`${d.label}: ${d.v.toLocaleString()}`} style={{width:"100%",height:`${(d.v/max)*100}%`,minHeight:2,background:color||"var(--chart-bar)",borderRadius:"3px 3px 0 0",transition:"height .3s"}}/>
        </div>
      ))}
    </div>
  );
}

// ─── Storico Tab ─────────────────────────────────────────────────────────────
function HistoryTab(){
  const[records,setRecords]=useState([]);
  const[loading,setLoading]=useState(true);
  const[error,setError]=useState(null);
  const[expanded,setExpanded]=useState(null);

  const fetchHistory=async()=>{
    setLoading(true);setError(null);
    try{
      const r=await fetch("/api/history");
      if(!r.ok)throw new Error(`HTTP ${r.status}`);
      const data=await r.json();
      setRecords(data);
    }catch(e){setError(e.message);}
    finally{setLoading(false);}
  };

  useEffect(()=>{fetchHistory();},[]);

  const deleteRecord=async(id)=>{
    if(!confirm("Eliminare questo record?"))return;
    try{
      await fetch(`/api/history?id=${id}`,{method:"DELETE"});
      setRecords(r=>r.filter(x=>x.id!==id));
    }catch(e){alert("Errore: "+e.message);}
  };

  const fmt=iso=>{
    const d=new Date(iso);
    return d.toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric"})+" "+d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
  };

  const fmtDelta=(curr,prev,field)=>{
    if(!prev)return null;
    const d=curr[field]-prev[field];
    if(d===0)return null;
    const color=d>0?"#10b981":"#ef4444";
    return<span style={{color,fontSize:11,marginLeft:6}}>{d>0?"+":""}{d.toLocaleString()}</span>;
  };

  // Dati per grafico trend ultimi 30 giorni
  const chartData=records.slice(0,30).reverse().map(r=>({

// ─── TiersEditor ─────────────────────────────────────────────────────────────
function TiersEditor({tiers,onChange}){
  const updateTier=(i,field,val)=>{const next=tiers.map((t,j)=>j===i?{...t,[field]:val}:t);onChange(next);};
  const addTier=()=>{const last=tiers[tiers.length-1];const prev=tiers[tiers.length-2];const newUpTo=prev?(prev.upTo||0)+50:100;onChange([...tiers.slice(0,-1),{upTo:newUpTo,markupPct:last.markupPct,flatFee:last.flatFee},last]);};
  const removeTier=(i)=>{if(tiers.length<=1)return;onChange(tiers.filter((_,j)=>j!==i));};
  const previewNet=(tier,ex)=>{const sell=applyTiers(ex,[{...tier,upTo:null}]);return(sell-sell*0.08-ex).toFixed(2);};
  const midPrice=(tier,i)=>{if(i===0)return Math.min(tier.upTo||50,40);const prev=tiers[i-1];const lo=prev.upTo||0;const hi=tier.upTo||lo+100;return Math.round((lo+hi)/2);};
  return(
    <div style={{marginBottom:10}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <label style={S.label}>Fasce di rincaro (prezzo fornitore)</label>
        <Btn v="ghost" onClick={addTier} style={{fontSize:11,padding:"4px 10px"}}>+ Fascia</Btn>
      </div>
      <div style={{background:"var(--info-bg)",border:"1px solid var(--info-border)",borderRadius:8,padding:"10px 14px",marginBottom:10,fontSize:12,color:"var(--info-text)",lineHeight:1.6}}>
        <strong>Come funzionano le fasce:</strong> prezzo_fornitore × (1 + ricarico%) + quota_fissa<br/>
        La prima fascia il cui limite ≥ prezzo fornitore viene applicata. L'ultima (senza limite) vale per tutti i prezzi superiori.<br/>
        Il <strong>netto stimato</strong> è già al netto della commissione Amazon 8%.
      </div>
      {tiers.map((tier,i)=>{
        const ex=midPrice(tier,i);const net=previewNet(tier,ex);const sellEx=applyTiers(ex,[{...tier,upTo:null}]).toFixed(2);const isLast=i===tiers.length-1;
        return(
          <div key={i} style={{background:"var(--tier-bg)",border:"1px solid var(--tier-border)",borderRadius:10,padding:"12px 14px",marginBottom:8}}>
            <div style={{display:"flex",gap:10,alignItems:"flex-end",flexWrap:"wrap"}}>
              <div style={{minWidth:120}}>
                <label style={S.label}>{isLast?"Oltre (∞)":"Fino a (€)"}</label>
                {isLast?<div style={{...S.input,color:"var(--text-muted)",cursor:"not-allowed",background:"var(--bg)"}}>∞ oltre</div>
                :<input type="number" value={tier.upTo??""} onChange={e=>updateTier(i,"upTo",e.target.value===""?null:parseFloat(e.target.value))} style={S.input} placeholder="es. 100"/>}
              </div>
              <div style={{minWidth:110}}><label style={S.label}>Ricarico %</label><input type="number" value={tier.markupPct} onChange={e=>updateTier(i,"markupPct",parseFloat(e.target.value)||0)} style={S.input}/></div>
              <div style={{minWidth:110}}><label style={S.label}>Quota fissa (€)</label><input type="number" value={tier.flatFee} onChange={e=>updateTier(i,"flatFee",parseFloat(e.target.value)||0)} style={S.input}/></div>
              <div style={{flex:1,minWidth:160,background:"var(--bg-stat)",borderRadius:8,padding:"8px 12px",fontSize:12,lineHeight:1.7}}>
                <div style={{color:"var(--text-muted)"}}>Es. a <strong style={{color:"var(--text)"}}>{ex}€</strong>:</div>
                <div>Vendo a <strong style={{color:"var(--accent-form)"}}>{sellEx}€</strong></div>
                <div>Netto: <strong style={{color:parseFloat(net)>0?"#10b981":"#ef4444"}}>{net}€</strong></div>
              </div>
              {tiers.length>1&&<Btn v="danger" onClick={()=>removeTier(i)} style={{fontSize:11,padding:"5px 10px",alignSelf:"flex-end"}}>✕</Btn>}
            </div>
          </div>
        );
      })}
      <div style={{fontSize:11,color:"var(--text-muted)",marginTop:4}}>
        {tiers.map((t,i)=>{const lbl=t.upTo===null?`oltre`:` ≤${t.upTo}€`;return<span key={i} style={{marginRight:10}}>{lbl}: +{t.markupPct}%+{t.flatFee}€</span>;})}
      </div>
    </div>
  );
}

// ─── ConvertTab (caricamento manuale dei CSV) ────────────────────────────────
// Percorso di riserva: quando l'FTP non è raggiungibile carichi i CSV a mano.
// Non applica la disattivazione a quantità 0 (non conosce lo storico delle SKU
// pubblicate, che vive lato server): produce solo le righe degli articoli attivi.

function resolveDuplicate(existing,candidate,mode,supplierPriority){
  if(mode==="priority"){
    const pa=supplierPriority[existing.supplier]??999;
    const pb=supplierPriority[candidate.supplier]??999;
    if(pb<pa)return candidate;
    if(pb===pa&&candidate.price<existing.price)return candidate;
    return existing;
  }
  return candidate.price<existing.price?candidate:existing;
}

function ConvertTab({config:c}){
  const[ups,sUps]=useState({});
  const[mpC,sMpC]=useState(c.marketplaces[0]?.code||"");
  const[qtyMode,sQtyMode]=useState(c.qtyMode||"catalog");
  const[dupMode,sDupMode]=useState(c.dupMode||"price");
  const[progress,setProgress]=useState(null);
  const[res,sRes]=useState(null);
  const[saving,setSaving]=useState(false);

  const hFile=useCallback((sn,file)=>{if(!file)return;sRes(null);const r=new FileReader();r.onload=e=>{sUps(p=>({...p,[sn]:{fn:file.name,d:e.target.result}}))};r.readAsText(file,"utf-8")},[]);
  const rmUp=n=>{sUps(p=>{const x={...p};delete x[n];return x});sRes(null);};

  const supplierPriority=Object.fromEntries(c.suppliers.map((s,i)=>[s.name,i]));

  const convert=useCallback(()=>{
    const mp=c.marketplaces.find(m=>m.code===mpC);if(!mp)return;
    sRes(null);
    setTimeout(()=>{
      setProgress({phase:1,pct:5,msg:"Lettura file fornitori..."});
      const bl=new Set(c.blacklist);
      const em={};
      let tR=0,tS=0,badEan=0,dup=0,blk=0,below=0;
      const errs=[];
      const tierCounts={},tierPriceSum={};
      const entries=Object.entries(ups);
      const total=entries.length;
      const minStock=Number(c.minStock||0);
      const maxQty=Number(c.maxQty||0);
      const floorPct=Number(c.floorMarginPct||0);

      const step=idx=>{
        if(idx>=total){
          setProgress({phase:2,pct:80,msg:"Costruzione righe..."});
          setTimeout(()=>{
            if(errs.length&&Object.keys(em).length===0){sRes({error:errs.join("\n")});setProgress(null);return;}
            const sorted=Object.values(em).sort((a,b)=>a.ean.localeCompare(b.ean));
            const records=[],previewData=[],sc={};
            let priceSum=0;
            for(const it of sorted){
              const raw=qtyMode==="fixed"?Number(mp.quantity):(it.stock!==null?it.stock:Number(mp.quantity));
              const qty=maxQty>0?Math.min(raw,maxQty):raw;
              const rec={sku:it.sku,ean:it.ean,qty:qty,price:Math.round(it.price*100)/100};
              if(floorPct>0)rec.minPrice=Math.round(it.rp*(1+floorPct/100)*100)/100;
              records.push(rec);
              sc[it.supplier]=(sc[it.supplier]||0)+1;
              tierCounts[it.tierKey]=(tierCounts[it.tierKey]||0)+1;
              tierPriceSum[it.tierKey]=(tierPriceSum[it.tierKey]||0)+it.rp;
              priceSum+=it.rp;
              if(previewData.length<50)previewData.push({sku:it.sku,ean:it.ean,costPrice:it.rp,salePrice:it.price,supplier:it.supplier,qty:String(qty),tierKey:it.tierKey,status:"attivo"});
            }
            const avg_price_by_tier={};
            Object.keys(tierCounts).forEach(k=>{avg_price_by_tier[k]=tierPriceSum[k]/tierCounts[k]});
            setProgress({phase:3,pct:100,msg:"✓ Completato"});
            setTimeout(()=>{
              setProgress(null);
              sRes({
                records:records,
                warnings:errs,
                stats:{marketplace:mpC,leadtime:mp.leadtime,total_products:sorted.length,total_rows:records.length,
                  zeroed:0,dropped_from_tracking:0,total_read:tR,total_skipped:tS,bad_ean:badEan,
                  below_min_stock:below,duplicates_resolved:dup,blacklisted:blk,by_supplier:sc,by_tier:tierCounts,
                  avg_price_by_tier:avg_price_by_tier,avg_price_total:sorted.length>0?priceSum/sorted.length:0,
                  errors:errs,previewData:previewData,generated_at:new Date().toISOString()}
              });
            },300);
          },50);
          return;
        }
        const pct=5+Math.round((idx/total)*70);
        const[sn,up]=entries[idx];
        setProgress({phase:1,pct,msg:"Elaborazione "+sn+" ("+(idx+1)+"/"+total+")..."});
        setTimeout(()=>{
          const sup=c.suppliers.find(s=>s.name===sn);
          if(!sup){step(idx+1);return;}
          const{h,r}=parseCSV(up.d,sup.delimiter);
          if(!h.length){errs.push(sn+": CSV vuoto o illeggibile");step(idx+1);return;}
          const skC=fCol(h,sup.skuCol),enC=fCol(h,sup.eanCol),prC=fCol(h,sup.priceCol);
          const stC=sup.stockCol?fCol(h,sup.stockCol):null;
          if(!skC||!enC||!prC){errs.push(sn+": colonne non trovate: "+[!skC&&sup.skuCol,!enC&&sup.eanCol,!prC&&sup.priceCol].filter(Boolean).join(", "));step(idx+1);return;}
          if(sup.stockCol&&!stC)errs.push(sn+": colonna stock '"+sup.stockCol+"' non trovata, uso la quantità di fallback");
          for(const row of r){
            tR++;
            const ean=normalizeEAN(row[enC]);
            const sku=(row[skC]||"").trim();
            const rp=parseFloat((row[prC]||"0").replace(",","."));
            if(!ean){badEan++;tS++;continue;}
            if(!sku||isNaN(rp)||rp<=0){tS++;continue;}
            if(bl.has(ean)){blk++;continue;}
            let stock=null;
            if(stC){
              const parsed=parseInt(String(row[stC]||"").replace(/[^\d-]/g,""),10);
              stock=Number.isFinite(parsed)?Math.max(0,parsed):0;
            }
            if(stock!==null&&minStock>0&&stock<minStock){below++;continue;}
            const tiers=sup.tiers||[];
            const candidate={sku,ean,price:applyTiers(rp,tiers),supplier:sn,stock,tierKey:tierKeyFor(rp,tiers),rp};
            if(em[ean]){dup++;em[ean]=resolveDuplicate(em[ean],candidate,dupMode,supplierPriority);}
            else em[ean]=candidate;
          }
          step(idx+1);
        },10);
      };
      step(0);
    },30);
  },[ups,mpC,qtyMode,dupMode,c]);

  const saveToHistory=async()=>{
    if(!res?.stats)return;setSaving(true);
    try{
      const r=await fetch("/api/history",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...res.stats,source:"manuale"})});
      if(!r.ok)throw new Error("HTTP "+r.status);
      alert("✓ Salvato nello storico");
    }catch(e){alert("Errore: "+e.message)}
    finally{setSaving(false)}
  };

  if(!c.suppliers.length||!c.marketplaces.length)return<Card><p style={{color:"#f59e0b",textAlign:"center",margin:0}}>⚠️ Configura almeno un fornitore e un marketplace.</p></Card>;
  const uc=Object.keys(ups).length;

  return(
    <div>
      <Card style={{background:"var(--info-bg)",border:"1px solid var(--info-border)"}}>
        <div style={{fontSize:12,color:"var(--info-text)",lineHeight:1.6}}>
          <strong>Percorso di riserva.</strong> Da qui carichi i CSV a mano quando l'FTP non risponde.
          A differenza del tab 🤖 Auto, questo file contiene solo gli articoli disponibili: non aggiunge le
          righe a quantità 0 per gli articoli spariti dal listino, perché lo storico delle SKU pubblicate
          vive lato server. Per la sincronizzazione quotidiana usa il tab Auto.
        </div>
      </Card>

      <Card>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:14}}>
          <Sel label="Marketplace" value={mpC} onChange={e=>{sMpC(e.target.value);sRes(null);}}
            options={c.marketplaces.map(m=>({v:m.code,l:(EU_MP.find(x=>x.code===m.code)||{}).name||m.code}))}/>
          <Sel label="Sorgente quantità" value={qtyMode} onChange={e=>{sQtyMode(e.target.value);sRes(null);}}
            options={[{v:"catalog",l:"📦 Stock fornitore"},{v:"fixed",l:"🔒 Quantità fissa"}]}/>
          <Sel label="EAN duplicati" value={dupMode} onChange={e=>{sDupMode(e.target.value);sRes(null);}}
            options={[{v:"price",l:"💰 Prezzo più basso"},{v:"priority",l:"⭐ Priorità fornitore"}]}/>
        </div>
        {dupMode==="priority"&&<p style={{fontSize:11,color:"var(--text-muted)",margin:0}}>💡 La priorità segue l'ordine nel tab 🏭 Fornitori: {c.suppliers.map(s=>s.name).join(" → ")||"—"}</p>}
      </Card>

      <div style={{marginBottom:14}}>
        <label style={{...S.label,marginBottom:10}}>Carica i cataloghi fornitori</label>
        {c.suppliers.map((sup,si)=>{const u=ups[sup.name];return(
          <Card key={sup.name} style={{padding:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                {dupMode==="priority"&&<span style={{background:"var(--badge-neutral)",color:"var(--text)",borderRadius:6,padding:"1px 7px",fontSize:11,fontWeight:700}}>#{si+1}</span>}
                <strong style={{color:"var(--text)",fontSize:14}}>{sup.name}</strong>
                <span style={{...S.badge("var(--badge-ok)"),fontSize:10}}>{sup.tiers?sup.tiers.length+" fasce":"flat"}</span>
                {sup.stockCol&&<span style={S.badge("var(--badge-info)")}>Stock: {sup.stockCol}</span>}
              </div>
              {u&&<p style={{color:"#10b981",fontSize:12,margin:"4px 0 0"}}>✓ {u.fn}</p>}
            </div>
            <div style={{display:"flex",gap:6}}>
              {u&&<Btn v="danger" onClick={()=>rmUp(sup.name)} style={{fontSize:11,padding:"5px 10px"}}>✕</Btn>}
              <label style={{padding:"8px 16px",borderRadius:8,background:u?"var(--border)":"#6366f1",color:u?"var(--text)":"#fff",fontWeight:600,fontSize:13,cursor:"pointer"}}>
                {u?"Sostituisci":"Carica CSV"}<input type="file" accept=".csv,.txt,.tsv" style={{display:"none"}} onChange={e=>hFile(sup.name,e.target.files[0])}/>
              </label>
            </div>
          </Card>
        );})}
      </div>

      <div style={{textAlign:"center",marginBottom:14}}>
        <Btn v="ok" onClick={convert} disabled={uc===0||!!progress} style={{padding:"12px 40px",fontSize:15}}>
          {progress?"⏳ Elaborazione...":"⚡ Genera file"}
          {!progress&&" ("+uc+" "+(uc===1?"fornitore":"fornitori")+")"}
        </Btn>
      </div>

      {progress&&(
        <Card accent="#6366f1">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <span style={{fontSize:13,color:"var(--text)",fontWeight:600}}>{progress.msg}</span>
            <span style={{fontSize:12,color:"var(--accent-form)",fontWeight:700}}>{progress.pct}%</span>
          </div>
          <div style={{background:"var(--bg-input)",borderRadius:6,height:8,overflow:"hidden"}}>
            <div style={{height:"100%",width:progress.pct+"%",background:"linear-gradient(90deg,#6366f1,#10b981)",borderRadius:6,transition:"width .3s ease"}}/>
          </div>
        </Card>
      )}

      {res?.error&&<Card accent="#ef4444"><p style={{color:"#ef4444",margin:0,whiteSpace:"pre-wrap"}}>❌ {res.error}</p></Card>}

      {res?.records&&(
        <div>
          <Card accent="#10b981">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14,flexWrap:"wrap",gap:8}}>
              <h4 style={{color:"#10b981",margin:0}}>✓ File generato</h4>
              <Btn v="ghost" onClick={saveToHistory} disabled={saving} style={{fontSize:13}}>{saving?"Salvataggio...":"📊 Salva nello storico"}</Btn>
            </div>
            <DownloadBox records={res.records} stats={res.stats} label={res.records.length.toLocaleString()+" righe"}/>
            <div style={{height:14}}/>
            <StatsBlock stats={res.stats}/>
          </Card>
          <PreviewTable previewData={res.stats.previewData} total={res.stats.total_rows}/>
        </div>
      )}
    </div>
  );
}

// ─── Blocco download (.xlsx + .txt) ──────────────────────────────────────────
function DownloadBox({records,stats,filename,label,accent}){
  const[busy,setBusy]=useState(null);
  const[err,setErr]=useState(null);
  const empty=!records||records.length===0;

  const make=async(kind)=>{
    setBusy(kind);setErr(null);
    try{
      // Un file con le sole intestazioni, caricato con "Elimina e sostituisci",
      // cancella tutto l'inventario. Non lo generiamo mai.
      if(empty)throw new Error("Nessuna riga da scrivere: rigenera prima di scaricare");
      const t=await getFullTemplate();
      const rows=expandRecords(records,t,{marketplace:stats.marketplace,leadtime:stats.leadtime});
      const base=filename||("Offerte_"+(stats.marketplace||"IT")+"_"+new Date().toISOString().slice(0,10));
      if(kind==="xlsx"){
        const buf=buildXlsx(t,rows);
        dlBlob(buf,base+".xlsx","application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
      }else{
        dlBlob(buildTxt(t,rows,{marketplace:stats.marketplace}),base+".txt","text/plain;charset=utf-8");
      }
    }catch(e){setErr(e.message)}
    finally{setBusy(null)}
  };

  if(empty)return(
    <div style={{padding:"12px 14px",background:"var(--bl-bg)",border:"1px solid var(--bl-border)",borderRadius:10}}>
      <div style={{fontWeight:700,fontSize:13,color:"var(--bl-text)",marginBottom:4}}>⛔ Nessuna riga da scaricare</div>
      <div style={{fontSize:12,color:"var(--bl-text)",lineHeight:1.6}}>
        Questo risultato non contiene righe dati — probabilmente è stato generato dalla versione
        precedente dell'app, che salvava il file in un altro formato. Premi
        “Genera adesso da FTP” per rifarlo.
        <div style={{marginTop:6}}>
          Il download è bloccato di proposito: un file con le sole intestazioni, caricato con
          “Elimina e sostituisci”, cancellerebbe tutto l'inventario.
        </div>
      </div>
    </div>
  );

  return(
    <div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        <Btn v={accent||"ok"} onClick={()=>make("xlsx")} disabled={!!busy} style={{fontSize:14,padding:"10px 22px"}}>
          {busy==="xlsx"?"⏳ Genero...":"↓ Scarica .xlsx"}
        </Btn>
        <Btn v="ghost" onClick={()=>make("txt")} disabled={!!busy} style={{fontSize:13}}>
          {busy==="txt"?"⏳...":"↓ .txt tab-delimited"}
        </Btn>
        {label&&<span style={{fontSize:11,color:"var(--text-muted)"}}>{label}</span>}
      </div>
      {err&&<p style={{color:"#ef4444",fontSize:12,margin:"8px 0 0"}}>❌ {err}</p>}
    </div>
  );
}

// ─── Template Tab ────────────────────────────────────────────────────────────
function TemplateTab(){
  const[info,setInfo]=useState(null);
  const[loading,setLoading]=useState(true);
  const[busy,setBusy]=useState(false);
  const[msg,setMsg]=useState(null);
  const[err,setErr]=useState(null);

  const load=async()=>{
    setLoading(true);setErr(null);
    try{const r=await fetch("/api/template");const d=await r.json();setInfo(d.info);}
    catch(e){setErr(e.message)}
    finally{setLoading(false)}
  };
  useEffect(()=>{load()},[]);

  const upload=async(file)=>{
    if(!file)return;
    setBusy(true);setErr(null);setMsg(null);
    try{
      const t=await parseTemplateFile(file);
      const r=await fetch("/api/template",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(t)});
      const d=await r.json();
      if(!r.ok)throw new Error(d.error||("HTTP "+r.status));
      _templateCache=null;
      setInfo(d.info);
      setMsg("Template aggiornato: "+t.nCols+" colonne, dati dalla riga "+t.dataRow+".");
    }catch(e){setErr(e.message)}
    finally{setBusy(false)}
  };

  const reset=async()=>{
    if(!confirm("Tornare al template di default incluso nell'app?"))return;
    setBusy(true);setErr(null);setMsg(null);
    try{
      const r=await fetch("/api/template",{method:"DELETE"});
      const d=await r.json();
      _templateCache=null;setInfo(d.info);setMsg("Ripristinato il template di default.");
    }catch(e){setErr(e.message)}
    finally{setBusy(false)}
  };

  if(loading)return<Card><p style={{color:"var(--text-muted)",textAlign:"center",margin:0}}>Caricamento...</p></Card>;

  const ok=info&&(!info.missing||info.missing.length===0);

  return(
    <div>
      <Card style={{background:"var(--info-bg)",border:"1px solid var(--info-border)"}}>
        <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
          <span style={{fontSize:24}}>📄</span>
          <div style={{fontSize:12,color:"var(--info-text)",lineHeight:1.6}}>
            <div style={{fontWeight:700,marginBottom:4}}>Modello di caricamento delle offerte</div>
            Amazon ha sostituito l'Inventory Loader classico con questo formato: la riga 1 contiene la stringa
            di configurazione, la riga 5 i nomi tecnici dei campi, i dati partono dalla riga 7.
            Il file generato riproduce le intestazioni del template che carichi qui.
            <div style={{marginTop:6}}>
              Quando Amazon rilascia una nuova versione, scaricala da <em>Catalogo → Aggiungi prodotti tramite
              caricamento → Scarica un foglio di calcolo</em> e caricala qui: le colonne vengono rilevate
              automaticamente, non serve toccare il codice.
            </div>
          </div>
        </div>
      </Card>

      <Card accent={ok?"#10b981":"#ef4444"}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap",marginBottom:12}}>
          <div>
            <h4 style={{margin:"0 0 4px",color:ok?"#10b981":"#ef4444"}}>{ok?"✓ Template valido":"⚠️ Template incompleto"}</h4>
            <div style={{fontSize:12,color:"var(--text-muted)"}}>
              {info.isSeed?"Default incluso nell'app":"Caricato da te"}
              {info.source?" • "+info.source:""}
              {info.uploadedAt?" • "+new Date(info.uploadedAt).toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):""}
            </div>
          </div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <label style={{padding:"8px 16px",borderRadius:8,background:"#6366f1",color:"#fff",fontWeight:600,fontSize:13,cursor:busy?"wait":"pointer",opacity:busy?.5:1}}>
              {busy?"⏳ Elaboro...":"⬆ Carica template Amazon"}
              <input type="file" accept=".xlsm,.xlsx,.xls" style={{display:"none"}} disabled={busy} onChange={e=>upload(e.target.files[0])}/>
            </label>
            {!info.isSeed&&<Btn v="ghost" onClick={reset} disabled={busy} style={{fontSize:13}}>Ripristina default</Btn>}
          </div>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10}}>
          {[["Colonne",info.nCols],["Riga dati",info.dataRow],["Riga campi",info.attributeRow],["Marketplace",info.marketplaceId||"—"],["Lingua",info.contentLanguageTag||"—"],["Foglio",info.sheetName]].map(([l,v])=>(
            <div key={l} style={{background:"var(--bg-stat)",borderRadius:8,padding:"10px 14px"}}>
              <div style={{fontSize:15,fontWeight:700,color:"var(--text)"}}>{v}</div>
              <div style={{fontSize:11,color:"var(--text-label)",marginTop:2}}>{l}</div>
            </div>
          ))}
        </div>

        <label style={{...S.label,margin:"16px 0 8px"}}>Campi riconosciuti</label>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {Object.keys(FIELD_LABELS).map(f=>{
            const found=(info.resolved||[]).indexOf(f)>=0;
            const req=REQUIRED_FIELDS.indexOf(f)>=0;
            return(
              <span key={f} style={{...S.badge(found?"var(--badge-ok)":(req?"var(--bl-bg)":"var(--badge-neutral)")),fontSize:11,color:found?"var(--text)":(req?"var(--bl-text)":"var(--text-muted)")}}>
                {found?"✓":"✕"} {FIELD_LABELS[f]}{req?"":" (opz.)"}
              </span>
            );
          })}
        </div>

        {info.missing&&info.missing.length>0&&(
          <div style={{marginTop:12,padding:"8px 12px",background:"var(--bl-bg)",borderRadius:8,border:"1px solid var(--bl-border)",fontSize:12,color:"var(--bl-text)"}}>
            Mancano campi obbligatori: {info.missing.map(m=>FIELD_LABELS[m]||m).join(", ")}. Carica un template completo.
          </div>
        )}
      </Card>

      {msg&&<Card accent="#10b981"><p style={{color:"#10b981",margin:0,fontSize:13}}>✓ {msg}</p></Card>}
      {err&&<Card accent="#ef4444"><p style={{color:"#ef4444",margin:0,fontSize:13}}>❌ {err}</p></Card>}
    </div>
  );
}

// ─── Tab ASIN (mappa verificata + registro SKU) ──────────────────────────────
function AsinTab({config:c,save}){
  const[map,setMap]=useState(null);
  const[reg,setReg]=useState(null);
  const[busy,setBusy]=useState(null);
  const[msg,setMsg]=useState(null);
  const[err,setErr]=useState(null);
  const[onlyMapped,setOnlyMapped]=useState(!!c.onlyMapped);

  const load=async()=>{
    setErr(null);
    try{
      const[a,b]=await Promise.all([fetch("/api/asinmap"),fetch("/api/published")]);
      if(a.ok)setMap((await a.json()).info);
      if(b.ok)setReg((await b.json()).info);
    }catch(e){setErr(e.message)}
  };
  useEffect(()=>{load()},[]);

  const upload=async(kind,file,replace)=>{
    if(!file)return;
    setBusy(kind);setErr(null);setMsg(null);
    try{
      const text=await file.text();
      const url=kind==="map"?("/api/asinmap"+(replace?"?replace=1":"")):"/api/published";
      const r=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:text});
      const d=await r.json();
      if(!r.ok)throw new Error(d.error||("HTTP "+r.status));
      if(kind==="map"){
        setMsg(`Mappa aggiornata: ${d.caricate} coppie caricate${d.abbinamenti_cambiati?`, ${d.abbinamenti_cambiati} abbinamenti cambiati`:""}${d.righe_scartate?`, ${d.righe_scartate} righe scartate`:""}.`);
      }else{
        setMsg(`${d.nota} (${d.righe_nel_report} righe lette, ${d.aggiunte_al_registro} aggiunte)`);
      }
      await load();
    }catch(e){setErr(e.message)}
    finally{setBusy(null)}
  };

  const clearMap=async()=>{
    if(!confirm("Svuotare la mappa? Senza ASIN verificato l'abbinamento torna a farlo Amazon, che è la causa degli ordini sbagliati."))return;
    setBusy("clear");setErr(null);setMsg(null);
    try{await fetch("/api/asinmap",{method:"DELETE"});setMsg("Mappa svuotata.");await load();}
    catch(e){setErr(e.message)}finally{setBusy(null)}
  };

  const toggleOnlyMapped=()=>{
    const v=!onlyMapped;setOnlyMapped(v);save({...c,onlyMapped:v});
    setMsg(v?"Da adesso vengono pubblicati solo gli EAN con ASIN verificato.":"Da adesso vengono pubblicati anche gli EAN senza ASIN verificato (abbinamento fatto da Amazon).");
  };

  const Box=({children,accent})=><Card accent={accent}>{children}</Card>;

  return(
    <div>
      <Card style={{background:"var(--info-bg)",border:"1px solid var(--info-border)"}}>
        <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
          <span style={{fontSize:24}}>🔗</span>
          <div style={{fontSize:12,color:"var(--info-text)",lineHeight:1.6}}>
            <div style={{fontWeight:700,marginBottom:4}}>Perché questa mappa esiste</div>
            Il template permette di identificare il prodotto con l'ASIN <em>oppure</em> con l'EAN.
            Finché mandavamo solo l'EAN, era Amazon a scegliere la pagina prodotto: su 5.571 offerte
            attive 94 erano finite sulla scheda di un pneumatico di misura o marca diversa, e due
            sono state vendute. Con l'ASIN scritto esplicitamente l'offerta è inchiodata al prodotto
            giusto e non può più spostarsi.
            <div style={{marginTop:6}}>
              La mappa la produce <code>audit_asin.mjs</code>, che confronta marca e misura del listino
              fornitore con il titolo della pagina Amazon e tiene solo le coppie coerenti.
            </div>
          </div>
        </div>
      </Card>

      {/* ── Mappa EAN → ASIN ── */}
      <Box accent={map&&map.count>0?"#10b981":"#f59e0b"}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap",marginBottom:12}}>
          <div>
            <h4 style={{margin:"0 0 4px",color:map&&map.count>0?"#10b981":"#f59e0b"}}>
              {map&&map.count>0?"✓ Mappa EAN → ASIN attiva":"⚠️ Nessuna mappa caricata"}
            </h4>
            <div style={{fontSize:12,color:"var(--text-muted)"}}>
              {map&&map.count>0
                ?`${map.count.toLocaleString()} coppie verificate${map.verifiedTo?` · ultima verifica ${map.verifiedTo}`:""}`
                :"Senza mappa l'abbinamento lo fa Amazon"}
            </div>
          </div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <label style={{padding:"8px 16px",borderRadius:8,background:"#6366f1",color:"#fff",fontWeight:600,fontSize:13,cursor:busy?"wait":"pointer",opacity:busy?.5:1}}>
              {busy==="map"?"⏳ Carico...":"⬆ Carica mappa verificata"}
              <input type="file" accept=".csv,.txt" style={{display:"none"}} disabled={!!busy} onChange={e=>upload("map",e.target.files[0],false)}/>
            </label>
            {map&&map.count>0&&<Btn v="danger" onClick={clearMap} disabled={!!busy} style={{fontSize:13}}>Svuota</Btn>}
          </div>
        </div>

        {map&&(
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10}}>
            {[["Coppie EAN→ASIN",map.count],["ASIN distinti",map.distinctAsins],["Collisioni",map.collisions]].map(([l,v])=>(
              <div key={l} style={{background:"var(--bg-stat)",borderRadius:8,padding:"10px 14px",textAlign:"center"}}>
                <div style={{fontSize:20,fontWeight:700,color:l==="Collisioni"&&v>0?"#ef4444":"var(--text)"}}>{(v||0).toLocaleString()}</div>
                <div style={{fontSize:11,color:"var(--text-label)",marginTop:2}}>{l}</div>
              </div>
            ))}
          </div>
        )}

        {map&&map.collisions>0&&(
          <div style={{marginTop:12,padding:"8px 12px",background:"var(--bl-bg)",border:"1px solid var(--bl-border)",borderRadius:8}}>
            <div style={{fontSize:12,color:"var(--bl-text)",fontWeight:700,marginBottom:4}}>
              {map.collisions} ASIN hanno più di un EAN nella mappa
            </div>
            <div style={{fontSize:11,color:"var(--bl-text)",lineHeight:1.5}}>
              Due pneumatici diversi non possono essere la stessa pagina prodotto: per ognuno di questi
              uno dei due abbinamenti è sbagliato.
              {map.collisionSample&&map.collisionSample.length>0&&(
                <div style={{marginTop:6,fontFamily:"monospace",fontSize:10}}>
                  {map.collisionSample.map(cs=><div key={cs.asin}>{cs.asin} ← {cs.eans.join(", ")}</div>)}
                </div>
              )}
            </div>
          </div>
        )}

        <div style={{marginTop:14,paddingTop:14,borderTop:"1px solid var(--border)"}}>
          <div onClick={toggleOnlyMapped} style={{display:"flex",gap:10,alignItems:"flex-start",cursor:"pointer"}}>
            <div style={{width:18,height:18,borderRadius:4,flexShrink:0,marginTop:1,
              border:onlyMapped?"none":"2px solid var(--border-input)",background:onlyMapped?"#10b981":"transparent",
              color:"#fff",fontSize:13,lineHeight:"18px",textAlign:"center",fontWeight:700}}>{onlyMapped?"✓":""}</div>
            <div>
              <div style={{fontSize:13,fontWeight:600,color:"var(--text)"}}>Pubblica solo gli EAN con ASIN verificato</div>
              <div style={{fontSize:11,color:"var(--text-muted)",lineHeight:1.6,marginTop:2}}>
                Il modo più sicuro: quello che non è verificato non va in vendita. Riduce il catalogo
                agli abbinamenti certi. Lasciandolo spento, gli EAN senza mappa vengono pubblicati con
                l'EAN e l'abbinamento lo fa Amazon — con il rischio che hai già visto.
              </div>
            </div>
          </div>
        </div>
      </Box>

      {/* ── Registro SKU pubblicate ── */}
      <Box>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap",marginBottom:12}}>
          <div>
            <h4 style={{margin:"0 0 4px",fontSize:15}}>📇 Registro delle SKU pubblicate</h4>
            <div style={{fontSize:12,color:"var(--text-muted)",lineHeight:1.6,maxWidth:560}}>
              È il registro che decide chi esce con quantità 0. Inizializzalo dal report
              <strong> offerte attive</strong> di Seller Central: le offerte attive su Amazon che il
              fornitore non rifornisce più entrano nel registro e vengono disattivate al primo file
              utile. Costruendolo solo dal listino fornitore, quelle offerte restavano acquistabili
              per sempre.
            </div>
          </div>
          <label style={{padding:"8px 16px",borderRadius:8,background:"#6366f1",color:"#fff",fontWeight:600,fontSize:13,cursor:busy?"wait":"pointer",opacity:busy?.5:1,whiteSpace:"nowrap"}}>
            {busy==="reg"?"⏳ Carico...":"⬆ Carica offerte attive"}
            <input type="file" accept=".txt,.csv,.tsv" style={{display:"none"}} disabled={!!busy} onChange={e=>upload("reg",e.target.files[0])}/>
          </label>
        </div>
        {reg&&(
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10}}>
            {[["SKU tracciate",reg.count],["Attive",reg.attive],["A quantità 0",reg.a_zero],["Da report Amazon",reg.da_offerte_amazon]].map(([l,v])=>(
              <div key={l} style={{background:"var(--bg-stat)",borderRadius:8,padding:"10px 14px",textAlign:"center"}}>
                <div style={{fontSize:20,fontWeight:700,color:"var(--text)"}}>{(v||0).toLocaleString()}</div>
                <div style={{fontSize:11,color:"var(--text-label)",marginTop:2}}>{l}</div>
              </div>
            ))}
          </div>
        )}
      </Box>

      {msg&&<Card accent="#10b981"><p style={{color:"#10b981",margin:0,fontSize:13}}>✓ {msg}</p></Card>}
      {err&&<Card accent="#ef4444"><p style={{color:"#ef4444",margin:0,fontSize:13}}>❌ {err}</p></Card>}
    </div>
  );
}

// ─── Regole Tab ──────────────────────────────────────────────────────────────
function RulesTab({config:c,save}){
  const[f,sF]=useState({
    qtyMode:c.qtyMode||"catalog",
    dupMode:c.dupMode||"price",
    minStock:c.minStock??0,
    maxQty:c.maxQty??0,
    floorMarginPct:c.floorMarginPct??0,
    zeroKeepDays:c.zeroKeepDays??90,
    maxDeltaPct:c.maxDeltaPct??20,
    minProducts:c.minProducts??100,
  });
  const[saved,setSaved]=useState(false);
  const num=(k,v)=>sF(p=>({...p,[k]:v===""?"":Number(v)}));

  const apply=()=>{
    save({...c,...f,
      minStock:Number(f.minStock)||0,maxQty:Number(f.maxQty)||0,
      floorMarginPct:Number(f.floorMarginPct)||0,zeroKeepDays:Number(f.zeroKeepDays)||90,
      maxDeltaPct:Number(f.maxDeltaPct)||20,minProducts:Number(f.minProducts)||100});
    setSaved(true);setTimeout(()=>setSaved(false),2500);
  };

  return(
    <div>
      <Card>
        <h4 style={{margin:"0 0 4px",fontSize:15}}>📦 Disponibilità</h4>
        <p style={{fontSize:12,color:"var(--text-muted)",margin:"0 0 14px",lineHeight:1.6}}>
          Con un aggiornamento al giorno, la quantità che pubblichi resta esposta per 24 ore.
          Il tasso di annullamento Amazon si misura su 7 giorni con soglia 2,5%: a 40 ordini a settimana
          basta un ordine non evadibile per superarla.
        </p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
          <Sel label="Sorgente quantità" value={f.qtyMode} onChange={e=>sF(p=>({...p,qtyMode:e.target.value}))}
            options={[{v:"catalog",l:"📦 Stock del fornitore"},{v:"fixed",l:"🔒 Quantità fissa del marketplace"}]}/>
          <Sel label="EAN presente in più fornitori" value={f.dupMode} onChange={e=>sF(p=>({...p,dupMode:e.target.value}))}
            options={[{v:"price",l:"💰 Prezzo più basso"},{v:"priority",l:"⭐ Priorità fornitore"}]}/>
          <Inp label="Stock minimo per pubblicare" type="number" min="0" value={f.minStock} onChange={e=>num("minStock",e.target.value)}/>
          <Inp label="Tetto quantità pubblicata (0 = nessuno)" type="number" min="0" value={f.maxQty} onChange={e=>num("maxQty",e.target.value)}/>
        </div>
        <p style={{fontSize:11,color:"var(--text-muted)",margin:0,lineHeight:1.6}}>
          <strong>Stock minimo</strong>: sotto questa soglia l'articolo non viene pubblicato. È nella coda lunga di
          articoli quasi esauriti che nascono quasi tutti gli annullamenti.<br/>
          <strong>Tetto quantità</strong>: pubblicare 4 invece di 400 limita l'esposizione massima a un singolo ciclo
          di aggiornamento, senza perdere vendite reali.
        </p>
      </Card>

      <Card>
        <h4 style={{margin:"0 0 4px",fontSize:15}}>🚦 Disattivazione</h4>
        <p style={{fontSize:12,color:"var(--text-muted)",margin:"0 0 14px",lineHeight:1.6}}>
          Le SKU già pubblicate e oggi assenti dal listino fornitore escono con <strong>quantità 0</strong>:
          l'offerta resta a catalogo, non è acquistabile, e si riattiva da sola quando torna disponibile.
          Non serve più il "Modifica e sostituisci".
        </p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
          <Inp label="Giorni di ripetizione della quantità 0" type="number" min="1" value={f.zeroKeepDays} onChange={e=>num("zeroKeepDays",e.target.value)}/>
          <Inp label="Margine minimo % per il prezzo minimo (0 = non inviarlo)" type="number" min="0" value={f.floorMarginPct} onChange={e=>num("floorMarginPct",e.target.value)}/>
        </div>
        <p style={{fontSize:11,color:"var(--text-muted)",margin:0,lineHeight:1.6}}>
          Passati i giorni indicati, la SKU esce dal tracciamento e non viene più inserita nel file
          (resta comunque a zero su Amazon fino a una cancellazione esplicita).
        </p>
      </Card>

      <Card accent="#f59e0b">
        <h4 style={{margin:"0 0 4px",fontSize:15}}>🛡 Controllo di sicurezza</h4>
        <p style={{fontSize:12,color:"var(--text-muted)",margin:"0 0 14px",lineHeight:1.6}}>
          Se il CSV del fornitore arriva troncato o incompleto, il risultato viene messo in
          quarantena e l'ultimo file buono non viene sovrascritto. Trovi il pulsante per confermarlo
          a mano nel tab 🤖 Auto.
        </p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
          <Inp label="Variazione massima prodotti (%)" type="number" min="1" value={f.maxDeltaPct} onChange={e=>num("maxDeltaPct",e.target.value)}/>
          <Inp label="Prodotti minimi attesi" type="number" min="1" value={f.minProducts} onChange={e=>num("minProducts",e.target.value)}/>
        </div>
      </Card>

      <div style={{display:"flex",gap:10,alignItems:"center"}}>
        <Btn v="ok" onClick={apply} style={{padding:"10px 24px",fontSize:14}}>💾 Salva regole</Btn>
        {saved&&<span style={{color:"#10b981",fontSize:13}}>✓ Salvato</span>}
      </div>
    </div>
  );
}

// ─── Auto Tab (FTP + file pronto) ────────────────────────────────────────────
function AutoTab({config:c}){
  const[status,setStatus]=useState("loading"); // loading | ready | empty | error
  const[latest,setLatest]=useState(null);
  const[pending,setPending]=useState(null);
  const[tinfo,setTinfo]=useState(null);
  const[generating,setGenerating]=useState(false);
  const[acting,setActing]=useState(false);
  const[err,setErr]=useState(null);
  const[note,setNote]=useState(null);
  const[saving,setSaving]=useState(false);
  const[view,setView]=useState("latest"); // latest | pending

  const load=async()=>{
    setStatus("loading");setErr(null);
    try{
      const[r1,r2]=await Promise.all([fetch("/api/ftp-convert"),fetch("/api/template")]);
      if(!r1.ok)throw new Error("HTTP "+r1.status);
      const d=await r1.json();
      setLatest(d.latest||null);setPending(d.pending||null);
      if(r2.ok){const t=await r2.json();setTinfo(t.info);}
      setView(d.pending?"pending":"latest");
      setStatus(d.latest||d.pending?"ready":"empty");
    }catch(e){setErr(e.message);setStatus("error")}
  };
  useEffect(()=>{load()},[]);

  const generate=async(force)=>{
    setGenerating(true);setErr(null);setNote(null);
    try{
      const r=await fetch("/api/ftp-convert",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({marketplace:c.marketplaces[0]?.code||"IT",dupMode:c.dupMode||"price",qtyMode:c.qtyMode||"catalog",force:!!force})});
      const d=await r.json();
      if(!r.ok)throw new Error(d.error||("HTTP "+r.status));
      if(d.quarantined)setNote("Il controllo di sicurezza ha bloccato la pubblicazione. Il risultato è in quarantena: controllalo e conferma se è corretto.");
      await load();
    }catch(e){setErr(e.message)}
    finally{setGenerating(false)}
  };

  const publishAction=async(action)=>{
    if(action==="promote"&&!confirm("Pubblicare comunque il risultato in quarantena come ultimo file pronto?"))return;
    if(action==="discard"&&!confirm("Scartare il risultato in quarantena?"))return;
    setActing(true);setErr(null);setNote(null);
    try{
      const r=await fetch("/api/publish",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action})});
      const d=await r.json();
      if(!r.ok)throw new Error(d.error||("HTTP "+r.status));
      setNote(action==="promote"?"Risultato promosso a file pronto.":"Risultato in quarantena scartato.");
      await load();
    }catch(e){setErr(e.message)}
    finally{setActing(false)}
  };

  const saveToHistory=async(stats)=>{
    if(!stats)return;setSaving(true);
    try{
      await fetch("/api/history",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...stats,source:"browser"})});
      setNote("Salvato nello storico.");
    }catch(e){setErr(e.message)}
    finally{setSaving(false)}
  };

  const fmtDate=iso=>iso?new Date(iso).toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
  const shown=view==="pending"?pending:latest;

  return(
    <div>
      {/* Come caricare su Amazon */}
      <Card style={{background:"var(--info-bg)",border:"1px solid var(--info-border)"}}>
        <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
          <span style={{fontSize:24}}>🤖</span>
          <div style={{fontSize:12,color:"var(--info-text)",lineHeight:1.6}}>
            <div style={{fontWeight:700,marginBottom:4}}>Generazione automatica attiva</div>
            Ogni mattina alle <strong>9:15</strong> (10:15 con l'ora legale), da lunedì a sabato, il sistema scarica i CSV
            dall'FTP, converte nel formato del template Amazon e tiene il file pronto qui.
            <div style={{marginTop:8,paddingTop:8,borderTop:"1px solid var(--info-border)"}}>
              <strong>Su Seller Central carica con “Aggiungi prodotti e modifica il tuo inventario”</strong>, non con
              “Modifica e sostituisci”. Gli articoli non più disponibili sono già nel file con quantità 0, quindi non
              serve cancellare e ricreare il catalogo ogni giorno.
            </div>
          </div>
        </div>
      </Card>

      {latest&&latest.stats&&latest.stats.without_asin>0&&(
        <Card accent="#f59e0b">
          <p style={{color:"#f59e0b",margin:0,fontSize:13,lineHeight:1.6}}>
            ⚠️ {latest.stats.without_asin.toLocaleString()} righe su {latest.stats.total_rows.toLocaleString()} sono
            inviate col solo EAN, quindi l'abbinamento alla pagina prodotto lo decide Amazon.
            È il meccanismo che ha causato le vendite del pneumatico sbagliato. Carica una mappa più
            completa dal tab 🔗 ASIN, o attiva lì "pubblica solo gli EAN con ASIN verificato".
          </p>
        </Card>
      )}

      {tinfo&&tinfo.missing&&tinfo.missing.length>0&&(
        <Card accent="#ef4444">
          <p style={{color:"#ef4444",margin:0,fontSize:13}}>
            ⚠️ Il template in uso non ha tutte le colonne obbligatorie. Vai nel tab 📄 Template e caricane uno valido.
          </p>
        </Card>
      )}

      {/* Comandi */}
      <Card>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <Btn v="pri" onClick={()=>generate(false)} disabled={generating} style={{fontSize:14,padding:"10px 24px"}}>
            {generating?"⏳ Scarico dall'FTP...":"📥 Genera adesso da FTP"}
          </Btn>
          <Btn v="ghost" onClick={load} disabled={generating} style={{fontSize:13}}>↻ Ricarica</Btn>
          <span style={{fontSize:11,color:"var(--text-muted)"}}>
            Marketplace {c.marketplaces[0]?.code||"—"} • tempo di gestione {c.marketplaces[0]?.leadtime??"—"} gg
          </span>
        </div>
      </Card>

      {err&&<Card accent="#ef4444"><p style={{color:"#ef4444",margin:0,fontSize:13,whiteSpace:"pre-wrap"}}>❌ {err}</p></Card>}
      {note&&<Card accent="#6366f1"><p style={{color:"var(--accent-form)",margin:0,fontSize:13}}>ℹ️ {note}</p></Card>}

      {/* Quarantena */}
      {pending&&(
        <Card accent="#f59e0b">
          <h4 style={{margin:"0 0 6px",color:"#f59e0b"}}>⏸️ Risultato in quarantena</h4>
          <p style={{fontSize:12,color:"var(--text-muted)",margin:"0 0 10px",lineHeight:1.6}}>
            Il controllo di sicurezza ha bloccato la pubblicazione. L'ultimo file buono non è stato toccato.
          </p>
          <ul style={{margin:"0 0 12px",paddingLeft:18}}>
            {(pending.safety?.blockers||[]).map((b,i)=><li key={i} style={{fontSize:12,color:"#f59e0b",marginBottom:4}}>{b}</li>)}
          </ul>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
            <Btn v="ok" onClick={()=>publishAction("promote")} disabled={acting} style={{fontSize:13}}>✓ Pubblica comunque</Btn>
            <Btn v="danger" onClick={()=>publishAction("discard")} disabled={acting} style={{fontSize:13}}>✕ Scarta</Btn>
            <Btn v="ghost" onClick={()=>generate(true)} disabled={generating} style={{fontSize:13}}>↻ Rigenera e forza</Btn>
          </div>
        </Card>
      )}

      {/* Selettore vista */}
      {latest&&pending&&(
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          {[["latest","📦 Ultimo pronto"],["pending","⏸️ In quarantena"]].map(([v,l])=>(
            <div key={v} onClick={()=>setView(v)} style={{padding:"8px 16px",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600,
              border:view===v?"2px solid #6366f1":"2px solid var(--border)",background:view===v?"var(--bg-card)":"var(--bg-input)",
              color:view===v?"var(--accent-form)":"var(--text-label)"}}>{l}</div>
          ))}
        </div>
      )}

      {shown&&shown.stats&&!shown.records&&(
        <Card accent="#ef4444">
          <h4 style={{margin:"0 0 6px",color:"#ef4444"}}>⚠️ Risultato della versione precedente</h4>
          <p style={{fontSize:12,color:"var(--text-muted)",margin:0,lineHeight:1.6}}>
            Questo risultato è stato salvato dalla versione precedente dell'app, che teneva il file
            in un altro formato. Le righe non sono rileggibili: premi “Genera adesso da FTP” prima di
            scaricare qualsiasi cosa.
          </p>
        </Card>
      )}

      {status==="loading"&&<Card><p style={{color:"var(--text-muted)",textAlign:"center",margin:0}}>Caricamento...</p></Card>}
      {status==="empty"&&<Card><p style={{color:"var(--text-muted)",textAlign:"center",margin:0}}>Nessun file ancora generato. Premi “Genera adesso da FTP”.</p></Card>}

      {shown&&shown.stats&&(
        <div>
          <Card accent={view==="pending"?"#f59e0b":"#10b981"}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14,flexWrap:"wrap",gap:8}}>
              <div>
                <h4 style={{color:view==="pending"?"#f59e0b":"#10b981",margin:"0 0 4px"}}>
                  {view==="pending"?"⏸️ File in quarantena":"✓ File pronto"}
                </h4>
                <div style={{fontSize:12,color:"var(--text-muted)"}}>
                  Generato il {fmtDate(shown.stats.generated_at)} • {shown.filename} • {shown.source}
                </div>
              </div>
              <Btn v="ghost" onClick={()=>saveToHistory(shown.stats)} disabled={saving} style={{fontSize:13}}>
                {saving?"Salvataggio...":"📊 Salva nello storico"}
              </Btn>
            </div>

            <DownloadBox records={shown.records||[]} stats={shown.stats} filename={shown.filename}
              accent={view==="pending"?"pri":"ok"}
              label={(shown.records||[]).length.toLocaleString()+" righe • prova prima l'.xlsx, il .txt è l'alternativa se il caricamento lo rifiuta"}/>

            <div style={{height:14}}/>
            <StatsBlock stats={shown.stats}/>
          </Card>

          <PreviewTable previewData={shown.stats.previewData} total={shown.stats.total_rows}/>
        </div>
      )}
    </div>
  );
}

// ─── Alerts Panel ─────────────────────────────────────────────────────────────
function AlertsPanel({onClose}){
  const[alerts,setAlerts]=useState([]);
  const[loading,setLoading]=useState(true);

  const fetchAlerts=async()=>{
    setLoading(true);
    try{const r=await fetch("/api/alerts");const d=await r.json();setAlerts(d);}
    catch{}finally{setLoading(false);}
  };

  useEffect(()=>{fetchAlerts();},[]);

  const action=async(body)=>{
    await fetch("/api/alerts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    fetchAlerts();
  };

  const unread=alerts.filter(a=>!a.read);
  const read=alerts.filter(a=>a.read);

  const colorMap={error:"#ef4444",warning:"#f59e0b",info:"#6366f1"};
  const bgMap={error:"var(--bl-bg)",warning:"#2a1a00",info:"var(--tier-bg)"};

  return(
    <div style={{position:"fixed",top:0,right:0,width:380,height:"100vh",background:"var(--bg-card)",borderLeft:"1px solid var(--border)",zIndex:1000,display:"flex",flexDirection:"column",boxShadow:"-4px 0 20px rgba(0,0,0,0.3)"}}>
      <div style={{padding:"16px 20px",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <h3 style={{margin:0,fontSize:16}}>🔔 Notifiche {unread.length>0&&<span style={{color:"#ef4444",fontSize:13}}>({unread.length} nuove)</span>}</h3>
        <div style={{display:"flex",gap:8}}>
          {unread.length>0&&<Btn v="ghost" onClick={()=>action({action:"read-all"})} style={{fontSize:11,padding:"4px 8px"}}>Segna tutte lette</Btn>}
          {read.length>0&&<Btn v="danger" onClick={()=>action({action:"clear"})} style={{fontSize:11,padding:"4px 8px"}}>Cancella lette</Btn>}
          <Btn v="ghost" onClick={onClose} style={{fontSize:13,padding:"4px 10px"}}>✕</Btn>
        </div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:16}}>
        {loading&&<p style={{color:"var(--text-muted)",textAlign:"center"}}>Caricamento...</p>}
        {!loading&&alerts.length===0&&<p style={{color:"var(--text-muted)",textAlign:"center",marginTop:40}}>Nessuna notifica. Tutto ok! ✓</p>}
        {alerts.map(a=>(
          <div key={a.id} style={{background:bgMap[a.type]||"var(--bg-input)",border:`1px solid ${colorMap[a.type]||"var(--border)"}`,borderRadius:10,padding:"12px 14px",marginBottom:10,opacity:a.read?0.55:1}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,fontSize:13,color:colorMap[a.type]||"var(--text)",marginBottom:4}}>{a.title}</div>
                <div style={{fontSize:12,color:"var(--text-muted)",lineHeight:1.5}}>{a.message}</div>
                <div style={{fontSize:10,color:"var(--text-muted)",marginTop:6}}>{new Date(a.created_at).toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</div>
              </div>
              {!a.read&&<button onClick={()=>action({action:"read",id:a.id})} style={{background:"none",border:"none",color:"var(--text-muted)",cursor:"pointer",fontSize:16,padding:0,flexShrink:0}}>✓</button>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}
function ThemeToggle({theme,toggle}){
  return<button onClick={toggle} title={theme==="dark"?"Light mode":"Dark mode"} style={{background:"var(--bg-input)",border:"1px solid var(--border-input)",borderRadius:8,padding:"6px 10px",cursor:"pointer",fontSize:16,lineHeight:1,color:"var(--text)",transition:"all .15s"}}>
    {theme==="dark"?"☀️":"🌙"}
  </button>;
}

// ─── App ─────────────────────────────────────────────────────────────────────
function App(){
  const[c,sC]=useState(DEFAULT);
  const[tab,sTab]=useState("auto");
  const[ok,sOk]=useState(false);
  const[syncStatus,setSyncStatus]=useState("idle");
  const[theme,sTheme]=useState(()=>localStorage.getItem("amz-theme")||"dark");
  const[alertCount,setAlertCount]=useState(0);
  const[showAlerts,setShowAlerts]=useState(false);

  useEffect(()=>{document.body.setAttribute("data-theme",theme);},[theme]);

  useEffect(()=>{
    const local=loadLocal();sC(local);sOk(true);setSyncStatus("syncing");
    loadRemote().then(remote=>{
      if(remote){const migrated=migrate(remote);sC(migrated);persistLocal(migrated);setSyncStatus("synced");}
      else setSyncStatus("idle");
    }).catch(()=>setSyncStatus("error"));
    // Conta alert non letti
    fetch("/api/alerts").then(r=>r.json()).then(alerts=>{
      setAlertCount((alerts||[]).filter(a=>!a.read).length);
    }).catch(()=>{});
  },[]);

  const save=cfg=>{
    sC(cfg);persistLocal(cfg);setSyncStatus("syncing");
    persistRemote(cfg).then(()=>setSyncStatus("synced")).catch(()=>setSyncStatus("error"));
  };
  const toggleTheme=()=>{const t=theme==="dark"?"light":"dark";sTheme(t);localStorage.setItem("amz-theme",t);};

  if(!ok)return<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--text-muted)"}}>Caricamento...</div>;

  const tabs=[
    {id:"auto",   label:"🤖 Auto"},
    {id:"template",label:"📄 Template"},
    {id:"rules",  label:"⚙️ Regole"},
    {id:"convert",label:"⚡ Manuale"},
    {id:"suppliers",label:"🏭 Fornitori",n:c.suppliers.length},
    {id:"marketplaces",label:"🌍 Marketplace",n:c.marketplaces.length},
    {id:"blacklist",label:"🚫 Blacklist",n:c.blacklist.length},
    {id:"history",label:"📊 Storico"},
  ];

  return(
    <div>
      {showAlerts&&<AlertsPanel onClose={()=>{setShowAlerts(false);fetch("/api/alerts").then(r=>r.json()).then(d=>setAlertCount((d||[]).filter(a=>!a.read).length)).catch(()=>{});}}/>}
      <div className="app-header" style={{background:"linear-gradient(135deg,var(--bg-header-start) 0%,var(--bg-header-end) 100%)",borderBottom:"1px solid var(--border)",padding:"20px 32px"}}>
        <div style={{maxWidth:1300,margin:"0 auto",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <h1 style={{margin:0,fontSize:24,fontWeight:700,letterSpacing:-.5}}><span style={{color:"#6366f1"}}>▸</span> Amazon Inventory Converter <span style={{fontSize:12,color:"var(--text-muted)",fontWeight:400}}>v6.0</span></h1>
            <p style={{margin:"4px 0 0",color:"var(--text-muted)",fontSize:13}}>Nuovo formato offerte Amazon • Auto FTP • Quantità 0 al posto del purge • Guard-rail</p>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:11,color:{idle:"var(--text-muted)",syncing:"#f59e0b",synced:"#10b981",error:"#ef4444"}[syncStatus]}}>
              {syncStatus==="syncing"&&"↑ sync..."}
              {syncStatus==="synced"&&"✓ sync"}
              {syncStatus==="error"&&"⚠ offline"}
            </span>
            <AlertBell onClick={()=>setShowAlerts(p=>!p)} count={alertCount}/>
            <ThemeToggle theme={theme} toggle={toggleTheme}/>
          </div>
        </div>
      </div>
      <div className="app-tabs" style={{display:"flex",gap:0,borderBottom:"1px solid var(--border)",padding:"0 32px",overflowX:"auto"}}>
        <div style={{maxWidth:1300,margin:"0 auto",width:"100%",display:"flex"}}>
          {tabs.map(t=>(
            <button key={t.id} onClick={()=>sTab(t.id)} style={{padding:"12px 20px",background:"none",border:"none",color:tab===t.id?"var(--tab-active)":"var(--tab-inactive)",borderBottom:tab===t.id?"2px solid #6366f1":"2px solid transparent",cursor:"pointer",fontWeight:600,fontSize:14,transition:"all .15s",whiteSpace:"nowrap"}}>
              {t.label}{t.n!==undefined&&<span style={{marginLeft:6,background:"var(--tab-badge)",padding:"2px 8px",borderRadius:10,fontSize:11}}>{t.n}</span>}
            </button>
          ))}
        </div>
      </div>
      <div className="app-content" style={{padding:28,maxWidth:820,margin:"0 auto"}}>
        {tab==="auto"&&<AutoTab config={c}/>}
        {tab==="template"&&<TemplateTab/>}
        {tab==="asin"&&<AsinTab config={c} save={save}/>}
        {tab==="rules"&&<RulesTab config={c} save={save}/>}
        {tab==="suppliers"&&<SuppliersTab config={c} save={save}/>}
        {tab==="marketplaces"&&<MarketplacesTab config={c} save={save}/>}
        {tab==="blacklist"&&<BlacklistTab config={c} save={save}/>}
        {tab==="convert"&&<ConvertTab config={c}/>}
        {tab==="history"&&<HistoryTab/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
