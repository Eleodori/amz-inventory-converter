// ─── Blocco download (.xlsx + .txt) ──────────────────────────────────────────
function DownloadBox({records,stats,filename,label,accent}){
  const[busy,setBusy]=useState(null);
  const[err,setErr]=useState(null);
  const empty=!records||records.length===0;

  const make=async(kind)=>{
    setBusy(kind);setErr(null);
    try{
      // Un file con le sole intestazioni, caricato con "Elimina e sostituisci",
      // cancella tutto l'inventario. Non lo generiamo mai.
      if(empty)throw new Error("Nessuna riga da scrivere: rigenera prima di scaricare");
      const mk=String(stats.marketplace||"IT").toUpperCase();
      const t=await getFullTemplate(mk);
      // Ultima rete: il template deve essere di questo marketplace. Dieci nomi di
      // colonna contengono l'id, quindi un template sbagliato non produce un file
      // "un po' diverso", ne produce uno che Amazon rifiuta in blocco.
      const atteso=mpInfo(mk).id;
      if(t.marketplaceId&&atteso&&t.marketplaceId!==atteso)
        throw new Error(`Il template caricato è del marketplace ${t.marketplaceId}, ma questo file è per ${mk} (${atteso}). Carica il template giusto dal tab Template.`);
      const rows=expandRecords(records,t,{marketplace:mk,leadtime:stats.leadtime});
      const base=filename||("Offerte_"+(stats.marketplace||"IT")+"_"+new Date().toISOString().slice(0,10));
      if(kind==="xlsx"){
        const buf=buildXlsx(t,rows);
        dlBlob(buf,base+".xlsx","application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
      }else{
        dlBlob(buildTxt(t,rows,{marketplace:mk}),base+".txt","text/plain;charset=utf-8");
      }
    }catch(e){setErr(e.message)}
    finally{setBusy(null)}
  };

  if(empty)return(
    <div style={{padding:"12px 14px",background:"var(--bl-bg)",border:"1px solid var(--bl-border)",borderRadius:10}}>
      <div style={{fontWeight:700,fontSize:13,color:"var(--bl-text)",marginBottom:4}}>⛔ Nessuna riga da scaricare</div>
      <div style={{fontSize:12,color:"var(--bl-text)",lineHeight:1.6}}>
        Questo risultato non contiene righe dati — probabilmente è stato generato dalla versione
        precedente dell'app, che salvava il file in un altro formato. Premi
        “Genera adesso da FTP” per rifarlo.
        <div style={{marginTop:6}}>
          Il download è bloccato di proposito: un file con le sole intestazioni, caricato con
          “Elimina e sostituisci”, cancellerebbe tutto l'inventario.
        </div>
      </div>
    </div>
  );

  return(
    <div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        <Btn v={accent||"ok"} onClick={()=>make("xlsx")} disabled={!!busy} style={{fontSize:14,padding:"10px 22px"}}>
          {busy==="xlsx"?"⏳ Genero...":"↓ Scarica .xlsx"}
        </Btn>
        <Btn v="ghost" onClick={()=>make("txt")} disabled={!!busy} style={{fontSize:13}}>
          {busy==="txt"?"⏳...":"↓ .txt tab-delimited"}
        </Btn>
        {label&&<span style={{fontSize:11,color:"var(--text-muted)"}}>{label}</span>}
      </div>
      {err&&<p style={{color:"var(--bad)",fontSize:12,margin:"8px 0 0"}}>❌ {err}</p>}
    </div>
  );
}

// ─── Anteprima righe ─────────────────────────────────────────────────────────
function PreviewTable({previewData,total}){
  const[rows,setRows]=useState(20);
  const[show,setShow]=useState(true);
  if(!previewData||!previewData.length)return null;
  return(
    <Card>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <h4 style={{margin:0,fontSize:14}}>👁 Anteprima <span style={{color:"var(--text-muted)",fontWeight:400,fontSize:12}}>prime {Math.min(rows,previewData.length)} di {(total||0).toLocaleString()}</span></h4>
        <Btn v="ghost" onClick={()=>setShow(p=>!p)} style={{fontSize:11,padding:"4px 10px"}}>{show?"Nascondi":"Mostra"}</Btn>
      </div>
      {show&&(
        <div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
              <thead>
                <tr style={{borderBottom:"2px solid var(--border)"}}>
                  {["EAN","SKU","Fascia","Costo €","Vendita €","Netto est.","Fornitore","Qty","Stato"].map(h=>(
                    <th key={h} style={{textAlign:"left",padding:"6px 10px",color:"var(--text-label)",fontWeight:700,whiteSpace:"nowrap"}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {previewData.slice(0,rows).map((row,i)=>{
                  const hasCost=row.costPrice!=null;
                  const net=hasCost?(row.salePrice-row.salePrice*0.08-row.costPrice).toFixed(2):null;
                  const zero=row.qty==="0"||row.status==="disattivata";
                  return(
                    <tr key={i} style={{borderBottom:"1px solid var(--border)",background:i%2===0?"transparent":"var(--bg-input)",opacity:zero?0.6:1}}>
                      <td style={{padding:"5px 10px",fontFamily:"monospace",fontSize:11,color:"var(--text-muted)"}}>{row.ean}</td>
                      <td style={{padding:"5px 10px",fontFamily:"monospace",fontSize:11}}>{row.sku}</td>
                      <td style={{padding:"5px 10px"}}><span style={{...S.badge("var(--badge-neutral)"),fontSize:10}}>{row.tierKey}</span></td>
                      <td style={{padding:"5px 10px",color:"var(--text-muted)"}}>{hasCost?row.costPrice.toFixed(2):"—"}</td>
                      <td style={{padding:"5px 10px",fontWeight:600,color:"var(--accent-form)"}}>{Number(row.salePrice||0).toFixed(2)}</td>
                      <td style={{padding:"5px 10px",fontWeight:600,color:net!==null&&parseFloat(net)>0?"var(--ok)":"var(--bad)"}}>{net===null?"—":net}</td>
                      <td style={{padding:"5px 10px"}}><span style={{...S.badge("var(--badge-ok)"),fontSize:10}}>{row.supplier}</span></td>
                      <td style={{padding:"5px 10px",color:"var(--text-muted)"}}>{row.qty}</td>
                      <td style={{padding:"5px 10px"}}>
                        <span style={{...S.badge(zero?"var(--bl-bg)":"var(--badge-ok)"),fontSize:10,color:zero?"var(--bl-text)":"var(--text)"}}>{zero?"disattivata":"attiva"}</span>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          {previewData.length>rows&&(
            <div style={{textAlign:"center",marginTop:10}}>
              <Btn v="ghost" onClick={()=>setRows(n=>n+20)} style={{fontSize:12}}>Mostra altre 20</Btn>
            </div>
          )}
        </div>
      )}
    </Card>
  );
}

// ─── KPI ─────────────────────────────────────────────────────────────────────
/** I riquadri diventano una griglia unica separata da linee a filo: le colonne
    di numeri si leggono in verticale, e il valore sta chiaramente SOPRA la sua
    etichetta. Prima erano scatole staccate e centrate, e i numeri si leggevano
    sfalsati rispetto alla riga a cui appartenevano. */
/** Formato italiano fisso. Prima si affidava al locale del browser: sullo
    stesso file un browser scriveva 7.265, un altro 7,265 e un altro 7265. */
const fmtN=v=>Number(v||0).toLocaleString("it-IT");

function KpiRow({items}){
  return(
    // Le linee di separazione sono disegnate DENTRO ogni cella, non col fondo
    // che traspare dai gap: se l'ultima riga e' incompleta, lo spazio vuoto
    // resta pulito invece di mostrare una macchia del colore del bordo.
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(124px,1fr))",gap:0,background:"var(--bg-stat)",border:"1px solid var(--border)",borderRadius:"var(--radius)",overflow:"hidden",marginBottom:14}}>
      {items.map(([l,v,hint])=>(
        <div key={l} title={hint||""} style={{padding:"14px 16px",boxShadow:"inset -1px -1px 0 var(--border)"}}>
          <div className="num" style={{fontSize:24,fontWeight:600,letterSpacing:"-.023em",lineHeight:1.15,color:(v||0)===0?"var(--text-muted)":"var(--text)"}}>{fmtN(v)}</div>
          <div style={{fontSize:12,color:"var(--text-label)",marginTop:3}}>{l}</div>
        </div>
      ))}
    </div>
  );
}

function StatsBlock({stats}){
  return(
    <div>
      {/* Una griglia sola: tredici numeri in tre scatole separate si leggevano
          come tre argomenti diversi, e le colonne non si allineavano fra loro. */}
      <KpiRow items={[
        ["Attivi",stats.total_products,"Prodotti disponibili dal fornitore"],
        ["Disattivati",stats.zeroed,"SKU già pubblicate e oggi assenti dal listino: escono con quantità 0"],
        ["Righe file",stats.total_rows,"Totale righe nel file da caricare"],
        ["Righe lette",stats.total_read],
        ["Scartate",stats.total_skipped],
        ["Con ASIN",stats.with_asin,"Righe con ASIN verificato: l'offerta è inchiodata al prodotto giusto"],
        ["Senza ASIN in vendita",
          typeof stats.without_asin_active==="number"?stats.without_asin_active:stats.without_asin,
          "Righe messe in vendita col solo EAN: l'abbinamento lo fa Amazon. Le righe col solo EAN a quantità 0 non contano qui: spengono un'offerta esistente."],
        ["Esclusi non mappati",stats.unmapped_skipped,"Esclusi perché senza ASIN verificato (opzione attiva nel tab ASIN)"],
        ["EAN non validi",stats.bad_ean,"Codici non numerici, lunghezza errata o cifra di controllo sbagliata"],
        ["Sotto soglia",stats.below_min_stock,"Esclusi perché lo stock fornitore è sotto la soglia minima"],
        ["Duplicati",stats.duplicates_resolved],
        ["Blacklist",stats.blacklisted],
        ["Non più tracciate",stats.dropped_from_tracking,"SKU a zero da più giorni del limite: smettiamo di ripeterle"],
      ]}/>
      {stats.by_supplier&&Object.keys(stats.by_supplier).length>0&&(
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
          {Object.entries(stats.by_supplier).map(([n,ct])=>(
            <div key={n} style={{background:"var(--bg-input)",border:"1px solid var(--border)",borderRadius:"var(--radius-sm)",padding:"7px 13px",display:"flex",alignItems:"center",gap:8}}>
              <strong style={{fontSize:13}}>{n}</strong>
              <span style={{...S.badge("var(--badge-info)"),color:"var(--accent)"}}>{fmtN(ct)}</span>
            </div>
          ))}
        </div>
      )}
      {stats.errors&&stats.errors.length>0&&(
        <div style={{marginTop:12,padding:"8px 12px",background:"var(--bl-bg)",borderRadius:8,border:"1px solid var(--bl-border)"}}>
          {stats.errors.map((e,i)=><div key={i} style={{fontSize:12,color:"var(--bl-text)"}}>{e}</div>)}
        </div>
      )}
    </div>
  );
}

// ─── Template Tab ────────────────────────────────────────────────────────────
function TemplateTab({config:c,mk,setMk}){
  const[info,setInfo]=useState(null);
  const[loading,setLoading]=useState(true);
  const[busy,setBusy]=useState(false);
  const[msg,setMsg]=useState(null);
  const[err,setErr]=useState(null);
  const code=mk||mpPrimary(c);
  const q="?mk="+encodeURIComponent(code);

  const load=async()=>{
    setLoading(true);setErr(null);setMsg(null);
    try{
      const r=await fetch("/api/template"+q);const d=await r.json();
      setInfo(d.info||null);
      // Per un marketplace senza template il server risponde info:null con la
      // spiegazione: non e' un errore di rete, e' una cosa da fare.
      if(!d.info&&d.error)setErr(d.error);
    }
    catch(e){setErr(e.message)}
    finally{setLoading(false)}
  };
  useEffect(()=>{load()},[code]);

  const upload=async(file)=>{
    if(!file)return;
    setBusy(true);setErr(null);setMsg(null);
    try{
      const t=await parseTemplateFile(file);
      const r=await fetch("/api/template"+q,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(t)});
      const d=await r.json();
      if(!r.ok)throw new Error(d.error||("HTTP "+r.status));
      delete _templateCache[code];
      setInfo(d.info);
      setMsg("Template di "+mpInfo(code).name+" aggiornato: "+t.nCols+" colonne, dati dalla riga "+t.dataRow+".");
    }catch(e){setErr(e.message)}
    finally{setBusy(false)}
  };

  const reset=async()=>{
    if(!confirm(code===mpPrimary(c)?"Tornare al template di default incluso nell'app?":`Rimuovere il template di ${mpInfo(code).name}? Senza template quel marketplace non genera file.`))return;
    setBusy(true);setErr(null);setMsg(null);
    try{
      const r=await fetch("/api/template"+q,{method:"DELETE"});
      const d=await r.json();
      delete _templateCache[code];setInfo(d.info);setMsg("Ripristinato il template di default.");
    }catch(e){setErr(e.message)}
    finally{setBusy(false)}
  };

  if(loading)return<Card><p style={{color:"var(--text-muted)",textAlign:"center",margin:0}}>Caricamento...</p></Card>;

  const ok=info&&(!info.missing||info.missing.length===0);

  return(
    <div>
      <MarketPicker config={c} value={code} onChange={setMk}/>
      <Card style={{background:"var(--info-bg)",border:"1px solid var(--info-border)"}}>
        <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
          <span style={{fontSize:24}}>📄</span>
          <div style={{fontSize:12,color:"var(--info-text)",lineHeight:1.6}}>
            <div style={{fontWeight:700,marginBottom:4}}>Modello di caricamento delle offerte</div>
            Amazon ha sostituito l'Inventory Loader classico con questo formato: la riga 1 contiene la stringa
            di configurazione, la riga 5 i nomi tecnici dei campi, i dati partono dalla riga 7.
            Il file generato riproduce le intestazioni del template che carichi qui.
            <div style={{marginTop:6}}>
              Quando Amazon rilascia una nuova versione, scaricala da <em>Catalogo → Aggiungi prodotti tramite
              caricamento → Scarica un foglio di calcolo</em> e caricala qui: le colonne vengono rilevate
              automaticamente, non serve toccare il codice.
            </div>
          </div>
        </div>
      </Card>

      {!info&&(
        <Card accent="var(--warn)">
          <h4 style={{margin:"0 0 6px",color:"var(--warn)"}}>Nessun template per {mpInfo(code).name}</h4>
          <p style={{margin:"0 0 10px",fontSize:13,color:"var(--text)",lineHeight:1.6}}>
            Senza template questo marketplace non genera nessun file. Scaricalo da Seller Central
            <strong> con il marketplace impostato su {mpInfo(code).name}</strong> — Catalogo → Aggiungi prodotti
            tramite caricamento → Scarica un foglio di calcolo — e caricalo qui. Il file italiano non va bene:
            dieci nomi di colonna contengono l'id del marketplace.
          </p>
          <label style={{height:38,padding:"0 18px",display:"inline-flex",alignItems:"center",gap:7,borderRadius:19,background:"var(--accent-fill)",color:"#fff",fontWeight:500,fontSize:14,cursor:busy?"wait":"pointer",opacity:busy?.5:1,display:"inline-block"}}>
            {busy?"⏳ Elaboro...":"⬆ Carica il template di "+mpInfo(code).name}
            <input type="file" accept=".xlsm,.xlsx,.xls" style={{display:"none"}} disabled={busy} onChange={e=>upload(e.target.files[0])}/>
          </label>
        </Card>
      )}

      {info&&<Card accent={ok?"var(--ok)":"var(--bad)"}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap",marginBottom:12}}>
          <div>
            <h4 style={{margin:"0 0 4px",color:ok?"var(--ok)":"var(--bad)"}}>{ok?"✓ Template valido":"⚠️ Template incompleto"}</h4>
            <div style={{fontSize:12,color:"var(--text-muted)"}}>
              {info.isSeed?"Default incluso nell'app":"Caricato da te"}
              {info.source?" • "+info.source:""}
              {info.uploadedAt?" • "+new Date(info.uploadedAt).toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):""}
            </div>
          </div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <label style={{height:38,padding:"0 18px",display:"inline-flex",alignItems:"center",gap:7,borderRadius:19,background:"var(--accent-fill)",color:"#fff",fontWeight:500,fontSize:14,cursor:busy?"wait":"pointer",opacity:busy?.5:1}}>
              {busy?"⏳ Elaboro...":"⬆ Carica template Amazon"}
              <input type="file" accept=".xlsm,.xlsx,.xls" style={{display:"none"}} disabled={busy} onChange={e=>upload(e.target.files[0])}/>
            </label>
            {!info.isSeed&&<Btn v="ghost" onClick={reset} disabled={busy} style={{fontSize:13}}>{code===mpPrimary(c)?"Ripristina default":"Rimuovi template"}</Btn>}
          </div>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10}}>
          {[["Colonne",info.nCols],["Riga dati",info.dataRow],["Riga campi",info.attributeRow],["Marketplace",info.marketplaceId||"—"],["Lingua",info.contentLanguageTag||"—"],["Foglio",info.sheetName]].map(([l,v])=>(
            <div key={l} style={{background:"var(--bg-stat)",borderRadius:8,padding:"10px 14px"}}>
              <div style={{fontSize:15,fontWeight:700,color:"var(--text)"}}>{v}</div>
              <div style={{fontSize:11,color:"var(--text-label)",marginTop:2}}>{l}</div>
            </div>
          ))}
        </div>

        {info.vocab&&(()=>{
          const v=info.vocab, dalTemplate=v.origine==="template";
          return(
            <div style={{marginTop:16}}>
              <label style={{...S.label,marginBottom:8}}>Valori che verranno scritti nel file</label>
              <div style={{background:"var(--bg-stat)",borderRadius:8,padding:"12px 14px",fontSize:12,lineHeight:1.9,fontFamily:"monospace",color:"var(--text)"}}>
                <div>::record_action → <strong>{v.create}</strong></div>
                <div>condition_type → <strong>{v.conditionNew}</strong></div>
                <div>fulfillment_channel_code → <strong>{v.channelMerchant}</strong></div>
                <div>identificativo esterno → <strong>{v.ean}</strong></div>
              </div>
              <p style={{margin:"8px 0 0",fontSize:11,color:dalTemplate?"var(--ok)":"var(--warn)",lineHeight:1.6}}>
                {dalTemplate
                  ? "✓ Letti dal foglio “Dropdown Lists” del template, quindi sono esattamente quelli che Amazon si aspetta per questo marketplace e questa lingua."
                  : `⚠️ Il template caricato non porta le liste dei valori validi, sto usando una tabella interna (${v.origine}). Su un marketplace non italiano queste stringhe non sono verificate e Amazon potrebbe rifiutare tutte le righe: ricarica il template scaricandolo da Seller Central.`}
              </p>
            </div>
          );
        })()}

        <label style={{...S.label,margin:"16px 0 8px"}}>Campi riconosciuti</label>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {Object.keys(FIELD_LABELS).map(f=>{
            const found=(info.resolved||[]).indexOf(f)>=0;
            const req=REQUIRED_FIELDS.indexOf(f)>=0;
            return(
              <span key={f} style={{...S.badge(found?"var(--badge-ok)":(req?"var(--bl-bg)":"var(--badge-neutral)")),fontSize:11,color:found?"var(--text)":(req?"var(--bl-text)":"var(--text-muted)")}}>
                {found?"✓":"✕"} {FIELD_LABELS[f]}{req?"":" (opz.)"}
              </span>
            );
          })}
        </div>

        {info.missing&&info.missing.length>0&&(
          <div style={{marginTop:12,padding:"8px 12px",background:"var(--bl-bg)",borderRadius:8,border:"1px solid var(--bl-border)",fontSize:12,color:"var(--bl-text)"}}>
            Mancano campi obbligatori: {info.missing.map(m=>FIELD_LABELS[m]||m).join(", ")}. Carica un template completo.
          </div>
        )}
      </Card>}

      {msg&&<Card accent="var(--ok)"><p style={{color:"var(--ok)",margin:0,fontSize:13}}>✓ {msg}</p></Card>}
      {err&&<Card accent="var(--bad)"><p style={{color:"var(--bad)",margin:0,fontSize:13}}>❌ {err}</p></Card>}
    </div>
  );
}

// ─── Tab ASIN (mappa verificata + registro SKU) ──────────────────────────────
function AsinTab({config:c,save,mk,setMk}){
  const[map,setMap]=useState(null);
  const[reg,setReg]=useState(null);
  const[busy,setBusy]=useState(null);
  const[msg,setMsg]=useState(null);
  const[err,setErr]=useState(null);
  const code=mk||mpPrimary(c);
  const q="?mk="+encodeURIComponent(code);
  // La spunta "solo ASIN verificati" e' per marketplace: su DE puo' convenire
  // accenderla anche se su IT costa troppe offerte.
  const st=mkSettings(c,code);
  const[onlyMapped,setOnlyMapped]=useState(!!st.onlyMapped);
  // Unione o sostituzione. Prima l'interfaccia univa sempre e la sostituzione
  // esisteva solo nell'API: per togliere delle coppie dalla mappa bisognava
  // svuotarla e ricaricarla, e nel frattempo il file sarebbe uscito vuoto.
  const[sostituisci,setSostituisci]=useState(false);
  useEffect(()=>{setOnlyMapped(!!mkSettings(c,code).onlyMapped)},[code]);

  const load=async()=>{
    setErr(null);setMsg(null);setMap(null);setReg(null);
    try{
      const[a,b]=await Promise.all([fetch("/api/asinmap"+q),fetch("/api/published"+q)]);
      if(a.ok)setMap((await a.json()).info);
      if(b.ok)setReg((await b.json()).info);
    }catch(e){setErr(e.message)}
  };
  useEffect(()=>{load()},[code]);

  const upload=async(kind,file,replace)=>{
    if(!file)return;
    setBusy(kind);setErr(null);setMsg(null);
    try{
      const text=await file.text();
      const url=kind==="map"?("/api/asinmap"+q+(replace?"&replace=1":"")):("/api/published"+q);
      const r=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:text});
      const d=await r.json();
      if(!r.ok)throw new Error(d.error||("HTTP "+r.status));
      let esito;
      if(kind==="map"){
        const tolte=d.modalita==="sostituzione"?Math.max(0,(d.prima||0)-(d.info?.count||0)):0;
        esito=`Mappa ${d.modalita==="sostituzione"?"sostituita":"aggiornata"}: ${d.caricate} coppie caricate`+
          `${d.abbinamenti_cambiati?`, ${d.abbinamenti_cambiati} abbinamenti cambiati`:""}`+
          `${tolte?`, ${tolte} coppie rimosse`:""}`+
          `${d.righe_scartate?`, ${d.righe_scartate} righe scartate`:""}`+
          ` · da ${(d.prima||0).toLocaleString()} a ${(d.info?.count||0).toLocaleString()} coppie.`;
      }else{
        esito=`${d.nota} (${d.righe_nel_report} righe lette, ${d.aggiunte_al_registro} aggiunte)`;
      }
      // Prima il messaggio si impostava QUI e subito dopo load() lo azzerava:
      // l'esito di un caricamento spariva senza che si potesse leggerlo.
      await load();
      setMsg(esito);
    }catch(e){setErr(e.message)}
    finally{setBusy(null)}
  };

  const clearMap=async()=>{
    if(!confirm("Svuotare la mappa? Senza ASIN verificato l'abbinamento torna a farlo Amazon, che è la causa degli ordini sbagliati."))return;
    setBusy("clear");setErr(null);setMsg(null);
    try{await fetch("/api/asinmap"+q,{method:"DELETE"});setMsg("Mappa di "+mpInfo(code).name+" svuotata.");await load();}
    catch(e){setErr(e.message)}finally{setBusy(null)}
  };

  const toggleOnlyMapped=()=>{
    const v=!onlyMapped;setOnlyMapped(v);
    const idx=(c.marketplaces||[]).findIndex(m=>String(m.code).toUpperCase()===code);
    if(idx<0){ save({...c,onlyMapped:v}); return }
    const l=(c.marketplaces||[]).map((m,j)=>j===idx?{...m,onlyMapped:v}:m);
    const patch={...c,marketplaces:l};
    if(idx===0) patch.onlyMapped=v;   // il campo storico segue il primario
    save(patch);
    setMsg(v?"Da adesso vengono pubblicati solo gli EAN con ASIN verificato.":"Da adesso vengono pubblicati anche gli EAN senza ASIN verificato (abbinamento fatto da Amazon).");
  };

  const Box=({children,accent})=><Card accent={accent}>{children}</Card>;

  return(
    <div>
      <MarketPicker config={c} value={code} onChange={setMk}/>
      <Card style={{background:"var(--info-bg)",border:"1px solid var(--info-border)"}}>
        <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
          <span style={{fontSize:24}}>🔗</span>
          <div style={{fontSize:12,color:"var(--info-text)",lineHeight:1.6}}>
            <div style={{fontWeight:700,marginBottom:4}}>Perché questa mappa esiste</div>
            Il template permette di identificare il prodotto con l'ASIN <em>oppure</em> con l'EAN.
            Finché mandavamo solo l'EAN, era Amazon a scegliere la pagina prodotto: su 5.571 offerte
            attive 94 erano finite sulla scheda di un pneumatico di misura o marca diversa, e due
            sono state vendute. Con l'ASIN scritto esplicitamente l'offerta è inchiodata al prodotto
            giusto e non può più spostarsi.
            <div style={{marginTop:6}}>
              La mappa la produce <code>audit_asin.mjs</code>, che confronta marca e misura del listino
              fornitore con il titolo della pagina Amazon e tiene solo le coppie coerenti.
            </div>
          </div>
        </div>
      </Card>

      {/* ── Mappa EAN → ASIN ── */}
      <Box accent={map&&map.count>0?"var(--ok)":"var(--warn)"}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap",marginBottom:12}}>
          <div>
            <h4 style={{margin:"0 0 4px",color:map&&map.count>0?"var(--ok)":"var(--warn)"}}>
              {map&&map.count>0?"✓ Mappa EAN → ASIN attiva":"⚠️ Nessuna mappa caricata"}
            </h4>
            <div style={{fontSize:12,color:"var(--text-muted)"}}>
              {map&&map.count>0
                ?`${map.count.toLocaleString()} coppie verificate${map.verifiedTo?` · ultima verifica ${map.verifiedTo}`:""}`
                :"Senza mappa l'abbinamento lo fa Amazon"}
            </div>
          </div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <label style={{height:38,padding:"0 18px",display:"inline-flex",alignItems:"center",gap:7,borderRadius:19,background:"var(--accent-fill)",color:"#fff",fontWeight:500,fontSize:14,cursor:busy?"wait":"pointer",opacity:busy?.5:1}}>
              {busy==="map"?"⏳ Carico...":(sostituisci?"⬆ Sostituisci la mappa":"⬆ Carica mappa verificata")}
              <input type="file" accept=".csv,.txt" style={{display:"none"}} disabled={!!busy} onChange={e=>upload("map",e.target.files[0],sostituisci)}/>
            </label>
            {map&&map.count>0&&<Btn v="danger" onClick={clearMap} disabled={!!busy} style={{fontSize:13}}>Svuota</Btn>}
          </div>
        </div>

        {map&&(
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10}}>
            {[["Coppie EAN→ASIN",map.count],["ASIN distinti",map.distinctAsins],["Collisioni",map.collisions]].map(([l,v])=>(
              <div key={l} style={{background:"var(--bg-stat)",borderRadius:8,padding:"10px 14px",textAlign:"center"}}>
                <div style={{fontSize:20,fontWeight:700,color:l==="Collisioni"&&v>0?"var(--bad)":"var(--text)"}}>{(v||0).toLocaleString()}</div>
                <div style={{fontSize:11,color:"var(--text-label)",marginTop:2}}>{l}</div>
              </div>
            ))}
          </div>
        )}

              color:"#fff",fontSize:13,lineHeight:"18px",textAlign:"center",fontWeight:700}}>{onlyMapped?"✓":""}</div>
            <div>
              <div style={{fontSize:13,fontWeight:600,color:"var(--text)"}}>Pubblica solo gli EAN con ASIN verificato</div>
              <div style={{fontSize:11,color:"var(--text-muted)",lineHeight:1.6,marginTop:2}}>
                Il modo più sicuro: quello che non è verificato non va in vendita. Riduce il catalogo
                agli abbinamenti certi. Lasciandolo spento, gli EAN senza mappa vengono pubblicati con
                l'EAN e l'abbinamento lo fa Amazon — con il rischio che hai già visto.
              </div>
            </div>
          </div>
        </div>
      </Box>

      {/* ── Registro SKU pubblicate ── */}
      <Box>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap",marginBottom:12}}>
          <div>

            <div style={{fontSize:12,color:"var(--text-muted)",lineHeight:1.6,maxWidth:560}}>
              È il registro che decide chi esce con quantità 0. Inizializzalo dal report
              <strong> offerte attive</strong> di Seller Central: le offerte attive su Amazon che il
              fornitore non rifornisce più entrano nel registro e vengono disattivate al primo file

            {busy==="reg"?"⏳ Carico...":"⬆ Carica offerte attive"}
            <input type="file" accept=".txt,.csv,.tsv" style={{display:"none"}} disabled={!!busy} onChange={e=>upload("reg",e.target.files[0])}/>
          </label>

          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10}}>
            {[["SKU tracciate",reg.count],["Attive",reg.attive],["A quantità 0",reg.a_zero],["Da report Amazon",reg.da_offerte_amazon]].map(([l,v])=>(
              <div key={l} style={{background:"var(--bg-stat)",borderRadius:8,padding:"10px 14px",textAlign:"center"}}>

  );
}

// ─── Regole Tab ──────────────────────────────────────────────────────────────

            options={[{v:"catalog",l:"📦 Stock del fornitore"},{v:"fixed",l:"🔒 Quantità fissa del marketplace"}]}/>
          <Sel label="EAN presente in più fornitori" value={f.dupMode} onChange={e=>sF(p=>({...p,dupMode:e.target.value}))}
            options={[{v:"price",l:"💰 Prezzo più basso"},{v:"priority",l:"⭐ Priorità fornitore"}]}/>
          <Inp label="Stock minimo per pubblicare" type="number" min="0" value={f.minStock} onChange={e=>num("minStock",e.target.value)}/>
          <Inp label="Tetto quantità pubblicata (0 = nessuno)" type="number" min="0" value={f.maxQty} onChange={e=>num("maxQty",e.target.value)}/>
        </div>
        <p style={{fontSize:11,color:"var(--text-muted)",margin:0,lineHeight:1.6}}>
          <strong>Stock minimo</strong>: sotto questa soglia l'articolo non viene pubblicato. È nella coda lunga di
          articoli quasi esauriti che nascono quasi tutti gli annullamenti.<br/>
          <strong>Tetto quantità</strong>: pubblicare 4 invece di 400 limita l'esposizione massima a un singolo ciclo

      </Card>

      <Card>
        <h4 style={{margin:"0 0 4px",fontSize:15}}>🚦 Disattivazione</h4>
        <p style={{fontSize:12,color:"var(--text-muted)",margin:"0 0 14px",lineHeight:1.6}}>
          Le SKU già pubblicate e oggi assenti dal listino fornitore escono con <strong>quantità 0</strong>:
          l'offerta resta a catalogo, non è acquistabile, e si riattiva da sola quando torna disponibile.
          Non serve più il "Modifica e sostituisci".

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>

          <Inp label="Margine minimo % per il prezzo minimo (0 = non inviarlo)" type="number" min="0" value={f.floorMarginPct} onChange={e=>num("floorMarginPct",e.target.value)}/>
        </div>
        <p style={{fontSize:11,color:"var(--text-muted)",margin:0,lineHeight:1.6}}>
          Passati i giorni indicati, la SKU esce dal tracciamento e non viene più inserita nel file
          (resta comunque a zero su Amazon fino a una cancellazione esplicita).
        </p>
      </Card>

      <Card accent="var(--warn)">
        <h4 style={{margin:"0 0 4px",fontSize:15}}>🛡 Controllo di sicurezza</h4>
        <p style={{fontSize:12,color:"var(--text-muted)",margin:"0 0 14px",lineHeight:1.6}}>
          Se il CSV del fornitore arriva troncato o incompleto, il risultato viene messo in
          quarantena e l'ultimo file buono non viene sovrascritto. Trovi il pulsante per confermarlo
          a mano nel tab 🤖 Auto.

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
          <Inp label="Variazione massima prodotti (%)" type="number" min="1" value={f.maxDeltaPct} onChange={e=>num("maxDeltaPct",e.target.value)}/>

// ─── Auto Tab (FTP + file pronto) ────────────────────────────────────────────
function AutoTab({config:c}){
  const[status,setStatus]=useState("loading"); // loading | ready | empty | error
  const[byMarket,setByMarket]=useState({});
  const[tinfo,setTinfo]=useState({});          // per marketplace
  const[generating,setGenerating]=useState(false);
  const[acting,setActing]=useState(false);
  const[err,setErr]=useState(null);
  const[note,setNote]=useState(null);
  const[saving,setSaving]=useState(false);

  const codes=mpCodes(c);

  const load=async()=>{
    setStatus("loading");setErr(null);
    try{
      const r=await fetch("/api/ftp-convert");
      if(!r.ok)throw new Error("HTTP "+r.status);
      const d=await r.json();
      // Un client aggiornato usa byMarket; se il server fosse ancora quello
      // vecchio, latest/pending del primario servono da ripiego.
      const bm=d.byMarket||{[mpPrimary(c)]:{latest:d.latest||null,pending:d.pending||null}};
      setByMarket(bm);

      const ti={};
      await Promise.all((d.marketplaces||codes).map(async code=>{
        try{
          const t=await fetch("/api/template?mk="+encodeURIComponent(code));
          if(t.ok){const x=await t.json();ti[code]=x.info||null}
        }catch{}
      }));
      setTinfo(ti);

      const qualcosa=Object.values(bm).some(v=>v.latest||v.pending);
      setStatus(qualcosa?"ready":"empty");
    }catch(e){setErr(e.message);setStatus("error")}
  };
  useEffect(()=>{load()},[]);

  /** Rigenera tutti i marketplace attivi, oppure uno solo. I CSV li scarica il
      server una volta sola anche quando i marketplace sono due. */
  const generate=async(force,code)=>{
    setGenerating(true);setErr(null);setNote(null);
    try{
      const body={dupMode:c.dupMode||"price",qtyMode:c.qtyMode||"catalog",force:!!force};
      if(code)body.marketplace=code;
      const r=await fetch("/api/ftp-convert",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      const d=await r.json();
      if(!r.ok)throw new Error(d.error||("HTTP "+r.status));
      const righe=(d.results||[]).map(x=>
        x.error?`${x.marketplace}: ${x.error}`
        :x.quarantined?`${x.marketplace}: in quarantena — ${(x.safety?.blockers||[]).join(" · ")}`
        :`${x.marketplace}: ${x.stats?.total_products?.toLocaleString?.()??"?"} prodotti attivi, ${x.stats?.zeroed??"?"} disattivati`);
      if(righe.length)setNote(righe.join("\n"));
      await load();
    }catch(e){setErr(e.message)}
    finally{setGenerating(false)}
  };

  const publishAction=async(action,code)=>{
    const nome=mpInfo(code).name;
    if(action==="promote"&&!confirm(`Pubblicare comunque il risultato in quarantena di ${nome} come ultimo file pronto?`))return;
    if(action==="discard"&&!confirm(`Scartare il risultato in quarantena di ${nome}?`))return;
    setActing(true);setErr(null);setNote(null);
    try{
      const r=await fetch("/api/publish",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,marketplace:code})});
      const d=await r.json();
      if(!r.ok)throw new Error(d.error||("HTTP "+r.status));
      setNote(action==="promote"?`${nome}: risultato promosso a file pronto.`:`${nome}: risultato in quarantena scartato.`);
      await load();
    }catch(e){setErr(e.message)}
    finally{setActing(false)}
  };

  const saveToHistory=async(stats)=>{
    if(!stats)return;setSaving(true);
    try{
      await fetch("/api/history",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...stats,source:"browser"})});
      setNote("Salvato nello storico.");
    }catch(e){setErr(e.message)}
    finally{setSaving(false)}
  };

  const attivi=(c.marketplaces||[]).filter(m=>m.enabled!==false).map(m=>String(m.code).toUpperCase());
  const daMostrare=codes.filter(code=>attivi.includes(code)||byMarket[code]?.latest||byMarket[code]?.pending);

  return(
    <div>
      {/* Come caricare su Amazon */}
      <Card style={{background:"var(--info-bg)",border:"1px solid var(--info-border)"}}>
        <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
          <span style={{fontSize:24}}>🤖</span>
          <div style={{fontSize:12,color:"var(--info-text)",lineHeight:1.6}}>
            <div style={{fontWeight:700,marginBottom:4}}>Generazione automatica attiva</div>
            Ogni mattina alle <strong>9:15</strong> (10:15 con l'ora legale), da lunedì a sabato, il sistema scarica i CSV
            dall'FTP <strong>una volta sola</strong> e prepara un file per ogni marketplace attivo.
            <div style={{marginTop:8,paddingTop:8,borderTop:"1px solid var(--info-border)"}}>
              <strong>Su Seller Central carica con “Aggiungi prodotti e modifica il tuo inventario”</strong>, non con
              “Modifica e sostituisci”. Gli articoli non più disponibili sono già nel file con quantità 0, quindi non
              serve cancellare e ricreare il catalogo ogni giorno.
              {daMostrare.length>1&&<div style={{marginTop:6}}>
                Ogni file va caricato <strong>sul suo marketplace</strong>: cambia marketplace in Seller Central prima di caricare.
              </div>}
            </div>
          </div>
        </div>
      </Card>

      {/* Comandi */}
      <Card>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <Btn v="pri" onClick={()=>generate(false)} disabled={generating} style={{fontSize:14,padding:"10px 24px"}}>
            {generating?"⏳ Scarico dall'FTP...":(daMostrare.length>1?"📥 Genera adesso tutti":"📥 Genera adesso da FTP")}
          </Btn>
          <Btn v="ghost" onClick={load} disabled={generating} style={{fontSize:13}}>↻ Ricarica</Btn>
          <span style={{fontSize:11,color:"var(--text-muted)"}}>
            {attivi.length?attivi.map(code=>`${code} · gestione ${mkSettings(c,code).leadtime}gg`).join("   •   "):"nessun marketplace attivo"}
          </span>
        </div>
      </Card>

      {err&&<Card accent="var(--bad)"><p style={{color:"var(--bad)",margin:0,fontSize:13,whiteSpace:"pre-wrap"}}>❌ {err}</p></Card>}
      {note&&<Card accent="var(--accent)"><p style={{color:"var(--accent-form)",margin:0,fontSize:13,whiteSpace:"pre-wrap"}}>ℹ️ {note}</p></Card>}

      {status==="loading"&&<Card><p style={{color:"var(--text-muted)",textAlign:"center",margin:0}}>Caricamento...</p></Card>}
      {status!=="loading"&&daMostrare.length===0&&(
        <Card><p style={{color:"var(--text-muted)",textAlign:"center",margin:0}}>
          Nessun marketplace attivo. Aggiungine uno dal tab 🌍 Marketplace.
        </p></Card>
      )}

      {status!=="loading"&&daMostrare.map(code=>(
        <MarketBlock key={code} code={code} config={c}
          data={byMarket[code]||{latest:null,pending:null}}
          tinfo={tinfo[code]} molti={daMostrare.length>1}
          generating={generating} acting={acting} saving={saving}
          onGenerate={generate} onPublish={publishAction} onSaveHistory={saveToHistory}/>
      ))}
    </div>
  );
}

/** Tutto quello che riguarda un solo marketplace nel tab Auto. */
function MarketBlock({code,config:c,data,tinfo,molti,generating,acting,saving,onGenerate,onPublish,onSaveHistory}){
  const[view,setView]=useState("latest");
  const {latest,pending}=data;
  useEffect(()=>{setView(pending?"pending":"latest")},[!!pending]);
  const shown=view==="pending"?pending:latest;
  const fmtDate=iso=>iso?new Date(iso).toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"—";

  const corpo=(
    <div>
      {/* Righe col solo EAN: informativo, arancione solo se peggiora. */}
      {latest&&latest.stats&&(()=>{
        const st=latest.stats, tot=st.total_rows||0;
        // Solo le righe senza ASIN che vanno DAVVERO in vendita. Quelle a
        // quantita' 0 spengono un'offerta esistente: non creano nessun
        // abbinamento, e contarle qui faceva gridare al lupo su file corretti.
        const attive=typeof st.without_asin_active==="number"?st.without_asin_active:st.without_asin;
        const spente=typeof st.without_asin_zeroed==="number"
          ?st.without_asin_zeroed
          :Math.max(0,(st.without_asin||0)-(attive||0));
        if(!attive&&!spente)return null;
        const before=typeof latest.prev?.without_asin_active==="number"?latest.prev.without_asin_active
          :(typeof latest.prev?.without_asin==="number"?latest.prev.without_asin:null);
        const delta=before===null?null:attive-before;
        const worse=delta!==null&&delta>0&&attive>0;
        const pct=tot?Math.round(attive/tot*100):0;
        if(!attive){
          return(
            <Card>
              <p style={{color:"var(--text-muted)",margin:0,fontSize:13,lineHeight:1.6}}>
                ✓ Nessuna riga in vendita col solo EAN: ogni prodotto messo in vendita ha l'ASIN verificato.
                Le <strong>{spente.toLocaleString()}</strong> righe col solo EAN nel file sono tutte a quantità 0,
                servono a spegnere offerte che esistono già e non creano nessun abbinamento.
              </p>
            </Card>
          );
        }
        return(
          <Card accent={worse?"var(--warn)":undefined}>
            <p style={{color:worse?"var(--warn)":"var(--text-muted)",margin:0,fontSize:13,lineHeight:1.6}}>
              {worse?"⚠️":"ℹ️"} <strong>{attive.toLocaleString()}</strong> righe su {tot.toLocaleString()} ({pct}%)
              vanno in vendita col solo EAN: per quelle l'abbinamento alla pagina prodotto lo decide Amazon.
              {spente>0&&` Altre ${spente.toLocaleString()} righe col solo EAN sono a quantità 0 e servono solo a spegnere offerte esistenti.`}
              {delta===null?" Non ho un file precedente con cui confrontarlo.":
               delta===0?" Come nel file precedente.":
               delta<0?` ${Math.abs(delta).toLocaleString()} in meno del file precedente.`:
                        ` ${delta.toLocaleString()} in più del file precedente (erano ${before.toLocaleString()}).`}
              {worse&&" Possono essere EAN nuovi che il fornitore ha iniziato a mandare, oppure coppie che sono state tolte dalla mappa: controlla il tab 🔗 ASIN."}
              {!worse&&" Per ridurle, aggiorna la mappa verificata dal tab 🔗 ASIN."}
            </p>
          </Card>
        );
      })()}

      {tinfo===null&&(
        <Card accent="var(--bad)">
          <p style={{color:"var(--bad)",margin:0,fontSize:13,lineHeight:1.6}}>
            ⚠️ Nessun template caricato per {mpInfo(code).name}: questo marketplace non genera nessun file.
            Caricalo dal tab 📄 Template scegliendo {mpInfo(code).name}.
          </p>
        </Card>
      )}
      {tinfo&&tinfo.missing&&tinfo.missing.length>0&&(
        <Card accent="var(--bad)">
          <p style={{color:"var(--bad)",margin:0,fontSize:13}}>
            ⚠️ Il template di {mpInfo(code).name} non ha tutte le colonne obbligatorie. Vai nel tab 📄 Template.
          </p>
        </Card>
      )}

      {pending&&(
        <Card accent="var(--warn)">
          <h4 style={{margin:"0 0 6px",color:"var(--warn)"}}>⏸️ Risultato in quarantena</h4>
          <p style={{fontSize:12,color:"var(--text-muted)",margin:"0 0 10px",lineHeight:1.6}}>
            Il controllo di sicurezza ha bloccato la pubblicazione. L'ultimo file buono non è stato toccato.
          </p>
          <ul style={{margin:"0 0 12px",paddingLeft:18}}>
            {(pending.safety?.blockers||[]).map((b,i)=><li key={i} style={{fontSize:12,color:"var(--warn)",marginBottom:4}}>{b}</li>)}
          </ul>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
            <Btn v="ok" onClick={()=>onPublish("promote",code)} disabled={acting} style={{fontSize:13}}>✓ Pubblica comunque</Btn>
            <Btn v="danger" onClick={()=>onPublish("discard",code)} disabled={acting} style={{fontSize:13}}>✕ Scarta</Btn>
            <Btn v="ghost" onClick={()=>onGenerate(true,code)} disabled={generating} style={{fontSize:13}}>↻ Rigenera e forza</Btn>
          </div>
        </Card>
      )}

      {latest&&pending&&(
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          {[["latest","📦 Ultimo pronto"],["pending","⏸️ In quarantena"]].map(([v,l])=>(
            <div key={v} onClick={()=>setView(v)} style={{padding:"8px 16px",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600,
              border:view===v?"2px solid var(--accent)":"2px solid var(--border)",background:view===v?"var(--bg-card)":"var(--bg-input)",
              color:view===v?"var(--accent-form)":"var(--text-label)"}}>{l}</div>
          ))}
        </div>
      )}

      {shown&&shown.stats&&!shown.records&&(
        <Card accent="var(--bad)">
          <h4 style={{margin:"0 0 6px",color:"var(--bad)"}}>⚠️ Risultato della versione precedente</h4>
          <p style={{fontSize:12,color:"var(--text-muted)",margin:0,lineHeight:1.6}}>
            Questo risultato è stato salvato dalla versione precedente dell'app, che teneva il file
            in un altro formato. Le righe non sono rileggibili: premi “Genera adesso” prima di
            scaricare qualsiasi cosa.
          </p>
        </Card>
      )}

      {!latest&&!pending&&(
        <Card><p style={{color:"var(--text-muted)",textAlign:"center",margin:0}}>
          Nessun file ancora generato per {mpInfo(code).name}.
        </p></Card>
      )}

      {shown&&shown.stats&&(
        <div>
          <Card accent={view==="pending"?"var(--warn)":"var(--ok)"}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14,flexWrap:"wrap",gap:8}}>
              <div>
                <h4 style={{color:view==="pending"?"var(--warn)":"var(--ok)",margin:"0 0 4px"}}>
                  {view==="pending"?"⏸️ File in quarantena":"✓ File pronto"}
                </h4>
                <div style={{fontSize:12,color:"var(--text-muted)"}}>
                  Generato il {fmtDate(shown.stats.generated_at)} • {shown.filename} • {shown.source}
                </div>
              </div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {molti&&<Btn v="ghost" onClick={()=>onGenerate(false,code)} disabled={generating} style={{fontSize:12}}>↻ Solo {code}</Btn>}
                <Btn v="ghost" onClick={()=>onSaveHistory(shown.stats)} disabled={saving} style={{fontSize:13}}>
                  {saving?"Salvataggio...":"📊 Salva nello storico"}
                </Btn>
              </div>
            </div>

            <DownloadBox records={shown.records||[]} stats={shown.stats} filename={shown.filename}
              accent={view==="pending"?"pri":"ok"}
              label={(shown.records||[]).length.toLocaleString()+" righe • prova prima l'.xlsx, il .txt è l'alternativa se il caricamento lo rifiuta"}/>

            <div style={{height:14}}/>
            <StatsBlock stats={shown.stats}/>
          </Card>

          <PreviewTable previewData={shown.stats.previewData} total={shown.stats.total_rows}/>
        </div>
      )}
    </div>
  );

  if(!molti)return corpo;
  const spento=(c.marketplaces||[]).some(m=>String(m.code).toUpperCase()===code&&m.enabled===false);
  return(
    <div style={{marginBottom:22,paddingTop:8,borderTop:"1px solid var(--border)"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,margin:"10px 0 12px"}}>
        <h3 style={{margin:0,fontSize:18,color:"var(--text)"}}>{mpInfo(code).name}</h3>
        {spento&&<span style={S.badge("var(--badge-neutral)")}>non attivo</span>}
      </div>
      {corpo}
    </div>
  );
}

// ─── Alerts Panel ─────────────────────────────────────────────────────────────
function AlertsPanel({onClose}){
  const[alerts,setAlerts]=useState([]);
  const[loading,setLoading]=useState(true);

  const fetchAlerts=async()=>{
    setLoading(true);
    try{const r=await fetch("/api/alerts");const d=await r.json();setAlerts(d);}
    catch{}finally{setLoading(false);}
  };

  useEffect(()=>{fetchAlerts();},[]);

  const action=async(body)=>{
    await fetch("/api/alerts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    fetchAlerts();
  };

  const unread=alerts.filter(a=>!a.read);
  const read=alerts.filter(a=>a.read);

  const colorMap={error:"var(--bad)",warning:"var(--warn)",info:"var(--accent)"};
  const bgMap={error:"var(--bl-bg)",warning:"#2a1a00",info:"var(--tier-bg)"};

  return(
    <div style={{position:"fixed",top:0,right:0,width:380,height:"100vh",background:"var(--bg-card)",borderLeft:"1px solid var(--border)",zIndex:1000,display:"flex",flexDirection:"column",boxShadow:"-4px 0 20px rgba(0,0,0,0.3)"}}>
      <div style={{padding:"16px 20px",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <h3 style={{margin:0,fontSize:16}}>🔔 Notifiche {unread.length>0&&<span style={{color:"var(--bad)",fontSize:13}}>({unread.length} nuove)</span>}</h3>
        <div style={{display:"flex",gap:8}}>
          {unread.length>0&&<Btn v="ghost" onClick={()=>action({action:"read-all"})} style={{fontSize:11,padding:"4px 8px"}}>Segna tutte lette</Btn>}
          {read.length>0&&<Btn v="danger" onClick={()=>action({action:"clear"})} style={{fontSize:11,padding:"4px 8px"}}>Cancella lette</Btn>}
          <Btn v="ghost" onClick={onClose} style={{fontSize:13,padding:"4px 10px"}}>✕</Btn>
        </div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:16}}>
        {loading&&<p style={{color:"var(--text-muted)",textAlign:"center"}}>Caricamento...</p>}
        {!loading&&alerts.length===0&&<p style={{color:"var(--text-muted)",textAlign:"center",marginTop:40}}>Nessuna notifica. Tutto ok! ✓</p>}
        {alerts.map(a=>(
          <div key={a.id} style={{background:bgMap[a.type]||"var(--bg-input)",border:`1px solid ${colorMap[a.type]||"var(--border)"}`,borderRadius:10,padding:"12px 14px",marginBottom:10,opacity:a.read?0.55:1}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,fontSize:13,color:colorMap[a.type]||"var(--text)",marginBottom:4}}>{a.title}</div>
                <div style={{fontSize:12,color:"var(--text-muted)",lineHeight:1.5}}>{a.message}</div>
                <div style={{fontSize:10,color:"var(--text-muted)",marginTop:6}}>{new Date(a.created_at).toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</div>
              </div>
              {!a.read&&<button onClick={()=>action({action:"read",id:a.id})} style={{background:"none",border:"none",color:"var(--text-muted)",cursor:"pointer",fontSize:16,padding:0,flexShrink:0}}>✓</button>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}
function ThemeToggle({theme,toggle}){
  return<button onClick={toggle} title={theme==="dark"?"Passa al tema chiaro":"Passa al tema scuro"} style={{width:30,height:30,display:"inline-flex",alignItems:"center",justifyContent:"center",background:"var(--bg-card)",border:"1px solid var(--border)",borderRadius:8,cursor:"pointer",fontSize:14,lineHeight:1,color:"var(--text)",transition:"border-color .15s"}}>
    {theme==="dark"?"☀":"☾"}
  </button>;
}

// ─── App ─────────────────────────────────────────────────────────────────────
function App(){
  const[c,sC]=useState(DEFAULT);
  const[tab,sTab]=useState("auto");
  // Marketplace selezionato nei tab che lavorano su dati separati (Template,
  // ASIN, Blacklist). Si allinea al primario quando arriva la configurazione.
  const[mk,setMk]=useState(null);
  const[ok,sOk]=useState(false);
  const[syncStatus,setSyncStatus]=useState("idle");
  const[pronto,setPronto]=useState(false);   // true = config del server ricevuta, si puo' scrivere
  const[rev,setRev]=useState(0);
  const[errSync,setErrSync]=useState(null);
  const[theme,sTheme]=useState(()=>localStorage.getItem("amz-theme")||"dark");
  const[alertCount,setAlertCount]=useState(0);
  const[showAlerts,setShowAlerts]=useState(false);

  useEffect(()=>{document.body.setAttribute("data-theme",theme);},[theme]);

  useEffect(()=>{
    // La copia locale serve solo a far vedere subito qualcosa. Finche' non
    // e' arrivata quella del server la pagina NON e' scrivibile: prima lo era,
    // e un click nel primo secondo salvava la configurazione vecchia sopra
    // quella buona (113 EAN di blacklist persi cosi', senza un avviso).
    const local=loadLocal();sC(local);sOk(true);setSyncStatus("syncing");
    loadRemote().then(remote=>{
      if(remote){const migrated=migrate(remote);sC(migrated);persistLocal(migrated);setRev(remote.rev||0);setPronto(true);setSyncStatus("synced");
        setMk(p=>p&&mpCodes(migrated).includes(p)?p:mpPrimary(migrated));}
      else {setPronto(true);setSyncStatus("idle");}   // nessuna config sul server: la locale e' l'unica cosa che c'e'
    }).catch(()=>{setSyncStatus("error");setErrSync("Non riesco a leggere la configurazione dal server: la pagina resta in sola lettura per non sovrascrivere i dati buoni. Ricarica.");});
    // Conta alert non letti
    fetch("/api/alerts").then(r=>r.json()).then(alerts=>{
      setAlertCount((alerts||[]).filter(a=>!a.read).length);
    }).catch(()=>{});
  },[]);

  const save=(cfg,opts={})=>{
    if(!pronto){
      setErrSync("Aspetta un istante: sto ancora leggendo la configurazione dal server. Salvare adesso sovrascriverebbe i dati buoni con quelli in cache del browser.");
      return;
    }
    setErrSync(null);
    sC(cfg);persistLocal(cfg);setSyncStatus("syncing");
    persistRemote({...cfg,rev,allowBlacklistShrink:!!opts.shrinkOk}).then(r=>{
      if(r.ok){ setRev(r.rev); setSyncStatus("synced"); return }
      setSyncStatus("error");
      // Rifiutato: rimettiamo in pagina quello che c'e' davvero sul server,
      // cosi' non resta a schermo una modifica che non e' stata salvata.
      if(r.current){ const m=migrate(r.current); sC(m); persistLocal(m); setRev(r.current.rev||0); }
      if(r.blacklistShrink){
        const b=r.blacklistShrink;
        setErrSync(`Salvataggio rifiutato: la blacklist sarebbe passata da ${b.prima} a ${b.dopo} EAN senza che tu l'abbia chiesto. `+
          `Ho ricaricato la versione del server, non hai perso niente. `+
          (b.persiTotale?`EAN che sarebbero sparita: ${b.persi.join(", ")}${b.persiTotale>b.persi.length?` e altri ${b.persiTotale-b.persi.length}`:""}.`:""));
      } else if(r.rifiutato){
        setErrSync("Salvataggio rifiutato: sul server c'era una versione piu' recente, probabilmente salvata da un'altra scheda o da un altro browser. Ho ricaricato quella del server: rifai la modifica.");
      } else {
        setErrSync("Salvataggio non riuscito: "+(r.errore||"errore sconosciuto")+". La modifica NON e' sul server.");
      }
    });
  };
  const toggleTheme=()=>{const t=theme==="dark"?"light":"dark";sTheme(t);localStorage.setItem("amz-theme",t);};

  if(!ok)return<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--text-muted)"}}>Caricamento...</div>;

  // Il marketplace selezionato puo' non esistere piu' (rimosso mentre era
  // aperto): in quel caso si ricade sul primario invece di rompere il tab.
  const mkSel=(mk&&mpCodes(c).includes(mk))?mk:mpPrimary(c);

  const tabs=[
    {id:"auto",   label:"🤖 Auto"},
    {id:"template",label:"📄 Template"},
    {id:"asin",   label:"🔗 ASIN"},
    {id:"rules",  label:"⚙️ Regole"},
    {id:"convert",label:"⚡ Manuale"},
    {id:"suppliers",label:"🏭 Fornitori",n:c.suppliers.length},
    {id:"marketplaces",label:"🌍 Marketplace",n:c.marketplaces.length},
    {id:"blacklist",label:"🚫 Blacklist",n:mkSettings(c,mkSel).blacklist.length},
    {id:"history",label:"📊 Storico"},
  ];

  return(
    <div>
      {showAlerts&&<AlertsPanel onClose={()=>{setShowAlerts(false);fetch("/api/alerts").then(r=>r.json()).then(d=>setAlertCount((d||[]).filter(a=>!a.read).length)).catch(()=>{});}}/>}
      <div className="app-header" style={{padding:"14px 32px"}}>
        <div style={{maxWidth:1300,margin:"0 auto",display:"flex",justifyContent:"space-between",alignItems:"center",gap:16}}>
          <div className="brandbox" style={{minWidth:0}}>
            <h1 style={{margin:0,fontSize:19,fontWeight:600,letterSpacing:"-.022em"}}>Inventory Converter <span className="hdr-ver" style={{fontSize:12,color:"var(--text-muted)",fontWeight:400}}>6.1</span></h1>
            <p style={{margin:"2px 0 0",color:"var(--text-muted)",fontSize:12.5}}>Offerte Amazon · ASIN verificato · quantità 0 al posto del purge · guard-rail</p>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
            <span className="hdr-sync" style={{display:"inline-flex",alignItems:"center",gap:5,fontSize:12,color:"var(--text-muted)"}}>
              <span style={{width:7,height:7,borderRadius:"50%",flexShrink:0,background:{idle:"var(--text-muted)",syncing:"var(--warn)",synced:"var(--ok)",error:"var(--bad)"}[syncStatus]}}/>
              {syncStatus==="syncing"&&"sincronizzo"}
              {syncStatus==="synced"&&"sincronizzato"}
              {syncStatus==="error"&&"non in linea"}
              {syncStatus==="idle"&&"in locale"}
            </span>
            <a href="fatture.html" className="navlink" title="Sistema di fatturazione: parsing delle fatture Deldo, fattura attiva intracomunitaria, storico">Fatture</a>
            <AlertBell onClick={()=>setShowAlerts(p=>!p)} count={alertCount}/>
            <ThemeToggle theme={theme} toggle={toggleTheme}/>
          </div>
        </div>
      </div>
      <div className="app-tabs" style={{padding:"0 32px 12px"}}>
        <div style={{maxWidth:1300,margin:"0 auto"}}>
          <div className="segmented" role="tablist">
            {tabs.map(t=>(
              <button key={t.id} className="seg" role="tab" aria-selected={tab===t.id} onClick={()=>sTab(t.id)}>
                {t.label}{t.n!==undefined&&<span className="segbadge">{t.n}</span>}
              </button>
            ))}
          </div>
        </div>
      </div>
      <div className="app-content" style={{padding:28,maxWidth:820,margin:"0 auto"}}>
        {errSync&&(
          <Card accent="var(--bad)" style={{marginBottom:14}}>
            <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
              <span style={{fontSize:20}}>🛑</span>
              <div style={{flex:1}}>
                <p style={{margin:0,color:"var(--bad)",fontSize:13,lineHeight:1.6}}>{errSync}</p>
                <div style={{marginTop:8}}><Btn v="ghost" onClick={()=>setErrSync(null)} style={{fontSize:11}}>Ho capito</Btn></div>
              </div>
            </div>
          </Card>
        )}
        {!pronto&&!errSync&&(
          <Card style={{marginBottom:14}}>
            <p style={{margin:0,color:"var(--text-muted)",fontSize:12}}>
              ⏳ Sto leggendo la configurazione dal server: le modifiche sono bloccate per un istante, così quello che vedi non sovrascrive i dati buoni.
            </p>
          </Card>
        )}
        {tab==="auto"&&<AutoTab config={c}/>}
        {tab==="template"&&<TemplateTab config={c} mk={mkSel} setMk={setMk}/>}
        {tab==="asin"&&<AsinTab config={c} save={save} mk={mkSel} setMk={setMk}/>}
        {tab==="rules"&&<RulesTab config={c} save={save}/>}
        {tab==="suppliers"&&<SuppliersTab config={c} save={save}/>}
        {tab==="marketplaces"&&<MarketplacesTab config={c} save={save}/>}
        {tab==="blacklist"&&<BlacklistTab config={c} save={save} pronto={pronto} mk={mkSel} setMk={setMk}/>}
        {tab==="convert"&&<ConvertTab config={c}/>}
        {tab==="history"&&<HistoryTab/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
