<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazon Inventory Converter</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────────────────────
   I nomi delle variabili sono quelli di prima (--bg-card, --border, ...):
   centinaia di stili inline nei componenti li usano, e ripuntarli qui cambia
   faccia a tutta l'app senza toccare una riga di logica.
   ───────────────────────────────────────────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
  --radius:14px;--radius-sm:9px;
}
body{
  font-family:var(--font);min-height:100vh;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;transition:background .2s,color .2s;
}
/* Cifre a larghezza fissa: le colonne di numeri si allineano davvero */
.num,input[type=number]{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-input);border-radius:5px;border:2px solid var(--bg)}

body[data-theme="dark"]{
--bg:#000000;--bg-card:#1c1c1e;--bg-input:#2c2c2e;--bg-stat:#1c1c1e;
--bg-header-start:#000000;--bg-header-end:#000000;
--border:rgba(255,255,255,.11);--border-input:rgba(255,255,255,.16);
--text:#f5f5f7;--text-muted:#a1a1a6;--text-label:#a1a1a6;
--accent:#0a84ff;--accent-fill:#0060d0;--accent-weak:rgba(10,132,255,.16);
--tab-active:#f5f5f7;--tab-inactive:#a1a1a6;--tab-badge:rgba(10,132,255,.18);
--tab-bg:#161618;--tab-sel:#2c2c2e;
--ghost-border:rgba(255,255,255,.16);--ghost-text:#0a84ff;
--badge-info:rgba(10,132,255,.16);--badge-ok:rgba(50,213,116,.16);--badge-neutral:rgba(255,255,255,.09);--badge-warn:rgba(255,179,64,.16);
--ok:#32d574;--warn:#ffb340;--bad:#ff6961;
--bl-bg:rgba(255,105,97,.12);--bl-border:rgba(255,105,97,.28);--bl-text:#ff8a82;
--accent-form:#0a84ff;
--tier-bg:#2c2c2e;--tier-border:rgba(255,255,255,.11);
--info-bg:rgba(50,213,116,.10);--info-border:rgba(50,213,116,.22);--info-text:#e6f6ec;
--chart-bar:#0a84ff;--chart-bar2:#32d574;--chart-grid:rgba(255,255,255,.11);
--shadow:0 1px 2px rgba(0,0,0,.5);
}
body[data-theme="light"]{
--bg:#f5f5f7;--bg-card:#ffffff;--bg-input:#fafafa;--bg-stat:#ffffff;
--bg-header-start:#f5f5f7;--bg-header-end:#f5f5f7;
--border:rgba(0,0,0,.09);--border-input:rgba(0,0,0,.13);
--text:#1d1d1f;--text-muted:#6e6e73;--text-label:#6e6e73;
--accent:#0071e3;--accent-fill:#0071e3;--accent-weak:rgba(0,113,227,.10);
--tab-active:#1d1d1f;--tab-inactive:#6e6e73;--tab-badge:rgba(0,113,227,.10);
--tab-bg:#ececee;--tab-sel:#ffffff;
--ghost-border:rgba(0,0,0,.13);--ghost-text:#0071e3;
--badge-info:rgba(0,113,227,.10);--badge-ok:rgba(29,143,78,.10);--badge-neutral:rgba(0,0,0,.06);--badge-warn:rgba(255,159,10,.14);
--ok:#1d8f4e;--warn:#a8620a;--bad:#c9262c;
--bl-bg:rgba(201,38,44,.07);--bl-border:rgba(201,38,44,.20);--bl-text:#c9262c;
--accent-form:#0071e3;
--tier-bg:#fafafa;--tier-border:rgba(0,0,0,.09);
--info-bg:rgba(29,143,78,.07);--info-border:rgba(29,143,78,.18);--info-text:#1d1d1f;
--chart-bar:#0071e3;--chart-bar2:#1d8f4e;--chart-grid:rgba(0,0,0,.09);
--shadow:0 1px 2px rgba(0,0,0,.04), 0 6px 20px -8px rgba(0,0,0,.10);
}
body{background:var(--bg);color:var(--text)}

/* Header: a filo e traslucido, senza gradiente */
.app-header{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
}
/* Tab: un controllo segmentato al posto di nove sottolineature */
.app-tabs{position:sticky;top:57px;z-index:19;background:color-mix(in srgb, var(--bg) 80%, transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
.segmented{display:flex;gap:2px;padding:3px;overflow-x:auto;background:var(--tab-bg);border:1px solid var(--border);border-radius:11px;scrollbar-width:none}
.segmented::-webkit-scrollbar{display:none}
.seg{flex:0 0 auto;border:0;background:none;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:500;color:var(--tab-inactive);padding:7px 13px;border-radius:8px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:color .15s,background .15s}
.seg:hover{color:var(--tab-active)}
.seg[aria-selected="true"]{background:var(--tab-sel);color:var(--tab-active);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.seg .segbadge{font-size:11px;font-weight:600;padding:1px 6px;border-radius:20px;background:var(--tab-badge);color:var(--accent)}

/* Campi: il focus si vede, e non con un bordo blu spesso */
.f:focus{outline:none;border-color:var(--accent)!important;box-shadow:0 0 0 3.5px var(--accent-weak)}

.navlink{color:var(--ghost-text);text-decoration:none;font-size:13px;font-weight:500;padding:0 11px;height:30px;display:inline-flex;align-items:center;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);transition:border-color .15s,background .15s}
.navlink:hover{border-color:var(--border-input)}

@media(min-width:1024px){.app-content{max-width:960px!important}}
@media(min-width:1280px){.app-content{max-width:1100px!important}}
@media(min-width:1536px){.app-content{max-width:1300px!important}}
@media(max-width:760px){
  .app-header{padding:12px 16px!important}
  .app-tabs{padding:0 16px 10px!important;top:53px}
  .app-content{padding:16px!important}
  /* Il titolo si accorcia invece di finire sotto i pulsanti */
  .brandbox{overflow:hidden}
  .brandbox h1{font-size:16px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brandbox p,.hdr-ver{display:none!important}
  .hdr-sync{font-size:0!important;gap:0!important}
}
</style>

<body>
<script>document.body.setAttribute("data-theme",localStorage.getItem("amz-theme")||"dark")</script>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;
const STORE_KEY="amz-conv-v6";
const DEFAULT={suppliers:[],marketplaces:[],blacklist:[],
  qtyMode:"catalog",dupMode:"price",minStock:0,maxQty:0,floorMarginPct:0,
  zeroKeepDays:90,maxDeltaPct:20,minProducts:100};
// L'id serve per controllare che il template caricato sia di quel marketplace:
// dieci nomi di colonna lo contengono, e un template sbagliato produce un file
// rifiutato in blocco. IT e DE sono verificati sui template veri; gli altri
// vengono dalla tabella degli id SP-API. Dove non l'ho verificato metto null:
// lo si compila da solo al primo caricamento del template.
const EU_MP=[
{code:"IT",name:"Amazon.it",cur:"EUR",id:"APJ6JRA9NG5V4"},
{code:"DE",name:"Amazon.de",cur:"EUR",id:"A1PA6795UKMFR9"},
{code:"FR",name:"Amazon.fr",cur:"EUR",id:"A13V1IB3VIYZZH"},
{code:"ES",name:"Amazon.es",cur:"EUR",id:"A1RKKUPIHCS9HS"},
{code:"NL",name:"Amazon.nl",cur:"EUR",id:"A1805IZSGTT6HS"},
{code:"SE",name:"Amazon.se",cur:"SEK",id:"A2NODRKZP88ZB9"},
{code:"BE",name:"Amazon.com.be",cur:"EUR",id:null},
{code:"PL",name:"Amazon.pl",cur:"PLN",id:null},
{code:"UK",name:"Amazon.co.uk",cur:"GBP",id:null}
];
const mpInfo=code=>EU_MP.find(m=>m.code===code)||{code,name:code,id:null};
/** Fasce del fornitore per un marketplace. Stessa regola del server: una lista
    vuota in tiersByMarket non e' una configurazione, si torna a quelle storiche. */
function tiersForClient(sup,code){
  const bm=sup?.tiersByMarket, want=String(code||"").toUpperCase();
  if(bm&&Array.isArray(bm[want])&&bm[want].length)return bm[want];
  return sup?.tiers||[];
}
const mpCodes=c=>(c?.marketplaces||[]).map(m=>String(m.code).toUpperCase());
const mpPrimary=c=>mpCodes(c)[0]||"IT";
/** Impostazioni effettive: override sul marketplace, poi globale, poi default.
    Stessa precedenza del server (_lib/marketplace.mjs): se le due divergessero,
    l'interfaccia mostrerebbe numeri che il file non usa. */
const MK_FALLBACK={leadtime:3,quantity:10,minStock:0,maxQty:0,onlyMapped:false};
function mkSettings(c,code){
  const m=(c?.marketplaces||[]).find(x=>String(x.code).toUpperCase()===String(code).toUpperCase())||{};
  const out={code:String(code).toUpperCase()};
  for(const f of Object.keys(MK_FALLBACK)) out[f]=m[f]??c?.[f]??MK_FALLBACK[f];
  const primario=out.code===mpPrimary(c);
  out.blacklist=Array.isArray(m.blacklist)?m.blacklist:(primario&&Array.isArray(c?.blacklist)?c.blacklist:[]);
  return out;
}
/** Selettore, visibile solo se c'e' piu' di un marketplace: con la sola Italia
    l'interfaccia resta identica a prima. */
function MarketPicker({config:c,value,onChange}){
  const codes=mpCodes(c);
  if(codes.length<2)return null;
  return(
    <Card style={{marginBottom:14,padding:"10px 14px"}}>
      <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        <span style={{fontSize:12.5,color:"var(--text-label)",fontWeight:500}}>Marketplace</span>
        {codes.map(code=>{
          const attivo=code===value;
          const m=(c.marketplaces||[]).find(x=>String(x.code).toUpperCase()===code);
          const spento=m&&m.enabled===false;
          return(
            <button key={code} onClick={()=>onChange(code)}
              style={{height:32,padding:"0 14px",borderRadius:16,fontSize:13,fontWeight:500,cursor:"pointer",fontFamily:"inherit",
                border:"1px solid "+(attivo?"transparent":"var(--border-input)"),
                background:attivo?"var(--accent-fill)":"transparent",
                color:attivo?"#fff":(spento?"var(--text-muted)":"var(--ghost-text)"),
                opacity:spento?.55:1,transition:"background .15s,border-color .15s"}}>
              {mpInfo(code).name}{spento?" (spento)":""}
            </button>
          );
        })}
      </div>
    </Card>
  );
}

const DEFAULT_TIERS=[
  {upTo:50,markupPct:18,flatFee:7},
  {upTo:100,markupPct:13,flatFee:10},
  {upTo:160,markupPct:12,flatFee:18},
  {upTo:null,markupPct:10,flatFee:30}
];

function sortTiers(tiers){
  return [...tiers].sort((a,b)=>{
    if(a.upTo===null||a.upTo===undefined)return 1;
    if(b.upTo===null||b.upTo===undefined)return -1;
    return a.upTo-b.upTo;
  });
}
// Ordinamento difensivo: il find() assume scaglioni crescenti. Riordinandoli
// dall'interfaccia, senza sort si applicherebbe il markup dello scaglione sbagliato.
function applyTiers(rp,tiers){
  if(!tiers||tiers.length===0)return rp;
  const tier=sortTiers(tiers).find(t=>t.upTo===null||t.upTo===undefined||rp<=t.upTo);
  if(!tier)return rp;
  return rp*(1+(tier.markupPct||0)/100)+(tier.flatFee||0);
}
function tierKeyFor(rp,tiers){
  if(!tiers||tiers.length===0)return "\u2014";
  const sorted=sortTiers(tiers);
  const idx=sorted.findIndex(t=>t.upTo===null||t.upTo===undefined||rp<=t.upTo);
  const t=sorted[idx];
  if(!t)return "\u2014";
  return (t.upTo===null||t.upTo===undefined)?">"+((sorted[idx-1]||{}).upTo||0)+"\u20ac":"\u2264"+t.upTo+"\u20ac";
}
// Il vecchio controllo era ean.length<8: passavano stringhe non numeriche e
// codici di lunghezza arbitraria, che Amazon rifiuta (errori 5501 / 8541).
function normalizeEAN(raw){
  const v=String(raw==null?"":raw).trim().replace(/\s+/g,"");
  if(!/^\d+$/.test(v))return null;
  if([8,12,13,14].indexOf(v.length)<0)return null;
  let sum=0;
  for(let i=v.length-2,w=3;i>=0;i--,w=(w===3?1:3))sum+=Number(v[i])*w;
  if(((10-(sum%10))%10)!==Number(v[v.length-1]))return null;
  return v;
}

function migrate(raw){
  if(!raw)return DEFAULT;
  const suppliers=(raw.suppliers||[]).map(s=>{
    if(s.tiers)return s;
    return{...s,tiers:[{upTo:null,markupPct:s.markupPct??10,flatFee:s.flatFee??10}]};
  });
  return{...DEFAULT,...raw,suppliers};
}

function loadLocal(){try{return migrate(JSON.parse(localStorage.getItem(STORE_KEY))||null)}catch{return DEFAULT}}
function persistLocal(c){localStorage.setItem(STORE_KEY,JSON.stringify(c))}
async function loadRemote(){try{const r=await fetch("/api/config");if(!r.ok)return null;return await r.json();}catch{return null;}}
async function persistRemote(c){
  // Prima ingoiava tutto in un catch: un rifiuto del server (conflitto di
  // versione, blacklist che si accorcia) risultava indistinguibile da un
  // salvataggio riuscito. Ora l'esito torna al chiamante.
  try{
    const r=await fetch("/api/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(c)});
    const d=await r.json().catch(()=>({}));
    if(r.status===409) return {ok:false,rifiutato:true,...d};
    if(!r.ok) return {ok:false,errore:d.error||("HTTP "+r.status)};
    return {ok:true,rev:d.rev};
  }catch(e){ return {ok:false,errore:e.message}; }
}
// Parser che gestisce i campi quotati: con il vecchio split(delimiter) bastava
// un campo tipo "Pirelli; P Zero" per far slittare tutte le colonne successive
// e pubblicare un prezzo letto dalla colonna sbagliata, senza alcun errore.
function parseCSV(text,delimiter){
  if(!text)return{h:[],r:[]};
  const src=text.charCodeAt(0)===0xfeff?text.slice(1):text;
  const d=delimiter||";";
  const recs=[];let field="",rec=[],q=false;
  for(let i=0;i<src.length;i++){
    const ch=src[i];
    if(q){
      if(ch==='"'){if(src[i+1]==='"'){field+='"';i++;}else q=false;}
      else field+=ch;
      continue;
    }
    if(ch==='"'&&field===""){q=true;continue;}
    if(ch===d){rec.push(field);field="";continue;}
    if(ch==="\r")continue;
    if(ch==="\n"){rec.push(field);recs.push(rec);rec=[];field="";continue;}
    field+=ch;
  }
  if(field!==""||rec.length){rec.push(field);recs.push(rec);}
  const ne=recs.filter(r=>r.some(c=>c.trim()!==""));
  if(ne.length<2)return{h:[],r:[]};
  const h=ne[0].map(x=>x.trim());
  const r=ne.slice(1).map(cols=>{const o={};h.forEach((k,i)=>{o[k]=(cols[i]==null?"":cols[i]).trim()});return o});
  return{h,r};
}
function fCol(hs,n){return n?(hs.find(h=>h.toLowerCase()===String(n).toLowerCase())||null):null}

// ─── Formato template Amazon (lato browser) ──────────────────────────────────
// Stesse regole del server (netlify/functions/_lib/template.mjs): le colonne si
// risolvono per pattern sulla riga degli attributi, mai per posizione fissa.
const FIELD_PATTERNS={
  sku:/^contribution_sku#1\.value$/,
  action:/^::record_action$/,
  extIdType:/^externally_assigned_product_identifier#1\.type$/,
  extId:/^externally_assigned_product_identifier#1\.value$/,
  asin:/^merchant_suggested_asin#1\.value$/,
  condition:/^condition_type#1\.value$/,
  channel:/^fulfillment_availability#1\.fulfillment_channel_code$/,
  quantity:/^fulfillment_availability#1\.quantity$/,
  leadtime:/^fulfillment_availability#1\.lead_time_to_ship_max_days$/,
  price:/our_price#1\.schedule#1\.value_with_tax$/,
  minPrice:/minimum_seller_allowed_price#1\.schedule#1\.value_with_tax$/,
  maxPrice:/maximum_seller_allowed_price#1\.schedule#1\.value_with_tax$/
};
const REQUIRED_FIELDS=["sku","action","extIdType","extId","condition","channel","quantity","price"];
const FIELD_LABELS={sku:"SKU",action:"Azione",extIdType:"Tipo ID",extId:"EAN",asin:"ASIN",condition:"Condizione",channel:"Canale",quantity:"Quantità",leadtime:"Tempo gestione",price:"Prezzo",minPrice:"Prezzo min",maxPrice:"Prezzo max"};
const VOCAB={
  it_IT:{create:"Crea o modifica",ean:"EAN",conditionNew:"Nuovo",channelMerchant:"Gestito dal venditore (default)"},
  en_GB:{create:"Create or update",ean:"EAN",conditionNew:"New",channelMerchant:"Merchant Fulfilled (default)"},
  // VERIFICATO sul template DE scaricato il 27/08/2026: le due stringhe che avevo
  // scritto a memoria erano sbagliate ("Erstellen oder aktualisieren" e
  // "Vom Verkäufer versandt (Standard)").
  de_DE:{create:"Erstellen oder Bearbeiten",ean:"EAN",conditionNew:"Neu",channelMerchant:"Versand durch Händler (Standard)"},
  fr_FR:{create:"Créer ou mettre à jour",ean:"EAN",conditionNew:"Neuf",channelMerchant:"Expédié par le vendeur (par défaut)"},
  es_ES:{create:"Crear o actualizar",ean:"EAN",conditionNew:"Nuevo",channelMerchant:"Gestionado por el vendedor (predeterminado)"}
};
const VOCAB_ATTRS={
  action:/^::record_action$/,
  extIdType:/^externally_assigned_product_identifier#1\.type$/,
  condition:/^condition_type#1\.value$/,
  channel:/^fulfillment_availability#1\.fulfillment_channel_code$/,
};
// Il vocabolario giusto sta nel template, foglio "Dropdown Lists": riga 3 il nome
// tecnico, righe 4+ i valori nella lingua del file. La tabella VOCAB e' hardcodata
// e le stringhe non italiane non sono verificate: se una non combacia Amazon
// rifiuta tutte le righe. Quindi si usa solo come ultima spiaggia.
function vocabFromLists(l,es){
  es=es||{};
  if(!l)return null;
  const a=l.action,c=l.condition,ch=l.channel,e=l.extIdType;
  if(!(a&&a.length)||!(c&&c.length)||!(ch&&ch.length)||!(e&&e.length))return null;
  const ean=e.find(v=>/^ean$/i.test(String(v).trim()));
  if(!ean||a.length<2)return null;
  // La riga di esempio contiene il valore di creazione con un prefisso:
  // "(Impostazione predefinita) Crea o modifica" · "(Standard) Erstellen oder Bearbeiten".
  const dentro=(lista,camp)=>camp?(lista.find(v=>v&&String(camp).includes(v))||null):null;
  const create=dentro(a,es.action)||a[0];
  const del=a.find(v=>v!==create); if(!del)return null;
  const conditionNew=(es.condition&&c.indexOf(es.condition.trim())>=0)?es.condition.trim():c[0];
  // Canale: la POSIZIONE NON VALE. Su IT la lista e' [venditore, Amazon]; sul
  // template DE del 27/08 e' rovesciata: ["Versand durch Amazon (EU)",
  // "Versand durch Händler (Standard)"]. L'opzione della logistica Amazon nomina
  // Amazon, quella del venditore no, in nessuna lingua.
  const nonAmazon=ch.filter(v=>!/amazon/i.test(String(v)));
  if(nonAmazon.length!==1)return null;
  const channelMerchant=nonAmazon[0];
  if(a.indexOf(create)<0||a.indexOf(del)<0||c.indexOf(conditionNew)<0||ch.indexOf(channelMerchant)<0)return null;
  return{create,delete:del,ean,conditionNew,channelMerchant,origine:"template"};
}
function vocabExamples(t){
  const rc=resolveColumns(t), row=(t&&t.headerRows&&t.headerRows[5])||[];
  const at=f=>(rc.cols[f]!==undefined&&row[rc.cols[f]]!=null)?String(row[rc.cols[f]]).trim():null;
  return{action:at("action"),condition:at("condition")};
}
function vocabFor(t){
  const dal=vocabFromLists(t&&t.vocabLists,vocabExamples(t));
  if(dal)return dal;
  const lang=t&&t.contentLanguageTag;
  const f=VOCAB[lang]||VOCAB.it_IT;
  return{...f,origine:VOCAB[lang]?("tabella:"+lang):"tabella:it_IT (lingua non riconosciuta)"};
}
function extractVocabLists(wb){
  const name=wb.SheetNames.find(n=>n==="Dropdown Lists")||wb.SheetNames.find(n=>/dropdown|tendina|listas|listes/i.test(n));
  if(!name)return null;
  const sh=wb.Sheets[name]; if(!sh||!sh["!ref"])return null;
  const rng=XLSX.utils.decode_range(sh["!ref"]);
  const at=(r,c)=>{const k=XLSX.utils.encode_cell({r,c});return sh[k]?String(sh[k].v).trim():""};
  const out={};
  for(let c=0;c<=rng.e.c;c++){
    const attr=at(2,c); if(!attr)continue;
    for(const f in VOCAB_ATTRS){
      if(out[f]||!VOCAB_ATTRS[f].test(attr))continue;
      const vals=[]; for(let r=3;r<=rng.e.r;r++){const v=at(r,c); if(v==="")break; vals.push(v)}
      if(vals.length)out[f]=vals;
    }
  }
  return Object.keys(out).length?out:null;
}

function resolveColumns(t){
  const attrs=((t.headerRows||[])[(t.attributeRow||5)-1]||[]).map(v=>String(v==null?"":v).trim());
  const cols={};
  Object.keys(FIELD_PATTERNS).forEach(f=>{const i=attrs.findIndex(a=>FIELD_PATTERNS[f].test(a));if(i>=0)cols[f]=i;});
  return{cols,missing:REQUIRED_FIELDS.filter(f=>cols[f]===undefined),attrs};
}
// Solo per il .txt: un file di testo non ha tipi di cella, quindi il prezzo va
// scritto con il separatore decimale del marketplace.
// Nell'.xlsx il prezzo deve restare un NUMERO: come testo Amazon lo rifiuta con
// l'errore 13006 "Formato cella errato. Imposta il formato in Excel su Numero".
function fmtPrice(v,mp){const s=Number(v).toFixed(2);return mp==="UK"?s:s.replace(".",",")}
function round2(n){return Math.round(Number(n)*100)/100}
function priceColumns(t){const r=resolveColumns(t);return ["price","minPrice","maxPrice"].map(f=>r.cols[f]).filter(i=>i!==undefined)}

// Espande i record compatti in righe larghe nCols. qty 0 = riga di disattivazione.
function expandRecords(records,t,opts){
  // Stessa rete di sicurezza del server: su DE la lista del canale e' rovesciata
  // rispetto a IT, e scrivere l'elemento sbagliato significa Logistica di Amazon
  // su tutto il catalogo, con zero merce nei magazzini Amazon.
  {const _v=vocabFor(t);
   if(/amazon/i.test(String(_v.channelMerchant)))
     throw new Error('Il canale di spedizione sarebbe "'+_v.channelMerchant+'", che nomina Amazon: significherebbe Logistica di Amazon, non gestito dal venditore. Ricarica il template dal tab Template.');}

  opts=opts||{};
  const r=resolveColumns(t);
  if(r.missing.length)throw new Error("Template incompleto: mancano "+r.missing.map(m=>FIELD_LABELS[m]||m).join(", "));
  const cols=r.cols,voc=vocabFor(t),mp=opts.marketplace||"IT",lead=opts.leadtime,n=t.nCols;
  return records.map(rec=>{
    const row=new Array(n).fill("");
    const put=(f,v)=>{if(cols[f]!==undefined)row[cols[f]]=v};
    put("sku",rec.sku);put("action",voc.create);
    // Con un ASIN verificato scriviamo quello e NON l'EAN: le istruzioni del
    // template dicono "l'ASIN OPPURE l'ID esterno", e l'ASIN inchioda l'offerta
    // al prodotto giusto invece di lasciare l'abbinamento ad Amazon.
    if(rec.asin&&cols.asin!==undefined){put("asin",rec.asin);}
    else{put("extIdType",voc.ean);put("extId",rec.ean);}
    put("condition",voc.conditionNew);
    put("channel",voc.channelMerchant);
    put("quantity",Number(rec.qty)||0);
    if(lead!==null&&lead!==undefined&&lead!=="")put("leadtime",Number(lead));
    put("price",round2(rec.price));
    if(rec.minPrice!=null)put("minPrice",round2(rec.minPrice));
    if(rec.maxPrice!=null)put("maxPrice",round2(rec.maxPrice));
    return row;
  });
}

// .txt tab-delimited: equivale al "Salva come → Testo (delimitato da tabulazioni)" di Excel.
function buildTxt(t,dataRows,opts){
  opts=opts||{};
  const n=t.nCols, mp=opts.marketplace||"IT";
  const dec=new Set(opts.decimalCols||priceColumns(t));
  const pad=r=>{const a=(r||[]).slice(0,n);while(a.length<n)a.push("");return a};
  const esc=v=>String(v==null?"":v).replace(/\t/g," ").replace(/\r?\n/g," ");
  const fmt=(v,i)=>(dec.has(i)&&typeof v==="number")?fmtPrice(v,mp):esc(v);
  const lines=[];
  (t.headerRows||[]).forEach(hr=>lines.push(pad(hr).map(esc).join("\t")));
  dataRows.forEach(dr=>lines.push(pad(dr).map(fmt).join("\t")));
  return lines.join("\r\n")+"\r\n";
}

// .xlsx costruito a celle sparse: con 140 colonne e migliaia di righe scrivere
// anche le celle vuote significherebbe oltre un milione di celle inutili.
function buildXlsx(t,dataRows){
  if(typeof XLSX==="undefined")throw new Error("Libreria Excel non caricata, ricarica la pagina");
  const ws={},n=t.nCols;
  const dec=new Set(priceColumns(t));
  const set=(r,c,v)=>{
    if(v===""||v===null||v===undefined)return;
    const addr=XLSX.utils.encode_cell({r:r,c:c});
    if(typeof v==="number"){
      // I prezzi restano numerici con due decimali: Amazon rifiuta il testo (errore 13006)
      ws[addr]=dec.has(c)?{t:"n",v:v,z:"0.00"}:{t:"n",v:v};
    }else ws[addr]={t:"s",v:String(v)};
  };
  const hdr=t.headerRows||[];
  hdr.forEach((row,ri)=>{for(let c=0;c<n;c++)set(ri,c,row[c])});
  dataRows.forEach((row,ri)=>{for(let c=0;c<n;c++)set(hdr.length+ri,c,row[c])});
  ws["!ref"]=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(hdr.length+dataRows.length-1,0),c:n-1}});
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,(t.sheetName||"Modello").slice(0,31));
  return XLSX.write(wb,{bookType:"xlsx",type:"array"});
}

function dlBlob(data,filename,mime){
  const b=new Blob([data],{type:mime});
  const u=URL.createObjectURL(b);
  const a=document.createElement("a");
  a.href=u;a.download=filename;document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(u);
}

// Legge le prime 6 righe del foglio "Modello" dal template scaricato da Seller Central.
async function parseTemplateFile(file){
  if(typeof XLSX==="undefined")throw new Error("Libreria Excel non caricata, ricarica la pagina");
  const buf=await file.arrayBuffer();
  // Prima leggevamo con sheetRows:6, che tronca ogni foglio: le liste dei valori
  // validi scendono oltre la sesta riga (condition_type ne ha 13) e sarebbero
  // arrivate mutilate. Il file e' mezzo megabyte, leggerlo intero non e' un problema.
  const wb=XLSX.read(buf,{type:"array"});
  const sheetName=wb.SheetNames.indexOf("Modello")>=0?"Modello":(wb.SheetNames.find(x=>/model|modello|template|vorlage|plantilla|modèle/i.test(x))||wb.SheetNames[0]);
  const ws=wb.Sheets[sheetName];
  if(!ws)throw new Error("Foglio dati non trovato nel file");
  const aoaTutto=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:"",blankrows:true});
  const aoa=aoaTutto.slice(0,6);   // del foglio Modello ci servono solo le intestazioni
  while(aoa.length<6)aoa.push([]);
  const a1=String((aoa[0]||[])[0]||"");
  if(a1.indexOf("settings=")!==0)throw new Error('La cella A1 non inizia con "settings=": non sembra un template Amazon');
  const num=(k,d)=>{const m=a1.match(new RegExp(k+"=(\\d+)"));return m?parseInt(m[1],10):d};
  const str=re=>{const m=a1.match(re);return m?m[1]:null};
  const labelRow=num("labelRow",4),attributeRow=num("attributeRow",5),dataRow=num("dataRow",7);
  // nCols = ultima colonna con etichetta o nome campo valorizzato
  let nCols=0;
  [labelRow-1,attributeRow-1].forEach(ri=>{
    const row=aoa[ri]||[];
    for(let c=row.length-1;c>=0;c--){if(String(row[c]||"").trim()!==""){nCols=Math.max(nCols,c+1);break}}
  });
  if(!nCols)throw new Error("Non ho trovato la riga dei nomi campo nel foglio "+sheetName);
  const pad=r=>{const a=(r||[]).slice(0,nCols).map(v=>v==null?"":String(v));while(a.length<nCols)a.push("");return a};
  const t={
    source:file.name,sheetName:sheetName,nCols:nCols,
    labelRow:labelRow,attributeRow:attributeRow,dataRow:dataRow,
    marketplaceId:str(/primaryMarketplaceId=amzn1\.mp\.o\.([A-Z0-9]+)/),
    contentLanguageTag:str(/contentLanguageTag=([a-zA-Z_]+)/),
    headerRows:[pad(aoa[0]),pad(aoa[1]),pad(aoa[2]),pad(aoa[3]),pad(aoa[4]),pad(aoa[5])],
    vocabLists:extractVocabLists(wb)
  };
  if(!vocabFromLists(t.vocabLists))
    throw new Error("Nel file non trovo il foglio \"Dropdown Lists\" con i valori validi (azione, condizione, canale, tipo di ID). Scarica il template completo da Seller Central, non un file salvato o riesportato.");
  const rc=resolveColumns(t);
  if(rc.missing.length)throw new Error("Colonne obbligatorie non trovate: "+rc.missing.map(m=>FIELD_LABELS[m]||m).join(", "));
  return t;
}

// Scarica dal server il template completo (righe di intestazione incluse).
let _templateCache={};   // per marketplace
/**
 * Template completo, in cache PER MARKETPLACE.
 *
 * Prima la cache era una sola variabile: con due marketplace, scaricato il file
 * italiano, il successivo download tedesco avrebbe riusato il template italiano
 * e prodotto un file con l'id marketplace sbagliato in dieci colonne — rifiutato
 * in blocco da Amazon.de, e senza niente a schermo che lo spiegasse.
 */
async function getFullTemplate(code,force){
  const mk=String(code||"IT").toUpperCase();
  if(_templateCache[mk]&&!force)return _templateCache[mk];
  const r=await fetch("/api/template?full=1&mk="+encodeURIComponent(mk));
  if(!r.ok)throw new Error("Template non disponibile (HTTP "+r.status+")");
  const d=await r.json();
  if(!d.template)throw new Error(d.error||("Nessun template configurato per "+mk));
  _templateCache[mk]=d.template;
  return d.template;
}

/** Un accento non disegna piu' una cornice colorata attorno alla card: tinge
    appena il fondo e lascia il bordo a filo. La cornice spessa faceva sembrare
    urgente qualunque cosa, e con tre card accanto la pagina urlava. */
function Card({children,style,accent}){
  const acc=accent?{background:`color-mix(in srgb, ${accent} 7%, var(--bg-card))`,borderColor:`color-mix(in srgb, ${accent} 26%, var(--border))`}:{};
  return<div style={{...S.card,...acc,...style}}>{children}</div>

function Inp({label,...p}){return<div style={{marginBottom:12}}>{label&&<label style={S.label}>{label}</label>}<input {...p} className={"f "+(p.className||"")} style={{...S.input,...p.style}}/></div>}
function Sel({label,options,...p}){return<div style={{marginBottom:12}}>{label&&<label style={S.label}>{label}</label>}<select {...p} className="f" style={S.input}>{options.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}</select></div>}
function Btn({children,onClick,v="pri",style,disabled}){
  // Pieno solo per l'azione principale e per il verde di conferma; il resto e'
  // testo su bordo a filo. Il rosso non e' mai pieno: cancellare non deve
  // essere il pulsante piu' invitante della schermata.
  const st={
    pri:{background:"var(--accent-fill)",color:"#fff",border:"1px solid transparent"},
    ok:{background:"var(--accent-fill)",color:"#fff",border:"1px solid transparent"},
    danger:{background:"transparent",color:"var(--bad)",border:"1px solid var(--border-input)"},
    ghost:{background:"transparent",color:"var(--ghost-text)",border:"1px solid var(--border-input)"},

}

function MiniBar({data,color,height=60}){
  if(!data||data.length===0)return null;

  return(
    <div style={{display:"flex",alignItems:"flex-end",gap:3,height,padding:"4px 0"}}>

        </div>
      ))}
    </div>
  );
}

function HistoryTab(){
  const[records,setRecords]=useState([]);
  const[loading,setLoading]=useState(true);
  const[error,setError]=useState(null);
  const[expanded,setExpanded]=useState(null);

  const fetchHistory=async()=>{
    setLoading(true);setError(null);
    try{
      const r=await fetch("/api/history");
      if(!r.ok)throw new Error(`HTTP ${r.status}`);
      const data=await r.json();
      setRecords(data);
    }catch(e){setError(e.message);}
    finally{setLoading(false);}
  };

  useEffect(()=>{fetchHistory();},[]);

  const deleteRecord=async(id)=>{
    if(!confirm("Eliminare questo record?"))return;
    try{
      await fetch(`/api/history?id=${id}`,{method:"DELETE"});

  };

            <span style={{fontSize:10,color:"var(--text-muted)"}}>{chartData[chartData.length-1]?.label}</span>
          </div>

      {/* KPI riepilogo */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10,marginBottom:14}}>
        {[
          ["Conversioni totali", records.length],

          ["Max prodotti", Math.max(...records.map(r=>r.total_products)).toLocaleString()],

function TiersEditor({tiers,onChange}){
  const updateTier=(i,field,val)=>{const next=tiers.map((t,j)=>j===i?{...t,[field]:val}:t);onChange(next);};
  const addTier=()=>{const last=tiers[tiers.length-1];const prev=tiers[tiers.length-2];const newUpTo=prev?(prev.upTo||0)+50:100;onChange([...tiers.slice(0,-1),{upTo:newUpTo,markupPct:last.markupPct,flatFee:last.flatFee},last]);};
  const removeTier=(i)=>{if(tiers.length<=1)return;onChange(tiers.filter((_,j)=>j!==i));};
  const previewNet=(tier,ex)=>{const sell=applyTiers(ex,[{...tier,upTo:null}]);return(sell-sell*0.08-ex).toFixed(2);};
  const midPrice=(tier,i)=>{if(i===0)return Math.min(tier.upTo||50,40);const prev=tiers[i-1];const lo=prev.upTo||0;const hi=tier.upTo||lo+100;return Math.round((lo+hi)/2);};
  return(
    <div style={{marginBottom:10}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <label style={S.label}>Fasce di rincaro (prezzo fornitore)</label>

      </div>
      <div style={{background:"var(--info-bg)",border:"1px solid var(--info-border)",borderRadius:8,padding:"10px 14px",marginBottom:10,fontSize:12,color:"var(--info-text)",lineHeight:1.6}}>
        <strong>Come funzionano le fasce:</strong> prezzo_fornitore × (1 + ricarico%) + quota_fissa<br/>
        La prima fascia il cui limite ≥ prezzo fornitore viene applicata. L'ultima (senza limite) vale per tutti i prezzi superiori.<br/>
        Il <strong>netto stimato</strong> è già al netto della commissione Amazon 8%.
      </div>
      {tiers.map((tier,i)=>{
        const ex=midPrice(tier,i);const net=previewNet(tier,ex);const sellEx=applyTiers(ex,[{...tier,upTo:null}]).toFixed(2);const isLast=i===tiers.length-1;
        return(
          <div key={i} style={{background:"var(--tier-bg)",border:"1px solid var(--tier-border)",borderRadius:10,padding:"12px 14px",marginBottom:8}}>
            <div style={{display:"flex",gap:10,alignItems:"flex-end",flexWrap:"wrap"}}>
              <div style={{minWidth:120}}>
                <label style={S.label}>{isLast?"Oltre (∞)":"Fino a (€)"}</label>
                {isLast?<div style={{...S.input,color:"var(--text-muted)",cursor:"not-allowed",background:"var(--bg)"}}>∞ oltre</div>
                :<input type="number" value={tier.upTo??""} onChange={e=>updateTier(i,"upTo",e.target.value===""?null:parseFloat(e.target.value))} style={S.input} placeholder="es. 100"/>}
              </div>
              <div style={{minWidth:110}}><label style={S.label}>Ricarico %</label><input type="number" value={tier.markupPct} onChange={e=>updateTier(i,"markupPct",parseFloat(e.target.value)||0)} style={S.input}/></div>
              <div style={{minWidth:110}}><label style={S.label}>Quota fissa (€)</label><input type="number" value={tier.flatFee} onChange={e=>updateTier(i,"flatFee",parseFloat(e.target.value)||0)} style={S.input}/></div>
              <div style={{flex:1,minWidth:160,background:"var(--bg-stat)",borderRadius:8,padding:"8px 12px",fontSize:12,lineHeight:1.7}}>
                <div style={{color:"var(--text-muted)"}}>Es. a <strong style={{color:"var(--text)"}}>{ex}€</strong>:</div>
                <div>Vendo a <strong style={{color:"var(--accent-form)"}}>{sellEx}€</strong></div>
                <div>Netto: <strong style={{color:parseFloat(net)>0?"var(--ok)":"var(--bad)"}}>{net}€</strong></div>
              </div>
              {tiers.length>1&&<Btn v="danger" onClick={()=>removeTier(i)} style={{fontSize:11,padding:"5px 10px",alignSelf:"flex-end"}}>✕</Btn>}
            </div>
          </div>
        );
      })}
      <div style={{fontSize:11,color:"var(--text-muted)",marginTop:4}}>
        {tiers.map((t,i)=>{const lbl=t.upTo===null?`oltre`:` ≤${t.upTo}€`;return<span key={i} style={{marginRight:10}}>{lbl}: +{t.markupPct}%+{t.flatFee}€</span>;})}
      </div>
    </div>
  );
}

// ─── SuppliersTab ────────────────────────────────────────────────────────────
function SuppliersTab({config:c,save}){
  const[ed,sEd]=useState(null);
  const[f,sF]=useState({name:"",delimiter:";",skuCol:"",eanCol:"",priceCol:"",stockCol:"",ftpFolder:"",tiers:DEFAULT_TIERS,tiersByMarket:{}});
  // Marketplace di cui si stanno modificando le fasce. Il primario modifica
  // "tiers"; gli altri modificano tiersByMarket[CODICE] solo se hanno fasce
  // dedicate, altrimenti ereditano quelle del primario (stessa regola del
  // server in _lib/marketplace.mjs → tiersFor).
  const[mkT,setMkT]=useState(null);
  const codes=mpCodes(c), primario=mpPrimary(c);
  const codeT=(mkT&&codes.includes(mkT))?mkT:primario;
  const dedicate=codeT!==primario&&Array.isArray(f.tiersByMarket?.[codeT])&&f.tiersByMarket[codeT].length>0;
  const tiersInEdit=dedicate?f.tiersByMarket[codeT]:(f.tiers||[]);
  const setTiersInEdit=tiers=>{
    if(dedicate)sF({...f,tiersByMarket:{...f.tiersByMarket,[codeT]:tiers}});
    else sF({...f,tiers});
  };
  const creaDedicate=()=>sF({...f,tiersByMarket:{...f.tiersByMarket,[codeT]:(f.tiers||[]).map(t=>({...t}))}});
  const togliDedicate=()=>{const bm={...f.tiersByMarket};delete bm[codeT];sF({...f,tiersByMarket:bm})};
  const copiaTiers=t=>(t||[]).map(x=>({...x}));
  const nw=()=>{sF({name:"",delimiter:";",skuCol:"",eanCol:"",priceCol:"",stockCol:"",ftpFolder:"",tiers:DEFAULT_TIERS.map(t=>({...t})),tiersByMarket:{}});setMkT(primario);sEd("new");};
  const ed2=i=>{const s=c.suppliers[i];
    const bm={};
    for(const[k,v]of Object.entries(s.tiersByMarket||{}))if(Array.isArray(v)&&v.length)bm[String(k).toUpperCase()]=copiaTiers(v);
    sF({...s,stockCol:s.stockCol||"",ftpFolder:s.ftpFolder||"",tiers:s.tiers?copiaTiers(s.tiers):DEFAULT_TIERS.map(t=>({...t})),tiersByMarket:bm});
    setMkT(primario);sEd(i);};
  const norm=tiers=>{
    const out=tiers.map(t=>({...t,markupPct:parseFloat(t.markupPct)||0,flatFee:parseFloat(t.flatFee)||0,upTo:t.upTo===null?null:parseFloat(t.upTo)||null}));
    // L'ultima fascia non ha limite: se restasse un numero, i prezzi sopra
    // quel limite resterebbero senza fascia e uscirebbero senza ricarico.
    if(out.length>0)out[out.length-1].upTo=null;
    return out;
  };
  const sv=()=>{
    if(!f.name||!f.skuCol||!f.eanCol||!f.priceCol)return;
    const bm={};
    for(const[k,v]of Object.entries(f.tiersByMarket||{}))if(Array.isArray(v)&&v.length)bm[String(k).toUpperCase()]=norm(v);
    const s={...f,tiers:norm(f.tiers),tiersByMarket:Object.keys(bm).length?bm:undefined};
    if(!s.tiersByMarket)delete s.tiersByMarket;
    const l=[...c.suppliers];ed==="new"?l.push(s):(l[ed]=s);save({...c,suppliers:l});sEd(null);
  };
  const rm=i=>save({...c,suppliers:c.suppliers.filter((_,j)=>j!==i)});
  const tiersBadge=tiers=>tiers.map((t,i)=>{const lbl=t.upTo===null?`oltre`:` ≤${t.upTo}€`;return`${lbl}: +${t.markupPct}%+${t.flatFee}€`;}).join(" | ");
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <h3 style={{margin:0,color:"var(--text)",fontSize:17}}>Fornitori</h3><Btn onClick={nw}>+ Aggiungi</Btn>
      </div>
      {c.suppliers.length===0&&ed===null&&<Card><p style={{color:"var(--text-muted)",textAlign:"center",margin:0}}>Nessun fornitore configurato.</p></Card>}
      {c.suppliers.map((s,i)=>(
        <Card key={i}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div style={{flex:1}}>
              <strong style={{color:"var(--text)",fontSize:15}}>{s.name}</strong>
              <div style={{marginTop:6,display:"flex",gap:6,flexWrap:"wrap"}}>
                <span style={S.badge("var(--badge-info)")}>SKU: {s.skuCol}</span>
                <span style={S.badge("var(--badge-info)")}>EAN: {s.eanCol}</span>
                <span style={S.badge("var(--badge-info)")}>Prezzo: {s.priceCol}</span>
                {s.stockCol&&<span style={S.badge("var(--badge-info)")}>Stock: {s.stockCol}</span>}
                {s.ftpFolder&&<span style={S.badge("var(--badge-neutral)")}>FTP: {s.ftpFolder}</span>}
              </div>
              <div style={{marginTop:6,fontSize:11,color:"var(--text-muted)"}}>
                {codes.length>1&&<span style={{color:"var(--text-label)"}}>{mpInfo(primario).name}: </span>}
                {s.tiers?tiersBadge(s.tiers):`+${s.markupPct}%+${s.flatFee}€`}
              </div>
              {Object.entries(s.tiersByMarket||{}).filter(([,v])=>Array.isArray(v)&&v.length).map(([code,v])=>(
                <div key={code} style={{marginTop:3,fontSize:11,color:"var(--text-muted)"}}>
                  <span style={{color:"var(--text-label)"}}>{mpInfo(String(code).toUpperCase()).name}: </span>{tiersBadge(v)}
                </div>
              ))}
            </div>
            <div style={{display:"flex",gap:6,marginLeft:10}}><Btn v="ghost" onClick={()=>ed2(i)}>Modifica</Btn><Btn v="danger" onClick={()=>rm(i)}>✕</Btn></div>
          </div>
        </Card>
      ))}
      {ed!==null&&(
        <Card accent="var(--accent)">
          <h4 style={{color:"var(--accent-form)",margin:"0 0 10px"}}>{ed==="new"?"Nuovo fornitore":"Modifica fornitore"}</h4>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:"0 14px"}}>
            <Inp label="Nome" value={f.name} onChange={e=>sF({...f,name:e.target.value})} placeholder="es. Deldo"/>
            <Sel label="Delimitatore" value={f.delimiter} onChange={e=>sF({...f,delimiter:e.target.value})} options={[{v:";",l:"Punto e virgola (;)"},{v:",",l:"Virgola (,)"},{v:"\t",l:"Tab"},{v:"|",l:"Pipe (|)"}]}/>
            <Inp label="Colonna SKU" value={f.skuCol} onChange={e=>sF({...f,skuCol:e.target.value})} placeholder="es. Article"/>
            <Inp label="Colonna EAN" value={f.eanCol} onChange={e=>sF({...f,eanCol:e.target.value})} placeholder="es. EAN"/>
            <Inp label="Colonna Prezzo" value={f.priceCol} onChange={e=>sF({...f,priceCol:e.target.value})} placeholder="es. Price"/>
            <Inp label="Colonna Stock" value={f.stockCol} onChange={e=>sF({...f,stockCol:e.target.value})} placeholder="es. Stock"/>
            <Inp label="Cartella FTP (se diversa dal nome)" value={f.ftpFolder} onChange={e=>sF({...f,ftpFolder:e.target.value})} placeholder={`es. DLD (lascia vuoto se uguale a "${f.name||"nome fornitore"}")`}/>
          </div>
          {codes.length>1&&(
            <div style={{background:"var(--bg-stat)",borderRadius:10,padding:"10px 14px",margin:"4px 0 12px"}}>
              <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                <span style={{fontSize:12.5,color:"var(--text-label)",fontWeight:500}}>Fasce per</span>
                {codes.map(code=>{
                  const att=code===codeT;
                  const ded=code===primario||(Array.isArray(f.tiersByMarket?.[code])&&f.tiersByMarket[code].length>0);
                  return(
                    <button key={code} onClick={()=>setMkT(code)}
                      style={{height:30,padding:"0 13px",borderRadius:15,fontSize:12.5,fontWeight:500,cursor:"pointer",fontFamily:"inherit",
                        border:"1px solid "+(att?"transparent":"var(--border-input)"),
                        background:att?"var(--accent-fill)":"transparent",
                        color:att?"#fff":"var(--ghost-text)",transition:"background .15s,border-color .15s"}}>
                      {mpInfo(code).name}{ded?"":" (eredita)"}
                    </button>
                  );
                })}
              </div>
              {codeT!==primario&&(
                <div style={{marginTop:8,fontSize:12,color:"var(--text-muted)",lineHeight:1.6}}>
                  {dedicate
                    ? <>Fasce dedicate a {mpInfo(codeT).name}. <Btn v="ghost" onClick={togliDedicate} style={{fontSize:11,padding:"3px 9px",marginLeft:6}}>Torna alle fasce di {mpInfo(primario).name}</Btn></>
                    : <>{mpInfo(codeT).name} usa le stesse fasce di {mpInfo(primario).name}. <Btn v="ghost" onClick={creaDedicate} style={{fontSize:11,padding:"3px 9px",marginLeft:6}}>Fasce dedicate per {mpInfo(codeT).name}</Btn></>}
                </div>
              )}
            </div>
          )}
          <TiersEditor tiers={tiersInEdit} onChange={setTiersInEdit}/>
          {codes.length>1&&!dedicate&&codeT!==primario&&(
            <div style={{fontSize:11,color:"var(--warn)",marginTop:-6,marginBottom:10}}>
              Stai modificando le fasce di {mpInfo(primario).name}: valgono anche per {mpInfo(codeT).name} finché non gliene dai di dedicate.
            </div>
          )}
          <div style={{display:"flex",gap:8,marginTop:4}}><Btn v="ok" onClick={sv}>Salva</Btn><Btn v="ghost" onClick={()=>sEd(null)}>Annulla</Btn></div>
        </Card>
      )}
    </div>
  );
}

// ─── MarketplacesTab ─────────────────────────────────────────────────────────
function MarketplacesTab({config:c,save}){
  const[ed,sEd]=useState(null);
  const vuoto={code:"DE",marketplaceId:"",quantity:8,leadtime:4,minStock:"",maxQty:"",enabled:true,onlyMapped:false};
  const[f,sF]=useState(vuoto);
  const lista=c.marketplaces||[];

  const nw=()=>{
    // proponi il primo marketplace europeo non ancora configurato
    const liberi=EU_MP.filter(m=>!mpCodes(c).includes(m.code));
    const primo=liberi[0]||EU_MP[1];
    sF({...vuoto,code:primo.code,marketplaceId:primo.id||""});
    sEd("new");
  };
  const apri=i=>{const m=lista[i];sF({
    code:m.code,marketplaceId:m.marketplaceId||mpInfo(m.code).id||"",
    quantity:m.quantity??8,leadtime:m.leadtime??4,
    minStock:m.minStock??"",maxQty:m.maxQty??"",
    enabled:m.enabled!==false,onlyMapped:!!m.onlyMapped,
  });sEd(i);};

  const sv=()=>{
    const code=String(f.code).toUpperCase();
    const doppio=lista.some((m,j)=>String(m.code).toUpperCase()===code&&j!==(ed==="new"?-1:ed));
    if(doppio){alert(`${code} è già configurato: non puoi averlo due volte.`);return}
    const num=v=>v===""||v===null||v===undefined?undefined:(parseInt(v,10)||0);
    const m={
      ...(ed==="new"?{}:lista[ed]),
      code,
      marketplaceId:String(f.marketplaceId||"").trim().toUpperCase()||mpInfo(code).id||null,
      quantity:num(f.quantity)??8, leadtime:num(f.leadtime)??4,
      minStock:num(f.minStock), maxQty:num(f.maxQty),
      enabled:!!f.enabled, onlyMapped:!!f.onlyMapped,
    };
    // i campi lasciati vuoti non devono finire nella config come undefined:
    // togliendoli, la risoluzione ricade sul valore globale
    for(const k of ["minStock","maxQty"]) if(m[k]===undefined) delete m[k];
    // la blacklist di un marketplace nuovo parte vuota, e deve essere un array
    // esplicito: "assente" significherebbe "eredita quella storica"
    if(!Array.isArray(m.blacklist)) m.blacklist=[];
    const l=[...lista];
    ed==="new"?l.push(m):(l[ed]=m);
    save({...c,marketplaces:l});
    sEd(null);
  };

  const rm=i=>{
    if(i===0&&lista.length>1){
      alert("Non puoi togliere il primo marketplace mentre ce ne sono altri: è quello che eredita i dati storici (template, registro, mappa ASIN). Sposta prima l'ordine, oppure disattivalo con la spunta.");
      return;
    }
    const m=lista[i];
    if(!confirm(`Togliere ${mpInfo(m.code).name}? La configurazione si perde. Se vuoi solo sospenderlo, togli la spunta "attivo": i dati restano.`))return;
    save({...c,marketplaces:lista.filter((_,j)=>j!==i)},{shrinkOk:true});
  };

  return(
    <div>
      <Card style={{background:"var(--info-bg)",border:"1px solid var(--info-border)"}}>
        <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
          <span style={{fontSize:24}}>🌍</span>
          <div style={{fontSize:12,color:"var(--info-text)",lineHeight:1.6}}>
            <div style={{fontWeight:700,marginBottom:4}}>Un catalogo per marketplace</div>
            Ogni marketplace ha <strong>template, registro delle SKU, mappa ASIN e blacklist separati</strong>. Non è
            pignoleria: dieci nomi di colonna del template contengono l'id del marketplace, e un registro condiviso
            farebbe spegnere a vicenda gli EAN presenti su un solo catalogo.
            <div style={{marginTop:8,paddingTop:8,borderTop:"1px solid var(--info-border)"}}>
              Il <strong>primo</strong> della lista è il primario: è quello che eredita i dati di quando esisteva un
              solo marketplace. I campi lasciati vuoti prendono il valore dal tab ⚙️ Regole.
            </div>
          </div>
        </div>
      </Card>

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,marginTop:14}}>
        <h3 style={{margin:0,color:"var(--text)",fontSize:17}}>Marketplace <span style={{color:"var(--text-muted)",fontWeight:400,fontSize:13}}>({lista.length})</span></h3>
        <Btn onClick={nw}>+ Aggiungi</Btn>
      </div>

      {lista.length===0&&ed===null&&<Card><p style={{color:"var(--text-muted)",textAlign:"center",margin:0}}>Nessun marketplace configurato.</p></Card>}

      {lista.map((m,i)=>{
        const st=mkSettings(c,m.code);
        const spento=m.enabled===false;
        return(
          <Card key={i} style={spento?{opacity:.6}:undefined}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap"}}>
              <div style={{flex:1,minWidth:240}}>
                <strong style={{color:"var(--text)",fontSize:15}}>{mpInfo(m.code).name}</strong>
                {i===0&&<span style={{...S.badge("var(--badge-neutral)"),marginLeft:8}}>primario</span>}
                {spento&&<span style={{...S.badge("var(--badge-neutral)"),marginLeft:8}}>non attivo</span>}
                <div style={{marginTop:6,display:"flex",gap:6,flexWrap:"wrap"}}>
                  <span style={S.badge("var(--badge-neutral)")}>Qty {st.quantity}</span>
                  <span style={S.badge("var(--badge-neutral)")}>Gestione {st.leadtime}gg</span>
                  <span style={S.badge("var(--badge-neutral)")}>Stock min {st.minStock}</span>
                  <span style={S.badge("var(--badge-neutral)")}>Tetto {st.maxQty||"nessuno"}</span>
                  <span style={S.badge("var(--badge-neutral)")}>Blacklist {st.blacklist.length}</span>
                  {st.onlyMapped&&<span style={S.badge("var(--badge-neutral)")}>solo ASIN verificati</span>}
                </div>
                <div style={{marginTop:6,fontSize:11,color:"var(--text-muted)",fontFamily:"monospace"}}>
                  {m.marketplaceId||mpInfo(m.code).id||"id marketplace non impostato"}
                </div>
              </div>
              <div style={{display:"flex",gap:6}}>
                <Btn v="ghost" onClick={()=>apri(i)}>Modifica</Btn>
                <Btn v="danger" onClick={()=>rm(i)}>✕</Btn>
              </div>
            </div>
          </Card>
        );
      })}

      {ed!==null&&(
        <Card accent="var(--accent)">
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:"0 14px"}}>
            <Sel label="Marketplace" value={f.code}
              onChange={e=>{const code=e.target.value;sF({...f,code,marketplaceId:mpInfo(code).id||""})}}
              options={EU_MP.map(m=>({v:m.code,l:m.name}))}/>
            <Inp label="Id marketplace" value={f.marketplaceId} placeholder="es. A1PA6795UKMFR9"
              onChange={e=>sF({...f,marketplaceId:e.target.value})}/>
            <Inp label="Quantità fallback" type="number" value={f.quantity} onChange={e=>sF({...f,quantity:e.target.value})}/>
            <Inp label="Tempo di gestione (gg)" type="number" value={f.leadtime} onChange={e=>sF({...f,leadtime:e.target.value})}/>
            <Inp label="Stock minimo (vuoto = come Regole)" type="number" value={f.minStock} onChange={e=>sF({...f,minStock:e.target.value})}/>
            <Inp label="Tetto quantità (vuoto = come Regole)" type="number" value={f.maxQty} onChange={e=>sF({...f,maxQty:e.target.value})}/>
          </div>
          <div style={{display:"flex",gap:18,flexWrap:"wrap",margin:"4px 0 10px"}}>
            <label style={{display:"flex",gap:8,alignItems:"center",fontSize:13,color:"var(--text)",cursor:"pointer"}}>
              <input type="checkbox" checked={!!f.enabled} onChange={e=>sF({...f,enabled:e.target.checked})}/>
              Attivo <span style={{color:"var(--text-muted)",fontSize:11}}>(se spento non genera file, ma non perde nulla)</span>
            </label>
            <label style={{display:"flex",gap:8,alignItems:"center",fontSize:13,color:"var(--text)",cursor:"pointer"}}>
              <input type="checkbox" checked={!!f.onlyMapped} onChange={e=>sF({...f,onlyMapped:e.target.checked})}/>
              Pubblica solo gli EAN con ASIN verificato
            </label>
          </div>
          <p style={{margin:"0 0 10px",fontSize:11,color:"var(--text-muted)",lineHeight:1.6}}>
            L'id marketplace si usa per rifiutare un template scaricato dal marketplace sbagliato. Se non lo conosci
            lascialo vuoto: al primo caricamento del template lo si legge da lì.
          </p>
          <div style={{display:"flex",gap:8}}><Btn v="ok" onClick={sv}>Salva</Btn><Btn v="ghost" onClick={()=>sEd(null)}>Annulla</Btn></div>
        </Card>
      )}
    </div>
  );
}

// ─── BlacklistTab ────────────────────────────────────────────────────────────
function BlacklistTab({config:c,save,pronto=true,mk,setMk}){
  const[inp,sInp]=useState("");
  const[esito,sEsito]=useState(null);
  // La blacklist e' per marketplace: le autorizzazioni marca e i blocchi valgono
  // su un catalogo alla volta. WESTLAKE bloccata su IT puo' essere vendibile su DE.
  const code=mk||mpPrimary(c);
  const idx=(c.marketplaces||[]).findIndex(m=>String(m.code).toUpperCase()===code);
  const lista=mkSettings(c,code).blacklist;
  /** Scrive la lista sul marketplace scelto. Sempre come array esplicito:
      "assente" significherebbe "eredita quella storica". */
  const salvaLista=(nuova,opts)=>{
    if(idx<0){ save({...c,blacklist:nuova},opts); return }
    const l=(c.marketplaces||[]).map((m,j)=>j===idx?{...m,blacklist:nuova}:m);
    const patch={...c,marketplaces:l};
    // il campo storico segue il primario, cosi' un client vecchio vede il vero
    if(idx===0) patch.blacklist=nuova;
    save(patch,opts);
  };

  // Qualunque carattere non numerico separa. Prima lo split era /[\n,;\s]+/ con
  // il solo filtro length>=8: una lista incollata con un separatore insolito
  // (per esempio "\u00d7") diventava UN unico token di migliaia di caratteri,
  // accettato perche' lungo, e la blacklist sembrava piena senza bloccare nulla.
  // In piu' il controllo sui duplicati guardava solo la lista gia' salvata,
  // quindi lo stesso EAN ripetuto nello stesso incolla entrava due volte.
  const add=()=>{
    const grezzi=inp.split(/\D+/).filter(Boolean);
    const presenti=new Set(lista), visti=new Set();
    const scartati=[], nuovi=[]; let ripetuti=0, gia=0;
    for(const g of grezzi){
      const e=normalizeEAN(g);
      if(!e){ scartati.push(g); continue }
      if(visti.has(e)){ ripetuti++; continue }
      visti.add(e);
      if(presenti.has(e)){ gia++; continue }
      nuovi.push(e);
    }
    sEsito({letti:grezzi.length,aggiunti:nuovi.length,gia,ripetuti,scartati});
    // Set anche in scrittura: ripara una lista che contenga gia' dei doppioni.
    if(nuovi.length) salvaLista([...new Set([...lista,...nuovi])]);
    if(nuovi.length||gia||ripetuti) sInp("");
  };

  // Riparazione della lista salvata: doppioni o voci non valide finite dentro
  // prima del fix qui sopra.
  const sporche=lista.filter(e=>!normalizeEAN(e));
  const doppi=lista.length-new Set(lista).size;
  const pulisci=()=>{
    const ok=[...new Set(lista.map(e=>normalizeEAN(e)).filter(Boolean))];
    sEsito({letti:lista.length,aggiunti:0,gia:0,ripetuti:doppi,scartati:sporche.map(e=>String(e).slice(0,24))});
    salvaLista(ok,{shrinkOk:true});
  };

  // Queste tre riducono la blacklist su richiesta esplicita: il server accetta
  // un accorciamento solo con questo flag, cosi' un salvataggio qualunque che
  // arrivi con una blacklist piu' corta viene rifiutato invece di cancellare.
  const rm=ean=>salvaLista(lista.filter(e=>e!==ean),{shrinkOk:true});
  const clr=()=>{ if(confirm(`Svuotare la blacklist di ${mpInfo(code).name}? Perderai tutti i ${lista.length} EAN.`)) salvaLista([],{shrinkOk:true}) };
  return(
    <div>
      <MarketPicker config={c} value={code} onChange={setMk}/>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <h3 style={{margin:0,color:"var(--text)",fontSize:17}}>Blacklist EAN <span style={{color:"var(--text-muted)",fontWeight:400,fontSize:13}}>({lista.length}) · {mpInfo(code).name}</span></h3>
        {lista.length>0&&<Btn v="danger" onClick={clr} style={{fontSize:11}}>Svuota tutto</Btn>}
      </div>
      {(sporche.length>0||doppi>0)&&(
        <Card accent="var(--warn)">
          <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
            <span style={{color:"var(--warn)",fontSize:13,flex:1,minWidth:220}}>
              ⚠️ La lista salvata contiene {doppi>0?`${doppi} ${doppi===1?"doppione":"doppioni"}`:""}{doppi>0&&sporche.length>0?" e ":""}
              {sporche.length>0?`${sporche.length} ${sporche.length===1?"voce che non è un EAN valido":"voci che non sono EAN validi"}`:""}. Non bloccano niente, ma vanno tolte.
            </span>
            <Btn v="ok" onClick={pulisci} style={{fontSize:12}}>🧹 Pulisci la lista</Btn>
          </div>
        </Card>
      )}

      <Card>
        <label style={S.label}>Aggiungi EAN — il separatore non conta: righe, virgole, punti e virgola, ×, spazi</label>
        <textarea value={inp} onChange={e=>sInp(e.target.value)} rows={4} placeholder={"5420068605613\n5420068605620\n\noppure: 5420068605613\u00d75420068605620\u00d7..."} style={{...S.input,resize:"vertical",fontFamily:"monospace",fontSize:13}}/>
        <div style={{marginTop:8,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <Btn v="ok" onClick={add} disabled={!pronto}>+ Aggiungi alla blacklist</Btn>
          <span style={{fontSize:11,color:"var(--text-muted)"}}>
            Gli EAN già presenti e quelli ripetuti vengono ignorati: scriverli due volte non li duplica.
          </span>
        </div>
      </Card>

      {esito&&(
        <Card accent={esito.scartati.length?"var(--warn)":"var(--ok)"}>
          <p style={{margin:0,fontSize:13,lineHeight:1.7,color:"var(--text)"}}>
            Letti <strong>{esito.letti.toLocaleString()}</strong> numeri:
            {" "}<strong style={{color:"var(--ok)"}}>{esito.aggiunti.toLocaleString()} aggiunti</strong>
            {esito.gia>0&&<> · {esito.gia.toLocaleString()} già in lista</>}
            {esito.ripetuti>0&&<> · {esito.ripetuti.toLocaleString()} ripetuti nell’incolla</>}
            {esito.scartati.length>0&&<> · <span style={{color:"var(--warn)"}}>{esito.scartati.length.toLocaleString()} scartati</span> perché non sono EAN validi</>}
            {esito.scartati.length>0&&(
              <span style={{display:"block",marginTop:6,fontFamily:"monospace",fontSize:11,color:"var(--text-muted)",wordBreak:"break-all"}}>
                {esito.scartati.slice(0,8).join(" \u00b7 ")}{esito.scartati.length>8?` \u2026 e altri ${esito.scartati.length-8}`:""}
              </span>
            )}
          </p>
        </Card>
      )}
      {lista.length>0&&<Card><div style={{maxHeight:300,overflowY:"auto",display:"flex",flexWrap:"wrap",gap:6}}>
        {lista.map(ean=>(
          <span key={ean} style={{background:"var(--bl-bg)",border:"1px solid var(--bl-border)",color:"var(--bl-text)",padding:"4px 10px",borderRadius:8,fontSize:12,fontFamily:"monospace",display:"inline-flex",alignItems:"center",gap:6}}>
            {ean}<button onClick={()=>rm(ean)} style={{background:"none",border:"none",color:"var(--bl-text)",cursor:"pointer",fontSize:14,padding:0,lineHeight:1}}>×</button>
          </span>
        ))}
      </div></Card>}
    </div>
  );
}

// ─── ConvertTab (caricamento manuale dei CSV) ────────────────────────────────
// Percorso di riserva: quando l'FTP non è raggiungibile carichi i CSV a mano.
// Non applica la disattivazione a quantità 0 (non conosce lo storico delle SKU
// pubblicate, che vive lato server): produce solo le righe degli articoli attivi.

function resolveDuplicate(existing,candidate,mode,supplierPriority){
  if(mode==="priority"){
    const pa=supplierPriority[existing.supplier]??999;
    const pb=supplierPriority[candidate.supplier]??999;
    if(pb<pa)return candidate;
    if(pb===pa&&candidate.price<existing.price)return candidate;
    return existing;
  }
  return candidate.price<existing.price?candidate:existing;
}

function ConvertTab({config:c}){
  const[ups,sUps]=useState({});
  const[mpC,sMpC]=useState(c.marketplaces[0]?.code||"");
  const[qtyMode,sQtyMode]=useState(c.qtyMode||"catalog");
  const[dupMode,sDupMode]=useState(c.dupMode||"price");
  const[progress,setProgress]=useState(null);
  const[res,sRes]=useState(null);
  const[saving,setSaving]=useState(false);

  const hFile=useCallback((sn,file)=>{if(!file)return;sRes(null);const r=new FileReader();r.onload=e=>{sUps(p=>({...p,[sn]:{fn:file.name,d:e.target.result}}))};r.readAsText(file,"utf-8")},[]);
  const rmUp=n=>{sUps(p=>{const x={...p};delete x[n];return x});sRes(null);};

  const supplierPriority=Object.fromEntries(c.suppliers.map((s,i)=>[s.name,i]));

  const convert=useCallback(()=>{
    const mp=c.marketplaces.find(m=>m.code===mpC);if(!mp)return;
    sRes(null);
    setTimeout(()=>{
      setProgress({phase:1,pct:5,msg:"Lettura file fornitori..."});
      // Le stesse impostazioni che usa il server per questo marketplace: se qui
      // si leggessero i valori globali, il file generato a mano differirebbe da
      // quello del job automatico senza che niente lo segnali.
      const st=mkSettings(c,mpC);
      const bl=new Set(st.blacklist);
      const em={};
      let tR=0,tS=0,badEan=0,dup=0,blk=0,below=0;
      const errs=[];
      const tierCounts={},tierPriceSum={};
      const entries=Object.entries(ups);
      const total=entries.length;
      const minStock=Number(st.minStock||0);
      const maxQty=Number(st.maxQty||0);
      const floorPct=Number(c.floorMarginPct??0);

      const step=idx=>{
        if(idx>=total){
          setProgress({phase:2,pct:80,msg:"Costruzione righe..."});
          setTimeout(()=>{
            if(errs.length&&Object.keys(em).length===0){sRes({error:errs.join("\n")});setProgress(null);return;}
            const sorted=Object.values(em).sort((a,b)=>a.ean.localeCompare(b.ean));
            const records=[],previewData=[],sc={};
            let priceSum=0;
            for(const it of sorted){
              const raw=qtyMode==="fixed"?Number(st.quantity):(it.stock!==null?it.stock:Number(st.quantity));
              const qty=maxQty>0?Math.min(raw,maxQty):raw;
              const rec={sku:it.sku,ean:it.ean,qty:qty,price:Math.round(it.price*100)/100};
              if(floorPct>0)rec.minPrice=Math.round(it.rp*(1+floorPct/100)*100)/100;
              records.push(rec);
              sc[it.supplier]=(sc[it.supplier]||0)+1;
              tierCounts[it.tierKey]=(tierCounts[it.tierKey]||0)+1;
              tierPriceSum[it.tierKey]=(tierPriceSum[it.tierKey]||0)+it.rp;
              priceSum+=it.rp;
              if(previewData.length<50)previewData.push({sku:it.sku,ean:it.ean,costPrice:it.rp,salePrice:it.price,supplier:it.supplier,qty:String(qty),tierKey:it.tierKey,status:"attivo"});
            }
            const avg_price_by_tier={};
            Object.keys(tierCounts).forEach(k=>{avg_price_by_tier[k]=tierPriceSum[k]/tierCounts[k]});
            setProgress({phase:3,pct:100,msg:"✓ Completato"});
            setTimeout(()=>{
              setProgress(null);
              sRes({
                records:records,
                warnings:errs,
                stats:{marketplace:mpC,leadtime:st.leadtime,total_products:sorted.length,total_rows:records.length,
                  zeroed:0,dropped_from_tracking:0,total_read:tR,total_skipped:tS,bad_ean:badEan,
                  below_min_stock:below,duplicates_resolved:dup,blacklisted:blk,by_supplier:sc,by_tier:tierCounts,
                  avg_price_by_tier:avg_price_by_tier,avg_price_total:sorted.length>0?priceSum/sorted.length:0,
                  errors:errs,previewData:previewData,generated_at:new Date().toISOString()}
              });
            },300);
          },50);
          return;
        }
        const pct=5+Math.round((idx/total)*70);
        const[sn,up]=entries[idx];
        setProgress({phase:1,pct,msg:"Elaborazione "+sn+" ("+(idx+1)+"/"+total+")..."});
        setTimeout(()=>{
          const sup=c.suppliers.find(s=>s.name===sn);
          if(!sup){step(idx+1);return;}
          const{h,r}=parseCSV(up.d,sup.delimiter);
          if(!h.length){errs.push(sn+": CSV vuoto o illeggibile");step(idx+1);return;}
          const skC=fCol(h,sup.skuCol),enC=fCol(h,sup.eanCol),prC=fCol(h,sup.priceCol);
          const stC=sup.stockCol?fCol(h,sup.stockCol):null;
          if(!skC||!enC||!prC){errs.push(sn+": colonne non trovate: "+[!skC&&sup.skuCol,!enC&&sup.eanCol,!prC&&sup.priceCol].filter(Boolean).join(", "));step(idx+1);return;}
          if(sup.stockCol&&!stC)errs.push(sn+": colonna stock '"+sup.stockCol+"' non trovata, uso la quantità di fallback");
          for(const row of r){
            tR++;
            const ean=normalizeEAN(row[enC]);
            const sku=(row[skC]||"").trim();
            const rp=parseFloat((row[prC]||"0").replace(",","."));
            if(!ean){badEan++;tS++;continue;}
            if(!sku||isNaN(rp)||rp<=0){tS++;continue;}
            if(bl.has(ean)){blk++;continue;}
            let stock=null;
            if(stC){
              const parsed=parseInt(String(row[stC]||"").replace(/[^\d-]/g,""),10);
              stock=Number.isFinite(parsed)?Math.max(0,parsed):0;
            }
            if(stock!==null&&minStock>0&&stock<minStock){below++;continue;}
            const tiers=tiersForClient(sup,mpC);
            const candidate={sku,ean,price:applyTiers(rp,tiers),supplier:sn,stock,tierKey:tierKeyFor(rp,tiers),rp};
            if(em[ean]){dup++;em[ean]=resolveDuplicate(em[ean],candidate,dupMode,supplierPriority);}
            else em[ean]=candidate;
          }
          step(idx+1);
        },10);
      };
      step(0);
    },30);
  },[ups,mpC,qtyMode,dupMode,c]);

  const saveToHistory=async()=>{
    if(!res?.stats)return;setSaving(true);
    try{
      const r=await fetch("/api/history",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...res.stats,source:"manuale"})});
      if(!r.ok)throw new Error("HTTP "+r.status);
      alert("✓ Salvato nello storico");
    }catch(e){alert("Errore: "+e.message)}
    finally{setSaving(false)}
  };

  if(!c.suppliers.length||!c.marketplaces.length)return<Card><p style={{color:"var(--warn)",textAlign:"center",margin:0}}>⚠️ Configura almeno un fornitore e un marketplace.</p></Card>;
  const uc=Object.keys(ups).length;

  return(
    <div>
      <Card style={{background:"var(--info-bg)",border:"1px solid var(--info-border)"}}>
        <div style={{fontSize:12,color:"var(--info-text)",lineHeight:1.6}}>
          <strong>Percorso di riserva.</strong> Da qui carichi i CSV a mano quando l'FTP non risponde.
          A differenza del tab 🤖 Auto, questo file contiene solo gli articoli disponibili: non aggiunge le
          righe a quantità 0 per gli articoli spariti dal listino, perché lo storico delle SKU pubblicate
          vive lato server. Per la sincronizzazione quotidiana usa il tab Auto.
        </div>
      </Card>

      <Card>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:14}}>
          <Sel label="Marketplace" value={mpC} onChange={e=>{sMpC(e.target.value);sRes(null);}}
            options={c.marketplaces.map(m=>({v:m.code,l:(EU_MP.find(x=>x.code===m.code)||{}).name||m.code}))}/>
          <Sel label="Sorgente quantità" value={qtyMode} onChange={e=>{sQtyMode(e.target.value);sRes(null);}}
            options={[{v:"catalog",l:"📦 Stock fornitore"},{v:"fixed",l:"🔒 Quantità fissa"}]}/>
          <Sel label="EAN duplicati" value={dupMode} onChange={e=>{sDupMode(e.target.value);sRes(null);}}
            options={[{v:"price",l:"💰 Prezzo più basso"},{v:"priority",l:"⭐ Priorità fornitore"}]}/>
        </div>
        {dupMode==="priority"&&<p style={{fontSize:11,color:"var(--text-muted)",margin:0}}>💡 La priorità segue l'ordine nel tab 🏭 Fornitori: {c.suppliers.map(s=>s.name).join(" → ")||"—"}</p>}
      </Card>

      <div style={{marginBottom:14}}>
        <label style={{...S.label,marginBottom:10}}>Carica i cataloghi fornitori</label>
        {c.suppliers.map((sup,si)=>{const u=ups[sup.name];return(
          <Card key={sup.name} style={{padding:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                {dupMode==="priority"&&<span style={{background:"var(--badge-neutral)",color:"var(--text)",borderRadius:6,padding:"1px 7px",fontSize:11,fontWeight:700}}>#{si+1}</span>}
                <strong style={{color:"var(--text)",fontSize:14}}>{sup.name}</strong>
                <span style={{...S.badge("var(--badge-ok)"),fontSize:10}}>{sup.tiers?sup.tiers.length+" fasce":"flat"}</span>
                {sup.stockCol&&<span style={S.badge("var(--badge-info)")}>Stock: {sup.stockCol}</span>}
              </div>
              {u&&<p style={{color:"var(--ok)",fontSize:12,margin:"4px 0 0"}}>✓ {u.fn}</p>}
            </div>
            <div style={{display:"flex",gap:6}}>
              {u&&<Btn v="danger" onClick={()=>rmUp(sup.name)} style={{fontSize:11,padding:"5px 10px"}}>✕</Btn>}
              <label style={{padding:"8px 16px",borderRadius:8,background:u?"var(--border)":"var(--accent)",color:u?"var(--text)":"#fff",fontWeight:600,fontSize:13,cursor:"pointer"}}>
                {u?"Sostituisci":"Carica CSV"}<input type="file" accept=".csv,.txt,.tsv" style={{display:"none"}} onChange={e=>hFile(sup.name,e.target.files[0])}/>
              </label>
            </div>
          </Card>
        );})}
      </div>

      <div style={{textAlign:"center",marginBottom:14}}>
        <Btn v="ok" onClick={convert} disabled={uc===0||!!progress} style={{padding:"12px 40px",fontSize:15}}>
          {progress?"⏳ Elaborazione...":"⚡ Genera file"}
          {!progress&&" ("+uc+" "+(uc===1?"fornitore":"fornitori")+")"}
        </Btn>
      </div>

      {progress&&(
        <Card accent="var(--accent)">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <span style={{fontSize:13,color:"var(--text)",fontWeight:600}}>{progress.msg}</span>
            <span style={{fontSize:12,color:"var(--accent-form)",fontWeight:700}}>{progress.pct}%</span>
          </div>
          <div style={{background:"var(--bg-input)",borderRadius:6,height:8,overflow:"hidden"}}>
            <div style={{height:"100%",width:progress.pct+"%",background:"linear-gradient(90deg,var(--accent),var(--ok))",borderRadius:6,transition:"width .3s ease"}}/>
          </div>
        </Card>
      )}

      {res?.error&&<Card accent="var(--bad)"><p style={{color:"var(--bad)",margin:0,whiteSpace:"pre-wrap"}}>❌ {res.error}</p></Card>}

      {res?.records&&(
        <div>
          <Card accent="var(--ok)">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14,flexWrap:"wrap",gap:8}}>
              <h4 style={{color:"var(--ok)",margin:0}}>✓ File generato</h4>
              <Btn v="ghost" onClick={saveToHistory} disabled={saving} style={{fontSize:13}}>{saving?"Salvataggio...":"📊 Salva nello storico"}</Btn>
            </div>
            <DownloadBox records={res.records} stats={res.stats} label={res.records.length.toLocaleString()+" righe"}/>
            <div style={{height:14}}/>
            <StatsBlock stats={res.stats}/>
          </Card>
          <PreviewTable previewData={res.stats.previewData} total={res.stats.total_rows}/>
        </div>
      )}
    </div>
  );
}
